<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V1250 - SUPREMACIA SN</title>
    <style>
        :root { --gold: #D4AF37; --pink: #ff00ff; --red: #ff1744; --purple: #a020f0; --cyan: #00f3ff; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master { border: 2px solid var(--gold); border-radius: 25px; padding: 15px; max-width: 380px; margin: auto; background: #050505; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
        .box { padding: 10px; border-radius: 8px; font-size: 10px; background: #111; color: #444; border: 1px solid #222; font-weight: bold; }
        .v-active { background: var(--red) !important; color: #fff !important; box-shadow: 0 0 10px var(--red); }
        .ro-active { background: var(--purple) !important; color: #fff !important; box-shadow: 0 0 10px var(--purple); }
        .rs-active { background: var(--pink) !important; color: #fff !important; box-shadow: 0 0 15px var(--pink); }
        .visor { border: 1px solid var(--gold); border-radius: 15px; padding: 10px; margin-bottom: 10px; }
        #percent { font-size: 3.5em; color: var(--gold); font-weight: 900; display: block; }
        #msg { font-size: 10px; background: var(--gold); color: #000; padding: 3px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .btn { background: var(--gold); color: #000; padding: 18px; border-radius: 12px; font-size: 1.1em; font-weight: 900; width: 100%; border: none; cursor: pointer; text-transform: uppercase; }
        .hist { background: #000; border: 1px solid #333; border-radius: 12px; padding: 10px; text-align: left; height: 110px; overflow-y: auto; margin-top: 10px; }
        .hist-item { font-family: monospace; font-size: 10px; border-bottom: 1px solid #1a1a1a; padding: 5px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="master">
        <div style="font-size:10px; color:var(--gold); margin-bottom:10px;">SN // ENGLOBAMENTO TOTAL V1250</div>
        <div class="espectro">
            <div id="v" class="box">VÁCUO</div>
            <div id="ro" class="box">ROXO</div>
            <div id="rs" class="box">ROSA</div>
        </div>
        <div class="visor">
            <span id="percent">0%</span>
            <div id="msg">SINCRO PRONTA</div>
        </div>
        <button class="btn" onclick="execAtaque()">ATAQUE ESPELHADO 🔱</button>
        <div class="hist" id="log"><div class="hist-item" style="color:gray;">> AGUARDANDO COMANDO...</div></div>
    </div>

    <script>
        let b = false;
        let protecaoRessaca = 0; // Memória de rodadas após Rosa [cite: 2026-01-23]

        function execAtaque() {
            if(b) return; b = true;
            const v=document.getElementById('v'), ro=document.getElementById('ro'), rs=document.getElementById('rs'), m=document.getElementById('msg'), p=document.getElementById('percent'), l=document.getElementById('log');
            [v,ro,rs].forEach(e=>e.className='box');
            m.innerText = "CONTRA-ATAQUE: CALCULANDO ISCAS...";

            setTimeout(() => {
                let n = Math.random()*100;
                let c="", x=0, hex="", veredito="";

                // ENGLOBADO: Filtro de Ressaca Rosa [cite: 2025-12-29]
                if(protecaoRessaca > 0 && protecaoRessaca < 3) { n = 5; protecaoRessaca++; }

                if(n < 15) { 
                    v.className='box v-active'; c="VÁCUO"; x=1.00; hex="var(--red)"; veredito="PULA (Ressaca/Vácuo)";
                } else if(n < 30) { 
                    // ENGLOBADO: Ajuste Anti-Isca (Vácuo que vira Roxo) [cite: 2026-02-13]
                    ro.className='box ro-active'; c="ISCA ROXA"; x=1.50; hex="var(--cyan)"; veredito="ENTRA (Rápido)";
                } else if(n < 85) { 
                    ro.className='box ro-active'; c="ROXO"; x=(Math.random()*(4-2)+2)*0.5; hex="var(--purple)"; veredito="ENTRA (Confirmado)";
                    protecaoRessaca = 0;
                } else { 
                    rs.className='box rs-active'; c="ROSA"; hex="var(--pink)"; x=(Math.random()*(60-20)+20)*0.5; veredito="ATAQUE (Estouro Rosa!)"; 
                    protecaoRessaca = 1; 
                }

                m.innerText = "VEREDITO: " + veredito;
                l.innerHTML = `<div class="hist-item" style="color:${hex}">> ${c} | SAÍDA: ${x.toFixed(2)}x</div>` + l.innerHTML;
                
                let ct=0;
                let t = setInterval(()=>{ ct+=4; p.innerText = ct+"%"; if(ct>=96){ clearInterval(t); b=false; } }, 25);
            }, 1000);
        }
    </script>
</body>
</html>
