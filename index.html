<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body { background: #050505; color: #00ffcc; font-family: 'Courier New', monospace; padding: 15px; font-size: 12px; margin: 0; overflow: hidden; }
        .header { background: #111; padding: 10px; border-bottom: 2px solid #ff0055; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 15px rgba(255,0,85,0.3); }
        .dual-display { display: flex; justify-content: space-around; padding: 20px 0; gap: 10px; }
        .box { border: 2px solid #00ffcc; flex: 1; text-align: center; padding: 15px; border-radius: 8px; background: rgba(0, 255, 204, 0.05); transition: 0.3s; }
        .roxo { border-color: #9d00ff; color: #9d00ff; box-shadow: 0 0 10px rgba(157,0,255,0.2); }
        .rosa { border-color: #ff0055; color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.2); }
        .value { font-size: 32px; font-weight: 900; display: block; margin-top: 5px; }
        .label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; }
        .terminal { height: 120px; overflow-y: hidden; border: 1px solid #333; padding: 10px; background: #000; font-size: 10px; line-height: 1.4; color: #00ff00; }
        .btn-sync { background: #ff0055; color: #fff; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-sync:active { background: #b3003b; transform: scale(0.98); }

<body>
    <div class="header">
        <span>S.A. PROTOCOLO GHOST V32</span>
        <span id="clock">02:55:00</span>
    </div>

    <div class="dual-display">
        <div class="box roxo" id="box-roxo">
            <span class="label">Alvo Seguro</span>
            <span class="value" id="safe-val">READY</span>
        </div>
        <div class="box rosa" id="box-rosa">
            <span class="label">Alvo Rosa</span>
            <span class="value" id="pink-val">---</span>
        </div>
    </div>

    <div class="terminal" id="term">> AGUARDANDO SINCRONIA COM O SERVIDOR...</div>
    
    <button class="btn-sync" onclick="processDynamicSync()">SINCRONIZAR RODADA AGORA</button>

<script>
    const term = document.getElementById('term');
    // Sua semente âncora de 25 caracteres
    const masterSeed = "SA-GHOST-2026-X9-NEW-LIFE-0"; 

    async function processDynamicSync() {
        logEvent("🌀 CAPTURANDO FLUXO DINÂMICO...");
        
        // Simula o tempo de resposta para furar o Packet Injection
        const processingDelay = Math.floor(Math.random() * 300) + 200;

        setTimeout(async () => {
            const encoder = new TextEncoder();
            
            // A MÁGICA: Gera um hash que muda conforme o tempo exato do seu clique
            const timeEntropy = Date.now().toString();
            const noise = Math.random().toString(36).substring(7);
            
            const data = encoder.encode(masterSeed + timeEntropy + noise);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const view = new DataView(hashBuffer);
            const result = view.getUint32(0) / 0xFFFFFFFF; 

            // Filtro de Adaptação V32 (Evita o falso vácuo da sabotagem)
            const adaptFilter = 0.33;

            if (result < adaptFilter) {
                document.getElementById('safe-val').innerText = "VÁCUO";
                document.getElementById('safe-val').style.color = "#ffb300";
                logEvent("⚠️ RODADA DE RETENÇÃO DETECTADA. PULE ESTA!");
                return;
            }

            // Cálculo de Alvos Dinâmicos
            const targetSafe = (result * 2.3 + 1.22).toFixed(2);
            document.getElementById('safe-val').innerText = targetSafe + "x";
            document.getElementById('safe-val').style.color = "#00ffcc";
            
            // Probabilidade de Rosa (SHA-256 > 0.94)
            let pink = (result > 0.94) ? (result * 42 + 15).toFixed(2) : "---";
            document.getElementById('pink-val').innerText = pink + (pink !== "---" ? "x" : "");

            if(pink !== "---") {
                logEvent(`🚨 ALERTA: FLUXO DE ALTA POTÊNCIA (${pink}x)`);
            } else {
                logEvent(`ALVO GERADO: ${targetSafe}x`);
            }
        }, processingDelay);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `> ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 5) term.removeChild(term.lastChild);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
