<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S.A._V83_QUANTUM_FLOOD_20B</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: #000; color: #d0d0d0; font-family: 'Courier New', monospace; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #main-shell { flex: 1; display: flex; flex-direction: column; padding: 15px; border: 4px solid #111; position: relative; background: radial-gradient(circle at center, #050505 0%, #000 100%); }
        
        .sa-header { border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 10px; color: #444; }
        .flood-bar { background: #080808; height: 4px; width: 100%; margin-bottom: 10px; position: relative; overflow: hidden; border-radius: 2px; }
        .flood-progress { height: 100%; background: #00ff41; width: 0%; transition: width 0.1s; box-shadow: 0 0 10px #00ff41; }
        
        .seed-info { background: #050505; border: 1px solid #111; padding: 10px; font-size: 8px; color: #00ff41; margin-bottom: 10px; border-radius: 2px; display: flex; justify-content: space-between; }
        
        .quantum-display { background: #020202; border: 2px solid #1a1a1a; padding: 25px 10px; text-align: center; border-radius: 4px; position: relative; overflow: hidden; }
        .val-sa { font-size: 75px; font-weight: 900; color: #fff; margin: 5px 0; transition: all 0.2s; text-shadow: 0 0 20px rgba(0,255,65,0.1); }
        .status-ghost { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #ffcc00; height: 12px; font-weight: bold; }
        
        .btn-sa { background: #ffffff; color: #000; border: none; width: 100%; padding: 25px; font-size: 26px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: all 0.3s; border-radius: 4px; box-shadow: 0 6px 0 #444; position: relative; z-index: 10; }
        .btn-sa:active { transform: translateY(4px); box-shadow: 0 2px 0 #222; }
        .btn-sa:disabled { background: #0a0a0a; color: #222; cursor: not-allowed; border: 1px solid #111; box-shadow: none; }
        
        .metrics-sync { display: flex; gap: 8px; margin-top: 15px; }
        .m-card { flex: 1; background: #030303; border: 1px solid #111; padding: 10px; text-align: center; }
        .m-label { font-size: 7px; color: #333; margin-bottom: 4px; }
        .m-val { font-size: 16px; font-weight: 900; }

        .favelinha-box { margin-top: 15px; background: #020202; border: 1px solid #0d0d0d; flex: 1; overflow-y: auto; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #080808; color: #222; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 14px 12px; border-bottom: 1px solid #060606; color: #333; }
        .row-on { color: #fff !important; background: rgba(0,255,65,0.03); }
        .cmd-e { color: #00ff41 !important; font-weight: bold; }
        .cmd-p { color: #ff4141 !important; font-weight: bold; }
        .pink-v { color: #ff00ff !important; font-weight: bold; text-shadow: 0 0 10px #ff00ff; }
        
        .sa-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid #111; display: flex; justify-content: space-between; font-size: 9px; color: #222; }
        
        .noise-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.03; pointer-events: none; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAn97J6AAAABnRSTlMAAAAAAABupgeRAAAANUlEQVQ4y2NgGAWjYBSMglEwCkbBKJgFomAUjIJRMApGwSgYBaNgFIyCWSAKRsEomAWjYBSMAgAs4gFByXisWwAAAABJRU5ErkJggg=='); }
    </style>
</head>
<body>
<div id="main-shell">
    <div class="noise-bg"></div>
    <div class="sa-header"><span>S.A._V83_QUANTUM_FLOOD_OVERLOAD</span><span>00:22</span></div>
    
    <div class="flood-bar"><div id="flood-p" class="flood-progress"></div></div>
    
    <div class="seed-info">
        <span>SEED: xRLP7dk...</span>
        <span id="access-count" style="color:#00ff41">20,000,000,000 REQS</span>
    </div>

    <div class="quantum-display" id="q-core">
        <div class="status-ghost" id="ghost-status">SOBRECARREGANDO_FILTROS_HIPERBET</div>
        <div class="val-sa" id="val-sa">0.00x</div>
        <button class="btn-sa" id="btn-fire">EXECUTAR_OVERLOAD</button>
    </div>

    <div class="metrics-sync">
        <div class="m-card">
            <div class="m-label">LIBERADO</div>
            <div id="m-lib" class="m-val" style="color:#00ff41">--%</div>
        </div>
        <div class="m-card">
            <div class="m-label">PENDENTE</div>
            <div id="m-pen" class="m-val" style="color:#ffcc00">--%</div>
        </div>
        <div class="m-card">
            <div class="m-label">VÁCUO</div>
            <div id="m-vac" class="m-val" style="color:#ff00ff">0</div>
        </div>
    </div>

    <div class="favelinha-box">
        <table>
            <thead><tr><th>ALVO_X</th><th>S.A.(-50%)</th><th>STAKE</th><th>CMD</th></tr></thead>
            <tbody id="fav-body"></tbody>
        </table>
    </div>

    <div class="sa-footer">
        <span>STAKE: R$ 0,10 / R$ 0,20 / R$ 1,00</span>
        <span id="shield-info">ESCUDO_IPI: BLINDADO_20B_FLOOD</span>
    </div>
</div>

<script>
    (function() {
        const _K = { E: "RU5UUkE=", P: "UFVMQQ==", S1: "UiQgMCwxMA==", S2: "UiQgMCwyMA==", S3: "UiQgMSwwMA==" };
        const b = document.getElementById('btn-fire');
        const v = document.getElementById('val-sa');
        const f = document.getElementById('fav-body');
        const s = document.getElementById('ghost-status');
        const pr = document.getElementById('flood-p');

        let isCalc = false;
        let vacCount = 0;
        let history = [];

        function render(last) {
            if(last) history.unshift(last);
            if(history.length > 15) history.pop();
            
            const wins = history.filter(x => (x * 0.5) >= 1.5).length;
            const lib = Math.round((wins / (history.length || 1)) * 100);
            document.getElementById('m-lib').innerText = lib + "%";
            document.getElementById('m-pen').innerText = (100 - lib) + "%";
            document.getElementById('m-vac').innerText = vacCount;

            f.innerHTML = history.map((x, i) => {
                const saVal = (x * 0.5).toFixed(2);
                const isEntra = saVal >= 1.50;
                let stk = '---';
                if (saVal >= 50.00) stk = atob(_K.S3);
                else if (saVal >= 2.00) stk = atob(_K.S2);
                else if (isEntra) stk = atob(_K.S1);

                return `<tr class="${i===0?'row-on':''}">
                    <td>${x.toFixed(2)}x</td>
                    <td class="${x >= 100 ? 'pink-v' : ''}">${saVal}x</td>
                    <td>${stk}</td>
                    <td class="${isEntra?'cmd-e':'cmd-p'}">${isEntra?atob(_K.E):atob(_K.P)}</td>
                </tr>`;
            }).join('');
        }

        b.addEventListener('click', () => {
            if (isCalc) return;
            isCalc = true; b.disabled = true;
            v.style.opacity = "0.05";
            
            let flood = 0;
            const floodInt = setInterval(() => {
                flood += 5;
                pr.style.width = flood + "%";
                if(flood >= 100) clearInterval(floodInt);
            }, 30);

            s.innerText = "SOBRECARREGANDO_20B_ACESSOS...";

            setTimeout(() => {
                const r = Math.random();
                let raw, col, msg;

                // Após 1.00x e sobrecarga, o sistema força a leitura da Rosa
                if (history[0] <= 1.05 || vacCount >= 2) { 
                    raw = (110 + Math.random() * 890); 
                    col = "#ff00ff"; 
                    msg = "FLOOD_REVELOU_ROSA_CONFIRMADA"; 
                    vacCount = 0;
                } else if (r > 0.38) { 
                    raw = (4.0 + Math.random() * 12); 
                    col = "#fff"; 
                    msg = "ENTRA_ALVO_SEGURO_SAIDA_1.5X"; 
                    vacCount = 0;
                } else { 
                    raw = (1.0 + Math.random() * 0.03); 
                    col = "#444"; 
                    msg = "PULA_SABOTAGEM_IDENTIFICADA"; 
                    vacCount++;
                }

                const final = (raw * 0.5).toFixed(2);
                v.innerText = final + "x";
                v.style.color = col;
                v.style.opacity = "1";
                s.innerText = msg;
                b.innerText = final >= 1.50 ? atob(_K.E) : atob(_K.P);
                render(raw);
                
                setTimeout(() => { 
                    isCalc = false; b.disabled = false;
                    b.innerText = "NOVO_SCAN_FLOOD";
                    pr.style.width = "0%";
                }, 4500); 
            }, 3000);
        });

        // Seed histórico incluindo o corte de 1.00x
        [1.00, 2.49, 1.95, 7.54, 1.43, 6.96, 1.18, 4.26, 1.93, 1.12].forEach(x => render(x));
    })();
</script>
</body>
</html>
