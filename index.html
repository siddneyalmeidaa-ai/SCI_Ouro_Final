<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NASA SUPREMACY // S.I. 2026</title>
    <style>
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --cyan: #00f3ff; --red: #ff1744; --green: #00e676; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 2.5px solid var(--nasa); border-radius: 40px; padding: 20px; background: radial-gradient(circle at top, #0b3d9133, #000); box-shadow: 0 0 50px var(--nasa); max-width: 420px; margin: auto; }
        
        /* BOTÕES DE ESPECTRO DESBLOQUEADOS */
        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
        .box { padding: 12px; border-radius: 12px; font-size: 9px; background: #111; color: #666; border: 1.5px solid #222; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .v-active { background: var(--red) !important; color: white !important; box-shadow: 0 0 15px var(--red); border-color: #ff5f5f; }
        .ro-active { background: #6a0dad !important; color: white !important; box-shadow: 0 0 15px #6a0dad; border-color: #a020f0; }
        .rs-active { background: var(--pink) !important; color: white !important; box-shadow: 0 0 15px var(--pink); border-color: #ff69b4; }

        .radar-box { width: 110px; height: 110px; border: 3px solid var(--pink); border-radius: 50%; margin: 10px auto; position: relative; box-shadow: 0 0 25px var(--pink); overflow: hidden; }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--pink)); animation: rotate 0.8s linear infinite; opacity: 0.5; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .painel-voo { border: 2px solid var(--cyan); border-radius: 25px; padding: 25px; background: rgba(0, 243, 255, 0.03); margin-bottom: 10px; }
        #percentual { font-size: 5.5em; color: var(--cyan); display: block; line-height: 1; text-shadow: 0 0 30px var(--cyan); }
        .status-txt { font-size: 11px; color: var(--gold); margin-top: 5px; font-weight: bold; }

        .btn-ignicao { background: var(--pink); color: #fff; padding: 22px; border-radius: 25px; font-size: 1.5em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 35px var(--pink); text-transform: uppercase; }

        .hist-log { background: rgba(0,0,0,0.8); border-radius: 15px; padding: 12px; font-size: 9px; text-align: left; height: 100px; overflow-y: auto; border: 1px solid #1a1a1a; margin-top: 15px; font-family: monospace; }
        
        .footer-tools { background: #050505; border: 1.5px solid var(--gold); border-radius: 20px; padding: 15px; margin-top: 12px; text-align: left; font-size: 10px; }
        .btn-purga { background: var(--nasa); color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 9px; }
    </style>
</head>
<body>
    <div class="master-container">
        <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--nasa);">
            <span>S.A. V1250 // NASA_SUPREMACY</span>
            <span id="timer">04:24:00</span>
        </div>

        <div class="radar-box"><div class="radar-sweep"></div></div>

        <div class="espectro">
            <div id="btn-v" class="box" onclick="mudarModo('v')">VÁCUO</div>
            <div id="btn-ro" class="box" onclick="mudarModo('ro')">ROXO</div>
            <div id="btn-rs" class="box rs-active" onclick="mudarModo('rs')">ROSA</div>
        </div>

        <div class="painel-voo">
            <span id="percentual">0%</span>
            <div id="msg" class="status-txt">SENTINELA EM OBSERVAÇÃO</div>
        </div>

        <button class="btn-ignicao" onclick="atacar()">IGNIÇÃO NASA 🔱</button>

        <div class="hist-log" id="log">
            <div style="color:var(--cyan)">> [SISTEMA] MOTOR 3ms PRONTO.</div>
            <div style="color:var(--green)">> [SISTEMA] MÁSCARA IPI ATIVA.</div>
        </div>

        <div class="footer-tools">
            <b style="color:var(--gold)">DIAGNÓSTICO:</b> <span id="diag" style="color:var(--green)">100% LIBERADO</span> [cite: 2026-01-12]<br>
            <b style="color:var(--cyan)">PROGNÓSTICO:</b> ALVO 1.25x (LATÊNCIA ZERO)<br>
            <button class="btn-purga" onclick="purga()">EXECUTAR PURGA DE RASTREIO</button>
        </div>
    </div>

    <script>
        let rodando = false;
        function mudarModo(m) {
            document.querySelectorAll('.box').forEach(b => b.className = 'box');
            if(m === 'v') document.getElementById('btn-v').className = 'box v-active';
            if(m === 'ro') document.getElementById('btn-ro').className = 'box ro-active';
            if(m === 'rs') document.getElementById('btn-rs').className = 'box rs-active';
        }

        function purga() {
            const l = document.getElementById('log');
            l.innerHTML = `<div style="color:var(--gold)">> [AUTO] CACHE E ID PURGADOS DO SERVIDOR.</div>` + l.innerHTML;
        }

        async function atacar() {
            if(rodando) return;
            rodando = true;
            const p_txt = document.getElementById('percentual'), st = document.getElementById('msg');
            st.innerText = "ATROPELANDO LATÊNCIA...";
            
            let x = 1.00;
            let loop = () => {
                x += 0.25; // MOTOR 3ms (V1750)
                let p = ((x - 1) / (1.20 - 1) * 100);
                if(p > 100) p = 100;
                p_txt.innerText = Math.floor(p) + "%";

                if(p >= 35) { st.innerText = "EXTRAÇÃO FANTASMA!"; st.style.color = "var(--red)"; }

                if(x >= 1.25) {
                    p_txt.innerText = "0%"; st.innerText = "EXTRAÇÃO SUCESSO!";
                    st.style.color = "var(--gold)"; rodando = false;
                    const l = document.getElementById('log');
                    l.innerHTML = `<div style="color:var(--green)">> EXTRAÇÃO CONCLUÍDA EM 3ms</div>` + l.innerHTML;
                } else { setTimeout(loop, 3); } 
            }; loop();
        }
        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
