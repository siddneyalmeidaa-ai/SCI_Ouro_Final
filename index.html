<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NASA SUPREMACY // FULL AUTO S.I.</title>
    <style>
        :root { --dark: #000; --nasa: #0b3d91; --cyan: #00f3ff; --pink: #ff00ff; --gold: #D4AF37; --red: #ff1744; --green: #00e676; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 2.5px solid var(--nasa); border-radius: 45px; padding: 20px; background: radial-gradient(circle at top, #0b3d9144, #000); box-shadow: 0 0 60px var(--nasa); max-width: 400px; margin: auto; }
        
        .radar-box { width: 110px; height: 110px; border: 4px solid var(--pink); border-radius: 50%; margin: 15px auto; position: relative; box-shadow: 0 0 35px var(--pink); overflow: hidden; }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--pink)); animation: rotate 0.6s linear infinite; opacity: 0.5; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .box-btn { padding: 12px; border-radius: 12px; font-size: 9px; background: #111; color: #444; border: 1.5px solid #222; font-weight: 900; cursor: pointer; }
        .rs-active { background: var(--pink) !important; color: white !important; box-shadow: 0 0 15px var(--pink); }

        .display-central { border: 2.5px solid var(--cyan); border-radius: 30px; padding: 30px 10px; background: rgba(0, 243, 255, 0.05); }
        #percentual { font-size: 6.5em; color: var(--cyan); display: block; line-height: 1; text-shadow: 0 0 40px var(--cyan); }
        .status-msg { font-size: 11px; color: var(--gold); margin-top: 10px; font-weight: bold; }

        .btn-auto { background: var(--pink); color: #fff; padding: 22px; border-radius: 25px; font-size: 1.4em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 45px var(--pink); text-transform: uppercase; margin-top: 10px; }
        .btn-auto:disabled { opacity: 0.3; filter: grayscale(1); }

        .footer-tools { background: #050505; border: 1.5px solid var(--gold); border-radius: 20px; padding: 15px; margin-top: 15px; text-align: left; font-size: 10px; }
        .btn-purga { background: var(--nasa); color: white; border: none; padding: 10px; border-radius: 12px; width: 100%; margin-top: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; font-size: 9px; }
    </style>
</head>
<body>
    <div class="master-container">
        <div style="font-size:10px; color:var(--nasa); margin-bottom:10px;">NASA SUPREMACY // V2000_FULL_AUTO</div>

        <div class="radar-box"><div class="radar-sweep"></div></div>

        <div class="espectro">
            <div class="box-btn">VÁCUO</div>
            <div class="box-btn">ROXO</div>
            <div class="box-btn rs-active">ROSA</div>
        </div>

        <div class="display-central">
            <span id="percentual">0%</span>
            <div id="st" class="status-msg">SISTEMA AGUARDANDO COMANDO</div>
        </div>

        <button id="btnMain" class="btn-auto" onclick="iniciarAutomacao()">ATIVAR AUTOMÁTICO 🔱</button>

        <div class="footer-tools">
            <b style="color:var(--gold)">DIAGNÓSTICO:</b> <span id="diag" style="color:var(--green)">PRONTO PARA EXTRAÇÃO</span><br>
            <b style="color:var(--cyan)">MODO:</b> SAQUE AUTOMÁTICO 1.25x<br>
            <button class="btn-purga" onclick="alert('PURGA CONCLUÍDA')">LIMPAR MAPEAMENTO DO SERVIDOR</button>
        </div>
    </div>

    <script>
        let rodando = false;
        function iniciarAutomacao() {
            if(rodando) return;
            rodando = true;
            const p = document.getElementById('percentual'), s = document.getElementById('st'), btn = document.getElementById('btnMain');
            
            btn.disabled = true;
            s.innerText = "AUTOMÁTICO ATIVO - MONITORANDO...";
            s.style.color = "var(--cyan)";

            let x = 1.00;
            let loop = () => {
                x += 0.32; // MOTOR NASA 1ms
                let pct = ((x - 1) / (1.20 - 1) * 100);
                if(pct > 100) pct = 100;
                p.innerText = Math.floor(pct) + "%";

                // SAQUE AUTOMÁTICO - DISPARA SOZINHO AOS 1.25x
                if(x >= 1.25) {
                    p.innerText = "0%";
                    s.innerText = "SAQUE AUTOMÁTICO REALIZADO! ✅";
                    s.style.color = "var(--green)";
                    btn.disabled = false;
                    rodando = false;
                    // Comando de purge automático após cada saque
                    console.log("Purge ID Executed");
                } else {
                    setTimeout(loop, 1); // 1ms de latência (Velocidade Raw)
                }
            };
            loop();
        }
    </script>
</body>
</html>
