<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. RADAR_ACTIVE_V12</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 180px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(15,0,0,0.9); }
        .radar-box { border: 1px solid #00ffcc; padding: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .scan-active { color: #ff0055; font-weight: bold; animation: blink 0.6s infinite; }
        .header { display: flex; justify-content: space-between; background: #333; color: #00ffcc; padding: 4px 10px; border-bottom: 2px solid #00ffcc; }
        #display { text-align:center; font-size: 48px; padding: 10px; font-weight: 900; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="processSync()">
    <div class="header">
        <span>S.A. RADAR_ACTIVE_V12</span>
        <span id="clock">04:30</span>
    </div>

    <div class="radar-box">
        <span>MONITORAMENTO:</span>
        <span id="radar-status">GHOST_MODE</span>
    </div>

    <div id="display">READY</div>
    <div id="delay-info" style="text-align:center; color:#ff0055; font-size: 10px;">PROJEÇÃO COM DELAY DE SAÍDA (-0.08x)</div>

    <div class="terminal" id="term">
        > AGUARDANDO SINCRONIA DE DECOLAGEM...<br>
        > DNA_TARGET: 0.428 [cite: 2026-01-23]
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');
    const radar = document.getElementById('radar-status');

    function processSync() {
        const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
        
        // Simula a detecção de monitoramento da casa [cite: 2026-01-27]
        if (entropy > 0.75) {
            radar.innerText = "!!! RASTREIO DETECTADO !!!";
            radar.className = "scan-active";
            logEvent("ALERTA: SERVIDOR TENTOU ACESSAR CANVAS_FINGERPRINT"); //
            
            display.innerText = "PULA";
            display.style.color = "#ff0055";
        } else {
            radar.innerText = "ESTÁVEL / GHOST";
            radar.className = "";
            
            // Projeção com Delay de Saída Automático [cite: 2026-01-27]
            const realTarget = (entropy * 1.5 + 1.18);
            const secureExit = (realTarget - 0.08).toFixed(2);
            
            display.innerText = secureExit + "x";
            display.style.color = "#00ffcc";
            logEvent(`PACOTE_SAÍDA: ENCRYPT_DNA_SUCCESS | VAL: ${secureExit}x`); //
        }
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.style.borderBottom = "1px solid #330000";
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 15) term.removeChild(term.lastChild);
        console.clear(); // [cite: 2026-01-23]
    }

    /* SINCRONIA DE TEMPO [cite: 2026-01-20] */
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
