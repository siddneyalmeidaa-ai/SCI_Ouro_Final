<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A._V102_PASSAPORTE_FIXED</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        .noise-header { font-size: 8px; color: #1a1a1a; height: 35px; overflow: hidden; margin-bottom: 5px; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; font-size: 10px; color: #444; border-bottom: 1px solid #111; padding-bottom: 5px; }
        #comando-display { font-size: 50px; font-weight: 900; margin: 30px 0; text-shadow: 0 0 15px rgba(0,255,65,0.6); }
        
        /* BOTÃO REFORÇADO */
        .btn-master { 
            background: #ffffff !important; 
            color: #000 !important; 
            border: none; 
            padding: 25px; 
            width: 100%; 
            font-size: 20px; 
            font-weight: 900; 
            border-radius: 8px; 
            cursor: pointer;
            display: block;
            -webkit-appearance: none; /* Remove estilo padrão do iOS/Android */
        }
        .btn-master:active { background: #00ff41 !important; transform: scale(0.95); }
        .btn-master:disabled { background: #111 !important; color: #333 !important; }

        #log-auditoria { flex: 1; font-size: 9px; text-align: left; overflow-y: auto; margin-top: 10px; color: #333; border-top: 1px solid #111; padding-top: 10px; }
        .hl-green { color: #00ff41; }
        .hl-red { color: #ff4141; }
    </style>
</head>
<body>

<div id="terminal">
    <div class="noise-header" id="noise">INICIALIZANDO_CORREÇÃO_VÉSPER...</div>
    <div class="status-grid">
        <div>ORION: <span class="hl-green">FIXED</span></div>
        <div>PASSAPORTE: <span class="hl-green">ON</span></div>
        <div>RASTO: <span class="hl-green">0.01%</span></div>
    </div>

    <div id="comando-display">AGUARDE</div>

    <button class="btn-master" id="btn-sync" onclick="executarSincronia()">SINCRONIZAR_PASSAPORTE</button>

    <div id="log-auditoria">
        > [VÉSPER] Botão recalibrado para Mobile.<br>
        > [ORION] Pronto para 10M de entradas.
    </div>
</div>

<script>
    const btn = document.getElementById('btn-sync');
    const cmd = document.getElementById('comando-display');
    const log = document.getElementById('log-auditoria');
    const noise = document.getElementById('noise');
    let greensConsecutivos = 0;

    // Ruído de Massa (Krona)
    setInterval(() => {
        noise.innerText = `[TRAFFIC]: ${Math.random().toString(16).substring(2,8).toUpperCase()} | SYNC_10M | ${new Date().getMilliseconds()}ms\n` + noise.innerText.substring(0, 100);
    }, 150);

    function addLog(msg, color = "#333") {
        log.innerHTML = `<div style="color:${color}">[${new Date().toLocaleTimeString()}] > ${msg}</div>` + log.innerHTML;
    }

    function executarSincronia() {
        if (btn.disabled) return;
        
        btn.disabled = true;
        btn.innerText = "CALCULANDO...";
        
        // Jitter de hesitação (Krona)
        const jitter = Math.random() * 1500 + 1000;

        setTimeout(() => {
            if (greensConsecutivos >= 3) {
                cmd.innerText = "PULA";
                cmd.style.color = "#ff4141";
                btn.innerText = "LIMPANDO RASTRO...";
                addLog("AURORA: Omissão estratégica (3x1).", "#ff4141");
                greensConsecutivos = 0;
                setTimeout(() => { btn.disabled = false; btn.innerText = "SINCRONIZAR_PASSAPORTE"; }, 4000);
                return;
            }

            const semente = Math.random();
            if (semente > 0.60) {
                cmd.innerText = "ENTRA";
                cmd.style.color = "#00ff41";
                addLog("ORION: Semente Leve.", "#00ff41");
                greensConsecutivos++;
            } else {
                cmd.innerText = "PULA";
                cmd.style.color = "#ff4141";
                addLog("VÉSPER: Semente Pesada.", "#ff4141");
                greensConsecutivos = 0;
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SINCRONIZAR_PASSAPORTE";
                cmd.innerText = "AGUARDE";
                cmd.style.color = "#fff";
            }, 2500);
        }, jitter);
    }
</script>
</body>
</html>
