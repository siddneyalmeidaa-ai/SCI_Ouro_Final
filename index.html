<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST V101 // OMNI_SHIELD</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 5px; overflow: hidden; touch-action: none; }
        .CORE { border: 2px solid #00ffcc; border-radius: 15px; padding: 10px; background: #050505; transition: 0.4s; box-shadow: 0 0 30px rgba(0,255,204,0.1); }
        .VAL { font-size: 80px; font-weight: 900; color: #00ffcc; text-align: center; margin: 5px 0; letter-spacing: -4px; line-height: 1; text-shadow: 0 0 15px #00ffcc; }
        .BTN { background: #00ffcc; color: #000; border: none; padding: 22px; width: 100%; border-radius: 12px; font-weight: 900; font-size: 20px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .BTN:active { background: #fff; transform: scale(0.96); }
        input { background: #111; border: 1px solid #333; color: #00ffcc; padding: 18px; width: 88%; border-radius: 10px; font-size: 28px; text-align: center; margin-bottom: 8px; outline: none; border-left: 5px solid #00ffcc; }
        .HDR { font-size: 8px; color: #00ffcc; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 5px; opacity: 0.8; }
        .INF { font-size: 7px; color: #333; display: flex; justify-content: space-between; margin-top: 10px; border-top: 1px solid #111; padding-top: 5px; }
        .sabotagem { border-color: #ff0055 !important; box-shadow: 0 0 50px #ff0055 !important; }
        .btn-lock { background: #222 !important; color: #ff0055 !important; cursor: not-allowed !important; border: 1px solid #ff0055; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="CORE" id="box">
        <div class="HDR"><span>⚡ OMNI_SHIELD_V101_KTO</span><span id="fps">FPS: 60</span></div>
        
        <input type="number" id="v" step="0.01" placeholder="SYNC_HEX" inputmode="decimal" oninput="pre_scan()">

        <div class="VAL" id="res">1.00</div>
        
        <button class="BTN" id="main_btn" onclick="run_hft()">DISPARAR_GHOST</button>

        <div class="INF">
            <span>ID_VOLATILE: <b id="dev" style="color:#00ffcc">MOTO_HYPER_GEN</b></span>
            <span>ALARM: <b id="threat" style="color:#00ffcc">CLEAN</b></span>
        </div>
    </div>

<script>
    /* LAYER ZERO: ELIMINAÇÃO DE RASTRO */
    (function() {
        Object.defineProperty(window, 'localStorage', { value: { setItem:()=>{}, getItem:()=>null, removeItem:()=>{} }, writable: false });
        setInterval(() => { document.cookie = "expires=" + new Date().toUTCString() + ";path=/"; }, 1500);
        const devs = ["MOTO_EDGE_40", "MOTO_G84", "MOTO_G54", "MOTO_G73"];
        setInterval(() => { document.getElementById('dev').innerText = devs[Math.floor(Math.random() * devs.length)]; }, 10000);
    })();

    /* LAYER AUDIO: ALARME DE SABOTAGEM */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAlarm() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    /* CHAVES ATUALIZADAS (Semente: rF9mS2vK0zN4bX1vQ8pW5-0-0) */
    const _k1 = "ckY5bVMyVkswek40YlgxdlE4cFc1LTAtMA=="; 
    const _k2 = "ZjFiOGJhZTZiOTIzODY4MzQzY2MyZThjYzI1YmI0NGI4NWI1YzFj";

    function tick() {
        document.getElementById('fps').innerText = "FPS: " + Math.floor(58 + Math.random() * 4);
        requestAnimationFrame(tick);
    }
    tick();

    async function pre_scan() {
        const v = parseFloat(document.getElementById('v').value);
        const box = document.getElementById('box');
        const threat = document.getElementById('threat');
        const btn = document.getElementById('main_btn');
        if (!v) return;

        const d = atob(_k1); const e = atob(_k2);
        const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(d + e + v));
        const hex = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
        
        // Detecção de padrões de corte da plataforma
        if ((hex.match(/[a-f]/g) || []).length < 5 || v < 1.05) {
            box.className = "CORE sabotagem";
            threat.innerText = "SABOTAGE!";
            threat.style.color = "#ff0055";
            btn.innerText = "IA: BLOQUEADO";
            btn.className = "BTN btn-lock";
            btn.disabled = true;
            playAlarm();
        } else {
            box.className = "CORE";
            threat.innerText = "CLEAN";
            threat.style.color = "#00ffcc";
            btn.innerText = "DISPARAR_GHOST";
            btn.className = "BTN";
            btn.disabled = false;
        }
    }

    async function run_hft() {
        const r = document.getElementById('res');
        const v = parseFloat(document.getElementById('v').value);
        if (!v) return;

        const d = atob(_k1); const e = atob(_k2);
        const data = new TextEncoder().encode(d + e + performance.now());
        const h = await crypto.subtle.digest('SHA-512', data);
        const hex = Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2, '0')).join('');
        
        const raw = parseInt(hex.substring(0, 8), 16) / 0xFFFFFFFF;
        const target = (1.00 + (raw * 0.45)).toFixed(2);
        
        r.innerText = target + "x";
    }
</script>
</body>
</html>
