<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A._V95_GHOST_SHADOW_AF</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; font-size: 10px; margin: 0; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        .noise-stream { color: #1a1a1a; font-size: 8px; overflow: hidden; height: 50px; border-bottom: 1px solid #111; }
        .target-box { text-align: center; padding: 20px; border: 1px solid #222; margin-top: 10px; }
        .val-display { font-size: 50px; color: #fff; font-weight: 900; }
        .btn-ghost { background: #fff; color: #000; padding: 15px; width: 100%; border: none; font-weight: 900; cursor: pointer; }
        .log-area { flex: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid #222; }
        .status-bar { display: flex; justify-content: space-between; font-size: 8px; background: #080808; padding: 5px; }
    </style>
</head>
<body>

<div id="terminal">
    <div class="noise-stream" id="noise-output"></div>
    
    <div class="status-bar">
        <span>ID_STATUS: SHADOW_MODE_ON</span>
        <span>BA_SIMULADA: R$ 0,00</span>
        <span>RASTO: 0.01%</span>
    </div>

    <div class="target-box">
        <div id="cycle-msg" style="font-size: 8px; color: #444;">AUDITANDO_ROSA_REAL...</div>
        <div class="val-display" id="display">PULA</div>
        <button class="btn-ghost" id="btn-fire">INJETAR_SHADOW_BET</button>
    </div>

    <div class="log-area" id="log-content"></div>
</div>

<script>
    const noise = document.getElementById('noise-output');
    const log = document.getElementById('log-content');
    const display = document.getElementById('display');
    const btn = document.getElementById('btn-fire');

    // GERADOR DE RUÍDO CONSTANTE (Background)
    setInterval(() => {
        const packets = ["SEND_ZERO_BAL_FLAG", "SIMULATE_LOSS_EVENT", "DOM_NAV_FALSE", "MIMIC_USER_FRUSTRATION", "BYPASS_ID_302"];
        const p = packets[Math.floor(Math.random() * packets.length)];
        noise.innerText = `[TRAFFIC_NOISE]: ${Math.random().toString(36).substring(7)} | ${p} | ${new Date().getMilliseconds()}ms\n` + noise.innerText.substring(0, 200);
    }, 150);

    function addLog(msg, type = "info") {
        const color = type === "win" ? "#00ff41" : (type === "warn" ? "#ff4141" : "#444");
        log.innerHTML = `<div style="color:${color}">> ${msg}</div>` + log.innerHTML;
    }

    btn.addEventListener('click', () => {
        btn.disabled = true;
        addLog("INJETANDO RUÍDO DE BANCA ZERADA...", "info");
        
        setTimeout(() => {
            // LÓGICA DE AUDITORIA V95 (Rosa Real vs Falsa)
            const r = Math.random();
            let decisao = "PULA";
            
            // Simulação de Gatilho de Rosa Real
            if (r > 0.85) { 
                decisao = "ROSA_REAL"; 
                display.style.color = "#ff00ff";
                addLog("ROSA REAL DETECTADA (MESA VAZIA + VÁCUO).", "win");
            } else {
                decisao = "PULA";
                display.style.color = "#ff4141";
                addLog("SAÍDA FALTOSA / ISCA IDENTIFICADA. BLOQUEANDO.", "warn");
            }

            display.innerText = decisao;
            
            setTimeout(() => {
                btn.disabled = false;
                display.innerText = "PULA";
                display.style.color = "#fff";
            }, 3000);
        }, 1200);
    });
</script>
</body>
</html>
