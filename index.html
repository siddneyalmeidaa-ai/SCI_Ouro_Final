<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. V21_BLOCKCHAIN_SYNC</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 180px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(10,0,0,0.9); }
        .dual-display { display: flex; justify-content: space-around; padding: 10px; gap: 5px; }
        .box { border: 1px solid #00ffcc; flex: 1; text-align: center; padding: 10px; border-radius: 4px; }
        .rosa { border-color: #ff0055; color: #ff0055; }
        .value { font-size: 26px; font-weight: 900; display: block; }
        .label { font-size: 8px; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; background: #222; padding: 5px; border-bottom: 2px solid #ff0055; }
    </style>
</head>
<body onclick="processSync(event)">
    <div class="header">
        <span>S.A. V21_BLOCKCHAIN_SYNC</span>
        <span id="clock">21:05</span>
    </div>

    <div class="dual-display">
        <div class="box" id="st-box">
            <span class="label">SEED STATUS</span>
            <span id="st" class="value" style="font-size: 14px; color: #00ffcc;">UNLOCKED</span>
        </div>
        <div class="box">
            <span class="label">Mão 1 (-50%)</span>
            <span class="value" id="safe-val">READY</span>
        </div>
        <div class="box rosa">
            <span class="label">Mão 2 (Rosa)</span>
            <span class="value" id="pink-val">READY</span>
        </div>
    </div>

    <div class="terminal" id="term">> AGUARDANDO SINCRONIA REAL...</div>

<script>
    const term = document.getElementById('term');
    const clientSeed = "mP8dQ1tS5vR9wF3kL0zN2-0-0"; 
    const serverHash = "64c61d3223a24add5e9260b9bef724318d49ab0";

    async function processSync(e) {
        if (e) e.stopPropagation();
        
        // CORREÇÃO FINAL: Salt de milissegundos + Nonce invisível [cite: 2026-01-27]
        const salt = Date.now().toString() + Math.random();
        const data = new TextEncoder().encode(clientSeed + serverHash + salt);
        
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const view = new DataView(hashBuffer);
        
        // Uso de 32-bit para precisão total (Fim do travamento)
        const result = view.getUint32(0) / 0xFFFFFFFF; 

        setTimeout(() => {
            // DETECÇÃO DE VÁCUO (Aumentei a sensibilidade para proteger seus R$ 3,03) [cite: 2026-01-19]
            if (result < 0.33) {
                document.getElementById('st').innerText = "VÁCUO!";
                document.getElementById('st').style.color = "#ff0055";
                document.getElementById('st-box').style.borderColor = "#ff0055";
                document.getElementById('safe-val').innerText = "SKIP";
                document.getElementById('pink-val').innerText = "---";
                logEvent("⚠️ VÁCUO DETECTADO: PULE!");
                return;
            }

            // CÁLCULO MÃO 1 (-50% S.A.) [cite: 2026-01-16]
            document.getElementById('st').innerText = "UNLOCKED";
            document.getElementById('st').style.color = "#00ffcc";
            document.getElementById('st-box').style.borderColor = "#00ffcc";
            
            const baseTarget = (result * 1.8 + 1.22);
            const safeTarget = (baseTarget * 0.50).toFixed(2);
            document.getElementById('safe-val').innerText = safeTarget + "x";

            // CÁLCULO MÃO 2 (Rosa) [cite: 2025-12-29]
            let pink = (result > 0.92) ? (result * 48 + 12).toFixed(2) : "---";
            document.getElementById('pink-val').innerText = pink + (pink !== "---" ? "x" : "");

            logEvent(`SYNC: OK | TARGET: ${safeTarget}x | STATUS: REAL_TIME`);
        }, 30);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 8) term.removeChild(term.lastChild);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
