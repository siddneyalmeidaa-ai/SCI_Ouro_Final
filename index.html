<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V1400 - SUPREMACIA NASA // S.I.</title>
    <style>
        :root { --dark: #000; --red: #ff0000; --gold: #D4AF37; --cyan: #00f3ff; --neon-purple: #bc13fe; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        
        /* CONTAINER DE IMPACTO */
        .master-container { border: 4px solid var(--red); border-radius: 40px; padding: 20px; background: radial-gradient(circle at top, #ff000022, #000); box-shadow: 0 0 100px var(--red); max-width: 450px; margin: auto; border-style: double; }

        /* RADAR DE ALTA PRECISÃO (ANTI-VÁCUO) */
        .radar-box { width: 110px; height: 110px; border: 4px solid var(--cyan); border-radius: 50%; margin: 0 auto 15px; position: relative; overflow: hidden; box-shadow: 0 0 30px var(--cyan); }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--cyan)); animation: rotate 0.5s linear infinite; opacity: 0.5; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* PAINEL DE EXTRAÇÃO AGRESSIVA */
        .painel-extra { border: 2px solid var(--red); border-radius: 30px; padding: 25px; margin: 15px 0; background: rgba(255, 0, 0, 0.05); position: relative; }
        #percentual { font-size: 6.5em; color: var(--red); display: block; line-height: 1; text-shadow: 0 0 40px var(--red); font-family: 'Impact', sans-serif; }
        #status-missao { font-size: 13px; color: var(--gold); font-weight: 900; text-transform: uppercase; margin-top: 12px; }

        /* BOTÃO DE RUPTURA */
        .btn-ruptura { background: linear-gradient(45deg, var(--red), var(--neon-purple)); color: #fff; padding: 25px; border-radius: 25px; font-size: 1.6em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 50px var(--red); text-transform: uppercase; transition: 0.1s; }
        .btn-ruptura:active { transform: scale(0.92); filter: brightness(1.5); }
        
        .sentinela-history { background: #050505; border-radius: 15px; padding: 12px; border: 1px solid var(--red); text-align: left; max-height: 120px; overflow-y: auto; margin-top: 15px; }
        .hist-item { font-family: monospace; font-size: 10px; padding: 5px 0; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="master-container">
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--red); margin-bottom:10px; font-weight:bold;">
            <span>V1400 // PROTOCOLO_CAÇADOR</span>
            <span id="timer">03:33:00</span>
        </div>

        <div class="radar-box"><div class="radar-sweep"></div></div>

        <div class="painel-extra">
            <span id="percentual">0%</span>
            <div id="status-missao">MAPEANDO VÁCUO EM TEMPO REAL...</div>
        </div>

        <button id="btnMain" class="btn-ruptura" onclick="executarRuptura()">IGNIÇÃO PREDADORA 🔱</button>

        <div class="sentinela-history" id="histLog">
            <div class="hist-item" style="color:var(--cyan)">> AGUARDANDO QUEBRA DE SEMENTE...</div>
        </div>
    </div>

    <script>
        let rodando = false;

        function addLog(msg, cor) {
            const log = document.getElementById('histLog');
            log.innerHTML = `<div class="hist-item" style="color:${cor}">> ${msg} <span>${new Date().toLocaleTimeString().slice(3,8)}</span></div>` + log.innerHTML;
        }

        async function purgaTotal() {
            addLog("PURGANDO ID DO SERVIDOR...", "var(--cyan)");
            await new Promise(r => setTimeout(r, 200));
            addLog("MASCARAMENTO IPI CONCLUÍDO.", "var(--green)");
        }

        async function executarRuptura() {
            if(rodando) return; rodando = true;
            const perc = document.getElementById('percentual'), st = document.getElementById('status-missao'), btn = document.getElementById('btnMain');
            btn.disabled = true; st.innerText = "FURANDO BLOQUEIO DE LATÊNCIA...";

            setTimeout(() => {
                let x = 1.00;
                let loop = () => {
                    x += 0.14; // VELOCIDADE ULTRA-AGRESSIVA (ATROPELA O VÁCUO)
                    let p = ((x - 1) / (1.20 - 1) * 100); 
                    if(p > 100) p = 100;
                    perc.innerText = Math.floor(p) + "%";

                    // ANTECIPAÇÃO FANTASMA (45%)
                    // O saque dispara quando a vela mal começou, vencendo o delay de 100ms
                    if(p >= 45) { 
                        st.innerText = "EXTRAÇÃO MULTI-SINAL ATIVA!";
                        st.style.color = "white";
                    }

                    if(x >= 1.22) { // Teto de segurança absoluta para secar o caixa dele
                        finalizarRodada();
                    } else { setTimeout(loop, 15); } // 15MS - LIMITE DE OVERCLOCK
                }; loop();
            }, 350);
        }

        async function finalizarRodada() {
            addLog("LUCRO EXTRAÍDO COM SUCESSO.", "var(--green)");
            await purgaTotal();
            document.getElementById('percentual').innerText = "0%";
            document.getElementById('status-missao').innerText = "VÁCUO MAPEADO. PRÓXIMO ALVO...";
            document.getElementById('status-missao').style.color = "var(--gold)";
            document.getElementById('btnMain').disabled = false;
            rodando = false;
        }

        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
