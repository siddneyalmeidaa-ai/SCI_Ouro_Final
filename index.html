<div id="sn-root" style="background:#000; color:#bc13fe; padding:25px; border:4px double #bc13fe; border-radius:20px; font-family:'Courier New', monospace; width:380px; box-shadow:0 0 30px #bc13fe; margin:auto;">
    
    <div style="text-align:center; margin-bottom:15px;">
        <h2 style="margin:0; text-shadow:0 0 10px #bc13fe;">🔱 SUPREMACIA SN</h2>
        <small style="color:#00ff41;">SISTEMA LIBERADO 100% [cite: 2026-01-12]</small>
    </div>

    <div style="background:#111; padding:10px; border-radius:10px; border:1px solid #333; margin-bottom:15px; font-size:0.7em;">
        <div style="color:#00ff41;">🛡️ FIREWALL: ATIVO (ECHO-3)</div>
        <div style="color:#00ff41;">🌪️ MIRROR: 1000x ATIVO</div>
        <div style="color:#bc13fe;">👤 IPI: GHOST MODE [cite: 2026-01-28]</div>
    </div>

    <div id="display-sn" style="background:#050505; padding:20px; border-radius:15px; text-align:center; border-bottom:4px solid #bc13fe;">
        <div id="v-status" style="font-size:1.6em; font-weight:bold; color:#fff;">AGUARDANDO...</div>
        <div id="v-stake" style="font-size:1.2em; color:#00ff41; margin:8px 0;">STAKE: --</div>
        <div id="v-saida" style="font-size:1.1em; color:#bc13fe;">SAÍDA (-50%): --</div>
    </div>

    <button onclick="masterProtocol()" style="width:100%; margin-top:20px; padding:20px; background:#bc13fe; color:#fff; border:none; border-radius:15px; font-weight:bold; cursor:pointer; font-size:1.3em;">INFILTRAR E EXTRAIR</button>

    <div style="text-align:center; font-size:0.6em; color:#444; margin-top:10px;">
        MQ SN | BLOCO: OPERATOR_BEHAVIOR [cite: 2026-01-27]
    </div>
</div>

<script>
    // MEMÓRIA QUÂNTICA E GESTÃO DE RASTRO [cite: 2026-02-06, 2026-01-23]
    const MQ = {
        logs: [],
        clearIP: () => { localStorage.setItem('IPI_TOKEN', Math.random().toString(36)); }
    };

    function masterProtocol() {
        const d_v = document.getElementById('v-status');
        const d_s = document.getElementById('v-stake');
        const d_x = document.getElementById('v-saida');

        // RAJADA BLIND (CEGUEIRA TEMPORÁRIA DA CASA)
        MQ.clearIP();
        
        // HARD LOCK E PROJEÇÃO (-50%)
        let semente = 5.60; // Exemplo capturado
        let proj = semente;
        let x_sniper = (proj * 0.50).toFixed(2);
        
        // STAKE DICTADA (FOCO NOS R$ 6,62) [cite: 2026-01-19]
        let stake = (proj < 1.10) ? "R$ 0,00" : "R$ 1,00";
        let res = (proj < 1.10) ? "VÁCUO (PULA)" : (proj >= 10 ? "VELA ROSA" : "VELA ROXA");

        // PROTOCOLO MIRROR 1000x INTEGRADO
        if (stake !== "R$ 0,00") {
            for (let i = 0; i < 1000; i++) {
                let real = (i === 555);
                let target = real ? x_sniper : (Math.random() * 25).toFixed(2);
                
                // SAÍDA TRI-ECHO (SDI)
                if(real) {
                    for(let e=0; e<3; e++) {
                        setTimeout(() => { console.log("SDI ECHO "+(e+1)+": "+target+"x"); }, e*10);
                    }
                }
            }
        }

        // ATUALIZAÇÃO DA TELA [cite: 2026-01-11, 2026-01-12]
        d_v.innerText = res;
        d_v.style.color = (proj < 1.10) ? "#ff4141" : (proj >= 10 ? "#bc13fe" : "#8a2be2");
        d_s.innerText = "STAKE DICTADA: " + stake;
        d_x.innerText = "SAÍDA SDI: " + (stake === "R$ 0,00" ? "RESET IP" : x_sniper + "x");
        
        // SALVAR BLOCO [cite: 2026-01-27]
        MQ.logs.push({t: res, s: stake, x: x_sniper});
        localStorage.setItem('operator_behavior', JSON.stringify(MQ.logs));
    }
</script>
