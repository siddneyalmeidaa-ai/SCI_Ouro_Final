<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GHOST V70 - SHADOW STEALTH</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding: 10px; margin: 0; }
        .stealth-box { border: 1px solid #333; border-radius: 20px; padding: 20px; background: #050505; max-width: 360px; margin: auto; box-shadow: 0 0 50px rgba(0,255,204,0.1); }
        .val-display { font-size: 110px; font-weight: 900; color: #fff; margin: 10px 0; letter-spacing: -5px; }
        .btn-ghost { background: #00ffcc; color: #000; border: none; padding: 25px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 22px; text-transform: uppercase; transition: 0.1s; }
        .btn-ghost:active { transform: scale(0.98); background: #00ccaa; }
        .btn-ghost:disabled { background: #111; color: #333; cursor: not-allowed; }
        .mini-log { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 8px; margin-top: 15px; color: #444; text-align: left; text-transform: uppercase; }
        input { background: #000; border: 1px solid #00ffcc; color: #00ffcc; padding: 10px; width: 120px; border-radius: 8px; font-size: 22px; text-align: center; margin-bottom: 10px; outline: none; }
        #msg { font-size: 10px; color: #ff0055; font-weight: bold; height: 14px; margin-bottom: 10px; }
        .line { height: 1px; background: #111; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="stealth-box">
        <div style="font-size: 9px; letter-spacing: 3px; color: #333;">V70_SHADOW_STEALTH // R$ 6.50_SAFE</div>
        
        <div style="margin-top: 15px; font-size: 10px; color: #555;">SYNC_INPUT (LAST_CRASH):</div>
        <input type="number" id="last-v" step="0.01" placeholder="0.00">

        <div class="val-display" id="display">0.00</div>
        <div id="msg">SISTEMA ARMARDO</div>
        
        <button id="btn" class="btn-ghost" onclick="triggerGhost()">DISPARAR GHOST</button>

        <div class="line"></div>

        <div class="mini-log">
            <span>[NET]: <b id="ping">--</b></span>
            <span>[JITTER]: <b id="jit" style="color:#00ffcc">ACTIVE</b></span>
            <span>[FINGERPRINT]: <b style="color:#00ffcc">MASK_ON</b></span>
            <span>[TARGET]: <b style="color:#00ffcc">DYNAMIC</b></span>
        </div>
    </div>

<script>
    // --- NÚCLEO DE DNA S.A. ---
    const manualCode = "COLE_AQUI_O_CODIGO_MANUAL"; 
    const masterSeed = "COLE_AQUI_A_CHAVE_SEED";    
    // -------------------------

    let latency = 0;
    const sessionToken = Math.random().toString(16).substring(2, 10);

    // PING EM BACKGROUND (Shannon Stealth)
    setInterval(async () => {
        const t0 = performance.now();
        try {
            await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
            latency = performance.now() - t0;
            document.getElementById('ping').innerText = latency.toFixed(0) + "ms";
        } catch(e) {}
    }, 5000);

    async function triggerGhost() {
        const display = document.getElementById('display');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('btn');
        const lastV = parseFloat(document.getElementById('last-v').value) || 0;

        // SKINNER PROTECTION (Anti-Recolhimento)
        if (lastV > 0 && lastV < 1.15) {
            display.innerText = "WAIT";
            display.style.color = "#ff0055";
            msg.innerText = "🚨 ALGORITMO PREDADOR - TRAVADO 20s";
            btn.disabled = true;
            setTimeout(() => { btn.disabled = false; display.innerText = "0.00"; display.style.color = "#fff"; msg.innerText = "PRONTO"; }, 20000);
            return;
        }

        // CÁLCULO DE HASH ACELERADO (Simons Engine)
        const encoder = new TextEncoder();
        const data = encoder.encode(manualCode + masterSeed + Date.now() + sessionToken);
        const hashBuf = await crypto.subtle.digest('SHA-256', data);
        const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');

        // JITTER HUMANO (Skinner Mask)
        // O multiplicador agora oscila entre 0.38 e 0.43 para confundir a casa
        const jitter = (Math.random() * (0.43 - 0.38) + 0.38).toFixed(3);
        
        const raw = (parseInt(hashHex.substring(0, 8), 16) / 0xFFFFFFFF) * 1.4 + 1.25;
        const target = (raw * jitter).toFixed(2);

        if (target < 1.10) {
            display.innerText = "SKIP";
            msg.innerText = "VÁCUO DETECTADO";
            return;
        }

        display.innerText = target;
        display.style.color = "#00ffcc";
        msg.innerText = "✅ ALVO SHADOW CALCULADO";
    }
</script>
