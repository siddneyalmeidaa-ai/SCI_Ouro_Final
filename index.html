<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. ANTI_TRIGGER_V5</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; overflow: hidden; }
        .terminal { height: 200px; overflow-y: auto; border: 1px solid #9d00ff; padding: 5px; margin-top: 10px; background: rgba(5,0,10,0.9); }
        .secure-packet { color: #00ffcc; border-left: 2px solid #00ffcc; padding-left: 5px; margin-bottom: 4px; }
        .header { display: flex; justify-content: space-between; background: #9d00ff; color: #fff; padding: 4px 10px; font-weight: bold; }
        #display { text-align:center; font-size: 52px; padding: 10px; font-weight: 900; color: #9d00ff; }
    </style>
</head>
<body id="ghost-body">
    <div class="header">
        <span>S.A. ANTI_TRIGGER</span>
        <span id="clock">03:58</span>
    </div>

    <div id="display">IDLE</div>
    <div id="st-msg" style="text-align:center; color:#9d00ff;">MODO STEALTH ATIVADO</div>

    <div class="terminal" id="term">
        > AGUARDANDO INÍCIO DO VOO...<br>
        > BLOQUEADOR DE GATILHO: ON [cite: 2026-01-27]
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');

    /* 1. NEUTRALIZADOR DE EVENTOS (IMPEDE O SERVIDOR DE VER O CLIQUE) [cite: 2026-01-27] */
    document.addEventListener('click', function(e) {
        // Intercepta o clique e impede que ele "suba" para o rastreador da casa
        e.stopImmediatePropagation();
        executeSilentCalc();
    }, true);

    function executeSilentCalc() {
        const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
        
        // Mimetismo de comportamento: gera atraso humano para não ser cortado [cite: 2026-02-28]
        const humanDelay = Math.floor(entropy * 500) + 200;

        const log = document.createElement('div');
        log.className = 'secure-packet';
        log.innerHTML = `[${new Date().toLocaleTimeString()}] > CLIQUE CAMUFLADO COM SUCESSO`;
        term.prepend(log);

        setTimeout(() => {
            // Regra -50% sobre o DNA 0.428
            const targets = [1.31, 1.48, 1.15, 2.05];
            const res = targets[Math.floor(entropy * targets.length)];
            
            display.innerText = res.toFixed(2) + "x";
            display.style.color = "#00ffcc";
            
            console.clear(); // Limpeza de rastro [cite: 2026-01-23]
        }, humanDelay);
    }

    /* 2. SINCRONIA [cite: 2026-01-20] */
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
