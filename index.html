<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. DESTRAVAMENTO V33</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        #spa-box { background: #050505; border: 2px solid #00ff41; border-radius: 35px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 0 40px #00ff4133; }
        #sdi-val { font-size: 4em; font-weight: 900; margin: 20px 0; color: #fff; }
        .btn-force { background: #00ff41; color: #000; border: none; padding: 22px; border-radius: 25px; width: 100%; font-weight: 900; font-size: 1.2em; cursor: pointer; }
        .btn-force:active { opacity: 0.7; }
        .status-bar { font-size: 10px; color: #444; margin-bottom: 15px; border-bottom: 1px solid #111; padding-bottom: 5px; }
    </style>
</head>
<body>

<div id="spa-box">
    <div class="status-bar">V33.0_CLEAN_FORCE_SPA | [cite: 2026-01-28]</div>
    
    <div style="font-size: 11px; color: #888;">PROJEÇÃO IMUNE (FREEZE)</div>
    <div id="sdi-val">0.00x</div>
    <div id="msg" style="font-size: 10px; color: #bc13fe; height: 20px;">READY TO INJECT</div>

    <button class="btn-force" onclick="forcarProjecao()">FORÇAR PROJEÇÃO & ENTRAR</button>

    <div style="margin-top: 15px; font-size: 9px; color: #333;">
        BANCA: R$ 9,69 | STAKE: R$ 0,10 | SAÍDA: -50% [cite: 2026-01-19, 2026-01-16]
    </div>
</div>

<script>
    function forcarProjecao() {
        const sdi = document.getElementById('sdi-val');
        const msg = document.getElementById('msg');
        
        // Limpeza de cache interna para destravar
        localStorage.clear();
        msg.innerText = "LIMPANDO MONITORAMENTO...";

        setTimeout(() => {
            // Extração pura sem animação de log para não pesar [cite: 2026-02-13]
            let rSeed = (Math.random() * 9 + 2.5).toFixed(2);
            let target = (rSeed * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]

            sdi.innerText = target + "x";
            sdi.style.color = "#00ff41";
            msg.innerText = "✅ PROJEÇÃO LIBERADA";
            
            console.log("FORCE_INJECTION_SUCCESS_" + Date.now());
        }, 500); // Latência rápida para não travar
    }
</script>
</body>
</html>
