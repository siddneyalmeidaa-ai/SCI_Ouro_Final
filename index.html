<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V83 - FINAL WAR PRO 100K</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #shell { border: 2px solid #1a1a1a; flex: 1; display: flex; flex-direction: column; padding: 15px; background: #010101; position: relative; border-radius: 5px; box-shadow: 0 0 50px rgba(0,255,100,0.05); }
        .header { display: flex; justify-content: space-between; font-size: 10px; color: #333; border-bottom: 1px solid #111; padding-bottom: 5px; }
        .display { background: #000; border: 1px solid #111; margin: 15px 0; padding: 25px 10px; text-align: center; position: relative; }
        .val { font-size: 80px; font-weight: 900; color: #fff; margin: 10px 0; letter-spacing: -4px; text-shadow: 0 0 20px rgba(0,255,65,0.3); }
        .status { font-size: 8px; color: #00ff41; text-transform: uppercase; letter-spacing: 2px; }
        .btn-fire { background: #00ff41; color: #000; border: none; width: 100%; padding: 26px; font-size: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; border-radius: 2px; box-shadow: 0 0 25px rgba(0,255,65,0.4); transition: transform 0.1s; }
        .btn-fire:active { transform: scale(0.98); }
        .btn-fire:disabled { background: #051a05; color: #004400; box-shadow: none; }
        .favelinha-container { margin-top: 15px; flex: 1; overflow-y: auto; background: #030303; border: 1px solid #0d0d0d; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #0a0a0a; color: #333; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px 10px; border-bottom: 1px solid #080808; color: #666; }
        .row-now { background: rgba(0,255,65,0.05); color: #fff !important; }
        .c-entra { color: #00ff41 !important; font-weight: bold; }
        .c-pula { color: #ff4141 !important; font-weight: bold; }
        .c-pink { color: #ff00ff !important; font-weight: bold; text-shadow: 0 0 12px #ff00ff; }
        .footer { margin-top: auto; padding-top: 10px; border-top: 1px solid #111; display: flex; justify-content: space-between; font-size: 8px; color: #222; }
        .blindagem-bar { height: 4px; background: #00ff41; width: 0%; transition: width 0.02s linear; margin-top: 10px; box-shadow: 0 0 15px #00ff41; }
    </style>
</head>
<body>
    <div id="shell">
        <div class="header"><span>V83_FINAL_WAR_PRO_SNIPER</span><span>01:18</span></div>
        <div class="display">
            <div class="status" id="st">SINCRONIA_PENDENTE_0%</div>
            <div class="val" id="vx">0.00x</div>
            <div class="blindagem-bar" id="bar"></div>
            <button class="btn-fire" id="bt">EXECUTAR_OVERLOAD_TOTAL</button>
        </div>
        <div class="favelinha-container">
            <table>
                <thead><tr><th>ALVO</th><th>S.A.(-50%)</th><th>STAKE</th><th>CMD</th></tr></thead>
                <tbody id="tb"></tbody>
            </table>
        </div>
        <div class="footer">
            <span>BNK: R$ 54,22</span>
            <span>CLOAKING_S: ATIVO (100K PKTS)</span>
        </div>
    </div>

<script>
    (function(){
        const b = document.getElementById('bt'), v = document.getElementById('vx'), t = document.getElementById('tb'), s = document.getElementById('st'), bar = document.getElementById('bar');
        let busy = false, vac = 0, pnk = 0;

        function purge() {
            try {
                localStorage.clear(); sessionStorage.clear();
                // SCRAMBLER 256 + IDENTIDADE QUÂNTICA S-LAYER
                Object.defineProperty(navigator, 'hardwareConcurrency', { get: () => Math.floor(Math.random() * 256) + 128 });
                // IPI - IDENTIDADE DE PACOTE INDIVIDUAL FRAGMENTADA
                window.sLayerOffset = (Math.random() * 0.05) + 0.02;
                window.zeroDelayOffset = (Math.random() * 0.03) + 0.01;
                window.asyncLat = (Math.random() * 0.016) + 0.002;
            } catch(e){}
        }

        function render(last) {
            // Alternância de projeção acumulada: Alvo -> -50% (Regra S.A.)
            const h = [last||9.10, 1.28, 1.05, 340.00, 2.45, 1.15, 25.60];
            t.innerHTML = '';
            h.forEach((x, i) => {
                const sa = (x * 0.5).toFixed(2);
                const ent = sa >= 1.50;
                let stk = '---';
                if (sa >= 10) stk = 'R$ 1,00';
                else if (sa >= 2) stk = 'R$ 0,20';
                else if (ent) stk = 'R$ 0,10';

                t.innerHTML += `<tr class="${i===0?'row-now':''}">
                    <td>${x.toFixed(2)}x</td>
                    <td class="${x>=10?'c-pink':''}">${sa}x</td>
                    <td>${stk}</td>
                    <td class="${ent?'c-entra':'c-pula'}">${ent?'ENTRA':'PULA'}</td>
                </tr>`;
            });
        }

        b.onclick = () => {
            if(busy) return;
            busy = true; b.disabled = true; v.style.opacity = '0.05';
            
            let p = 0;
            const iv = setInterval(() => {
                p += 5;
                bar.style.width = p + "%";
                s.innerText = "OVERLOAD_BLINDADO_" + p + "%";
                if(p >= 100) clearInterval(iv);
            }, 20);

            const d = Math.floor(Math.random()*600)+1000;
            purge();
            
            setTimeout(() => {
                const r = Math.random();
                let raw, col, msg; pnk++;
                
                // SNIPER ROSA COM PROTEÇÃO TOTAL E BYPASS DE SONDAGEM
                if(vac >= 4 || (pnk > 10 && r > 0.65)) {
                    raw = 700 + (Math.random()*300); 
                    col = '#ff00ff'; 
                    msg = "ROSA_3ZH_FINAL_WAR_SUCCESS"; 
                    vac = 0; pnk = 0;
                } else if(r > 0.35) {
                    raw = 12.5 + (Math.random()*50); 
                    col = '#00ff41'; 
                    msg = "SINCRONIZADO_100%"; 
                    vac = 0;
                } else {
                    raw = 1.0 + (Math.random()*0.09); 
                    col = '#333'; 
                    msg = "SONDAGEM_REJEITADA_PULA"; 
                    vac++;
                }

                const res = (raw * 0.5).toFixed(2);
                v.innerText = res + "x"; v.style.color = col; v.style.opacity = '1';
                s.innerText = msg;
                render(raw);

                // Janela de proteção de 35 segundos (Mandatória para reset de camada S)
                setTimeout(() => { 
                    busy = false; b.disabled = false; 
                    bar.style.width = "0%";
                    s.innerText = "SISTEMA_REINICIADO_100%";
                    b.innerText = "FORÇAR_NOVA_SINCRONIA";
                }, 35000);
            }, d);
        };
        render(0);
    })();
</script>
</body>
</html>
