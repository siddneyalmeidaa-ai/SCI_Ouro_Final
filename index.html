<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. ANTICIPATED_PROJECTION_V11</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 160px; overflow-y: auto; border: 1px solid #00ffcc; padding: 5px; margin-top: 5px; background: rgba(0,20,0,0.9); }
        .header { display: flex; justify-content: space-between; background: #00ffcc; color: #000; padding: 4px 10px; font-weight: bold; }
        #display { text-align:center; font-size: 52px; padding: 15px; font-weight: 900; }
        .delay-tag { background: #ff0055; color: #fff; padding: 2px 6px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body onclick="runProjection()">
    <div class="header">
        <span>S.A. V11_LATENCY_COMP</span>
        <span id="clock">04:25</span>
    </div>

    <div id="display">READY</div>
    <div style="text-align:center; margin-bottom: 10px;">
        <span class="delay-tag">LATENCY_COMP: -0.08x ATIVO</span>
    </div>

    <div class="terminal" id="term">
        > MOTOR DE ANTECIPAÇÃO ATIVO...<br>
        > DNA_TARGET: 0.428 [cite: 2026-01-23]
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');

    function runProjection() {
        const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
        
        // 1. CÁLCULO DA PROJEÇÃO BRUTA (-50% DO TOPO) [cite: 2026-01-16]
        let rawProjection = (entropy * 1.4 + 1.15);
        
        // 2. DESCONTO DE DELAY PARA SAÍDA ANTECIPADA [cite: 2026-01-27]
        // Subtrai um vácuo de milissegundos transformado em multiplicador
        let secureExit = (rawProjection - 0.08).toFixed(2);
        
        display.innerText = secureExit + "x";
        display.style.color = "#00ffcc";
        
        logEvent(`ALVO REAL: ${rawProjection.toFixed(2)}x | SAÍDA SEGURA: ${secureExit}x`);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 15) term.removeChild(term.lastChild);
        console.clear(); // Limpeza de rastro [cite: 2026-01-23]
    }

    /* RELÓGIO [cite: 2026-01-20] */
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
