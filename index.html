<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V252_TOUCH</title>
    <style>
        :root { --c1: #00ffcc; --c2: #9d00ff; --d: #ff0055; --w: #ffd700; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: #fff; height: 100vh; width: 100vw; }
        .mimic-h { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(25px); border-bottom: 1px solid #1a1a1a; pointer-events: none; }
        .v-out { font-size: 44px; font-weight: 900; color: var(--c1); letter-spacing: -2px; }
        #touch_area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .hint { position: absolute; bottom: 20px; font-size: 8px; color: #333; text-transform: uppercase; }
    </style>
</head>
<body onclick="igniteNeuralGhost()">

<div id="m_root" class="mimic-h">
    <div id="m_box">
        <div id="v_display">TOQUE_PARA_PROJETAR</div>
        <div id="s_status" style="font-size: 7px; color: var(--w); text-transform: uppercase;">MODO: GATILHO_MANUAL</div>
    </div>
</div>

<div id="touch_area">
    <div class="hint">CLIQUE EM QUALQUER LUGAR DA ÁREA PRETA</div>
</div>

<script>
    const MEM_KEY = "_ga_u_metrics_v2";
    let isAnalyzing = false;
    let globalData = JSON.parse(localStorage.getItem(MEM_KEY)) || { rounds: 0, wins: 0 };

    const getS5Entropy = () => {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
    };

    /* 1. TREMOR ORGÂNICO AO TOQUE [cite: 2026-02-03] */
    function applyOrganicTremor() {
        window.scrollBy(0, (getS5Entropy() * 4) - 2);
    }

    /* 2. LÓGICA DE PROJEÇÃO INSTANTÂNEA */
    function igniteNeuralGhost() {
        if(isAnalyzing) return; // Evita múltiplos cliques seguidos
        isAnalyzing = true;

        const d = document.getElementById('v_display');
        const s = document.getElementById('s_status');
        
        d.innerText = "---"; d.style.color = "#222";
        s.innerText = "S5: PROCESSANDO TOQUE...";

        applyOrganicTremor();

        // Delay humano curto para parecer análise (1.2s a 2.5s)
        const delay = (getS5Entropy() * 1300) + 1200;

        setTimeout(() => {
            const seed = getS5Entropy();
            
            // PERDA TÁTICA [cite: 2026-01-23]
            if (globalData.wins >= 8 && getS5Entropy() < 0.35) {
                d.innerText = "ENTRA"; d.style.color = "#ffa500"; 
                s.innerText = "⚠️ PERDA TÁTICA: MÍNIMA (0.10)";
                globalData.wins = 0;
            } else if (seed > 0.94) {
                d.innerText = (getS5Entropy() * 5 + 10.5).toFixed(2) + "x";
                d.style.color = "var(--c2)"; s.innerText = "ATHENA: VELA_ROSA";
                globalData.wins++;
            } else if (seed < 0.30) {
                d.innerText = "PULA"; d.style.color = "var(--d)";
                s.innerText = "NYX: RODADA_RISCO";
            } else {
                const targets = [1.38, 1.45, 2.08, 1.34];
                const g = targets[Math.floor(getS5Entropy() * 4)];
                d.innerText = (g + (getS5Entropy() * 0.05)).toFixed(2) + "x";
                d.style.color = g > 2 ? "var(--c2)" : "var(--c1)";
                s.innerText = "GHOST: ANALISADO";
                globalData.wins++;
            }

            globalData.rounds++;
            localStorage.setItem(MEM_KEY, JSON.stringify(globalData));
            isAnalyzing = false;
        }, delay);
    }

    // Ofuscação de Identidade [cite: 2026-01-27]
    (function(){
        const ids = ['m_root', 'v_display', 's_status', 'm_box'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if(el) el.id = 'sh_' + Math.floor(getS5Entropy() * 99999);
        });
    })();
</script>
</body>
</html>
