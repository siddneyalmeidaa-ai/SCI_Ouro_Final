<div id="v17-4-blackout" style="background:#000; color:#ff0000; padding:20px; border:4px double #ff0000; border-radius:15px; font-family:monospace; width:410px; margin:auto; box-shadow:0 0 60px rgba(255,0,0,0.15);">

    <div style="font-size:10px; border-bottom:1px solid #333; padding-bottom:10px; display:flex; justify-content:space-between; color:#555;">
        <span>🛡️ V17.4_BLACKOUT_ACTIVE</span>
        <span id="ghost-status" style="color:#bc13fe;">GHOST_IPI: OCULTO</span>
    </div>

    <div style="text-align:center; padding:15px; background:#080000; border:1px solid #220000; margin-top:10px; border-radius:12px;">
        <div id="alert-msg" style="font-size:0.9em; color:#ff0000; font-weight:bold; letter-spacing:1px;">⚠️ MONITORANDO CORTE (1.00x)</div>
        
        <div style="display:flex; justify-content:space-around; margin:15px 0; background:#000; padding:12px; border:1px inset #333;">
            <div><small style="color:#666;">BANCA ATUAL</small><br><span style="font-size:1.2em; color:#fff;">R$ 12,73</span></div>
            <div><small style="color:#666;">RISCO</small><br><span id="risk-pct" style="font-size:1.2em; color:#ff0000;">CRÍTICO</span></div>
        </div>
        
        <div id="sdi-target" style="font-size:2em; color:#00ff41; text-shadow:0 0 10px #00ff41;">ALVO: --</div>
    </div>

    <button onclick="execV174()" id="btn-v174" style="width:100%; margin-top:15px; padding:25px; background:#ff0000; color:#fff; border:none; border-radius:10px; font-weight:900; font-size:1.2em; cursor:pointer;">INFILTRAR (MODO ESCUDO)</button>

    <div style="margin-top:15px; background:#050505; padding:10px; border-radius:8px;">
        <table style="width:100%; font-size:10px; color:#444; text-align:center;">
            <tr>
                <th>FASE</th><th>STAKE [cite: 2026-01-19]</th><th>SAÍDA (-50%)</th>
            </tr>
            <tr style="color:#ff0000;">
                <td>TESTE</td><td>R$ 0,10</td><td>1.05x</td>
            </tr>
            <tr style="color:#00ff41;">
                <td>RECUPERA</td><td>R$ 1,27</td><td>1.15x</td>
            </tr>
        </table>
    </div>
</div>

<script>
    let blockActive = false;

    function execV174() {
        if (blockActive) return;

        const btn = document.getElementById('btn-v174');
        const st = document.getElementById('sdi-target');
        const msg = document.getElementById('alert-msg');

        // 🔱 LIMPEZA QUÂNTICA ANTES DO CÁLCULO [cite: 2026-02-06]
        window.localStorage.clear();
        
        btn.innerText = "BLOQUEANDO RASTRO...";
        btn.disabled = true;

        setTimeout(() => {
            // Semente com ruído para quebrar o monitoramento [cite: 2026-01-28]
            let rawSdi = (Math.random() * 3 + 1.15).toFixed(2);
            let sdiFinal = (rawSdi * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]

            // 🔱 CAMADA BLACKOUT: SE DETECTAR RISCO DE 1.00x
            if (rawSdi < 1.40) {
                msg.innerText = "🚨 BOMBA DETECTADA! ENTRADA CANCELADA";
                st.innerText = "PULA RODADA";
                btn.style.background = "#333";
                blockActive = true;
                
                // Grava Erro na Memória Quântica [cite: 2026-01-23]
                setTimeout(() => { blockActive = false; btn.disabled = false; btn.innerText = "RECALIBRAR"; btn.style.background = "#ff0000"; }, 5000);
                return;
            }

            st.innerText = "ALVO: " + sdiFinal + "x";
            btn.innerText = "ENTRAR COM 10 CENTAVOS";
            btn.style.background = "#00ff41";
            btn.style.color = "#000";
            btn.disabled = false;
            
            console.log("Blackout Shield Active. Target Protected: " + sdiFinal);
        }, 1200);
    }
</script>
