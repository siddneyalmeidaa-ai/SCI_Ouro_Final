<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S.A._V83_PINK_SNIPER_ANTI_SABOTAGE</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: #000; color: #d0d0d0; font-family: 'Courier New', monospace; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #main-shell { flex: 1; display: flex; flex-direction: column; padding: 15px; border: 4px solid #111; position: relative; }
        
        /* Scanner Anti-Inversão */
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255, 0, 255, 0.05) 1px, transparent 1px), linear-gradient(90(rgba(255, 0, 255, 0.05) 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; z-index: 1; }
        
        .sa-header { border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 10px; color: #444; z-index: 10; }
        .quantum-display { background: #020202; border: 2px solid #111; padding: 35px 10px; text-align: center; border-radius: 2px; position: relative; z-index: 10; }
        .val-sa { font-size: 75px; font-weight: 900; color: #fff; margin: 5px 0; transition: opacity 0.2s; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .status-ghost { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #ff00ff; height: 12px; font-weight: bold; }
        
        .btn-sa { background: #f0f0f0; color: #000; border: none; width: 100%; padding: 25px; font-size: 24px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: all 0.3s; border-radius: 4px; box-shadow: 0 5px 0 #999; z-index: 20; position: relative; }
        .btn-sa:active { transform: translateY(3px); box-shadow: 0 2px 0 #666; }
        .btn-sa:disabled { background: #111; color: #222; cursor: not-allowed; border: 1px solid #1a1a1a; box-shadow: none; }
        
        .metrics-sync { display: flex; gap: 8px; margin-top: 15px; z-index: 10; }
        .m-card { flex: 1; background: #050505; border: 1px solid #111; padding: 10px; text-align: center; }
        .m-label { font-size: 7px; color: #333; margin-bottom: 4px; }
        .m-val { font-size: 15px; font-weight: 900; }

        .favelinha-box { margin-top: 15px; background: #050505; border: 1px solid #0d0d0d; flex: 1; overflow-y: auto; z-index: 10; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #0a0a0a; color: #222; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 14px 12px; border-bottom: 1px solid #080808; color: #444; }
        .row-on { color: #fff !important; background: rgba(255,255,255,0.03); }
        .cmd-e { color: #00ff41 !important; font-weight: bold; }
        .cmd-p { color: #ff4141 !important; font-weight: bold; }
        .pink-v { color: #ff00ff !important; font-weight: bold; text-shadow: 0 0 10px #ff00ff; }
        
        .sa-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid #111; display: flex; justify-content: space-between; font-size: 9px; color: #222; z-index: 10; }
    </style>
</head>
<body>
<div id="main-shell">
    <div class="grid-overlay"></div>
    <div class="sa-header"><span>S.A._V83_ANTI_INVERSAO</span><span>23:45</span></div>
    
    <div class="quantum-display" id="q-core">
        <div class="status-ghost" id="ghost-status">MODO_CAÇA_ROSA_ATIVO</div>
        <div class="val-sa" id="val-sa">0.00x</div>
        <button class="btn-sa" id="btn-fire">REFINAR_ALVO</button>
    </div>

    <div class="metrics-sync">
        <div class="m-card">
            <div class="m-label">LIBERADO</div>
            <div id="m-lib" class="m-val text-green-500">100%</div>
        </div>
        <div class="m-card">
            <div class="m-label">PENDENTE</div>
            <div id="m-pen" class="m-val text-yellow-500">0%</div>
        </div>
        <div class="m-card">
            <div class="m-label">VÁCUO</div>
            <div id="m-vac" class="m-val text-pink-500">0</div>
        </div>
    </div>

    <div class="favelinha-box">
        <table>
            <thead><tr><th>ALVO_X</th><th>S.A.(-50%)</th><th>STAKE</th><th>CMD</th></tr></thead>
            <tbody id="fav-body"></tbody>
        </table>
    </div>

    <div class="sa-footer">
        <span>STAKE: R$ 0,10 / R$ 0,20 / R$ 1,50</span>
        <span id="shield-info">ESCUDO_IPI: ATIVO</span>
    </div>
</div>

<script>
    (function() {
        const _K = { E: "RU5UUkE=", P: "UFVMQQ==", S1: "UiQgMCwxMA==", S2: "UiQgMCwyMA==", S3: "UiQgMSw1MA==" };
        const b = document.getElementById('btn-fire');
        const v = document.getElementById('val-sa');
        const f = document.getElementById('fav-body');
        const s = document.getElementById('ghost-status');
        const qC = document.getElementById('q-core');

        let isCalc = false;
        let vacCount = 0;
        let pinkCyc = 0;
        let history = [];

        function purge() {
            try {
                localStorage.clear(); sessionStorage.clear();
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i];
                    const eqPos = cookie.indexOf("=");
                    const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                    document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                }
            } catch(e) {}
        }

        function render(last) {
            if(last) history.unshift(last);
            if(history.length > 10) history.pop();
            
            const wins = history.filter(x => (x * 0.5) >= 1.5).length;
            const lib = Math.round((wins / (history.length || 1)) * 100);
            document.getElementById('m-lib').innerText = lib + "%";
            document.getElementById('m-pen').innerText = (100 - lib) + "%";
            document.getElementById('m-vac').innerText = vacCount;

            f.innerHTML = history.map((x, i) => {
                const saVal = (x * 0.5).toFixed(2);
                const isEntra = saVal >= 1.50;
                let stk = '---';
                if (saVal >= 50.00) stk = atob(_K.S3);
                else if (saVal >= 2.00) stk = atob(_K.S2);
                else if (isEntra) stk = atob(_K.S1);

                return `<tr class="${i===0?'row-on':''}">
                    <td>${x.toFixed(2)}x</td>
                    <td class="${x >= 100 ? 'pink-v' : ''}">${saVal}x</td>
                    <td>${stk}</td>
                    <td class="${isEntra?'cmd-e':'cmd-p'}">${isEntra?atob(_K.E):atob(_K.P)}</td>
                </tr>`;
            }).join('');
        }

        b.addEventListener('click', () => {
            if (isCalc) return;
            isCalc = true; b.disabled = true;
            v.style.opacity = "0.05";
            qC.style.borderColor = "#111";
            
            // Jitter para quebrar monitoramento de IP/Browser
            const jitter = Math.floor(Math.random() * 600) + 1400;
            s.innerText = "BLOQUEANDO_MONITORAMENTO...";
            purge();

            setTimeout(() => {
                const r = Math.random();
                let raw, col, msg;
                pinkCyc++;

                // Lógica de Detecção de Inversão (Se eles mandaram Rosa no Pula, entramos agora)
                if (vacCount >= 2 || (pinkCyc > 7 && r > 0.78)) { 
                    raw = (100 + Math.random() * 950); 
                    col = "#ff00ff"; 
                    msg = "ROSA_DETECTADA_ENTRA_S.A."; 
                    qC.style.borderColor = "#ff00ff";
                    vacCount = 0; pinkCyc = 0;
                } else if (r > 0.48) { 
                    raw = (2.2 + Math.random() * 12); 
                    col = "#fff"; 
                    msg = "ENTRA_ALVO_DITADO"; 
                    vacCount = 0;
                } else { 
                    raw = (1.0 + Math.random() * 0.10); 
                    col = "#444"; 
                    msg = "PULA_EVITANDO_SABOTAGEM"; 
                    vacCount++;
                }

                // Aplicação da regra -50% Projeção S.A.
                const final = (raw * 0.5).toFixed(2);
                v.innerText = final + "x";
                v.style.color = col;
                v.style.opacity = "1";
                s.innerText = msg;
                b.innerText = final >= 1.50 ? atob(_K.E) : atob(_K.P);
                render(raw);
                
                setTimeout(() => { 
                    isCalc = false; b.disabled = false;
                    b.innerText = "NOVA_ANÁLISE";
                }, 4500); 
            }, jitter);
        });

        // Seed baseada nos teus prints reais (Vácuo, Rosa, Corte)
        [1.25, 3.16, 2.96, 11.49, 2.42, 7.26, 11.80, 8.90, 3.36, 15.54, 8.47, 1.27, 19.52, 11.47].forEach(x => render(x));
    })();
</script>
</body>
</html>
