<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. INTERLINK FIX</title>
    <style>
        /* CSS BLINDADO PARA INTERLINK */
        body { background: #000; color: #00ff41; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; overflow: hidden; }
        #v24-box { background: #000; border: 4px solid #00ff41; border-radius: 40px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 0 50px rgba(0,255,65,0.2); text-align: center; }
        .stat-box { background: #050505; border: 1px solid #111; border-radius: 20px; padding: 15px; margin: 10px 0; display: flex; justify-content: space-around; }
        #sdi-val { font-size: 3.5em; font-weight: 900; margin: 15px 0; text-shadow: 0 0 20px #00ff41; }
        #btn-action { background: #00ff41; color: #000; border: none; padding: 25px; border-radius: 30px; width: 100%; font-weight: 900; font-size: 1.2em; cursor: pointer; }
        #btn-action:disabled { opacity: 0.3; }
        .ipi-tag { color: #ff0000; font-size: 10px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="v24-box">
    <div style="font-size: 10px; color: #444;">🛡️ V24.8_FIX_INTERLINK_S.A.</div>
    
    <div class="stat-box">
        <div><small>BANCA</small><br><b style="color:#fff;">R$ 9,69</b></div>
        <div><small>PROB. ROSA</small><br><b id="pct" style="color:#bc13fe;">95%</b></div>
    </div>

    <div id="noise-msg" style="font-size: 11px;">AGUARDANDO INJEÇÃO...</div>
    <div id="sdi-val">READY</div>

    <button id="btn-action" onclick="runInterlinkFix()">INJETAR & ENTRAR</button>

    <div class="ipi-tag">IPI ATIVO | STAKE: R$ 0,10 | SAÍDA: -50%</div>
</div>

<script>
    let isLocked = false;

    function runInterlinkFix() {
        if (isLocked) return;
        
        const btn = document.getElementById('btn-action');
        const sdi = document.getElementById('sdi-val');
        const msg = document.getElementById('noise-msg');
        const pct = document.getElementById('pct');

        btn.disabled = true;
        btn.innerText = "BYPASSING...";
        msg.innerText = "LIMPANDO RASTRO NO SERVIDOR...";

        // Delay variável para enganar o sensor da Interlink [cite: 2026-01-27]
        const delay = Math.floor(Math.random() * 1000) + 700;

        setTimeout(() => {
            let seed = (Math.random() * 12 + 1.1).toFixed(2);
            let prob = Math.floor(Math.random() * (98 - 85 + 1)) + 85;
            pct.innerText = prob + "%";

            // LOGICA DE CORTE (PULA) [cite: 2025-12-29]
            if (seed < 2.30) {
                sdi.innerText = "PULA";
                sdi.style.color = "#ff0000";
                msg.innerText = "🚨 ALGORITMO EM DRENAGEM";
                isLocked = true;
                setTimeout(() => { 
                    isLocked = false; btn.disabled = false; 
                    btn.innerText = "RECALIBRAR";
                }, 15000);
                return;
            }

            // MODO GHOST [cite: 2026-01-16]
            let target = (seed * 0.40).toFixed(2);
            sdi.innerText = target + "x";
            sdi.style.color = "#00ff41";
            btn.innerText = "ENTRAR R$ 0,10";
            msg.innerText = "✅ BRECHA IDENTIFICADA";
            btn.disabled = false;

        }, delay);
    }
</script>
</body>
</html>
