<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. V26_PRECISION</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 150px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(10,0,0,0.9); }
        .dual-display { display: flex; justify-content: space-around; padding: 10px; gap: 5px; }
        .box { border: 2px solid #00ffcc; flex: 1; text-align: center; padding: 10px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .roxo { border-color: #9d00ff; color: #9d00ff; }
        .rosa { border-color: #ff0055; color: #ff0055; }
        .value { font-size: 24px; font-weight: 900; display: block; }
        .label { font-size: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .status-ghost { color: #ff0055; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="processSync(event)">
    <div style="background: #111; padding: 5px; border-bottom: 2px solid #ff0055; display: flex; justify-content: space-between;">
        <span>S.A. V26_PRECISION</span>
        <span id="clock">01:52</span>
    </div>

    <div class="dual-display">
        <div class="box roxo">
            <span class="label">Mão 1 (Roxa)</span>
            <span class="value" id="safe-val">READY</span>
        </div>
        <div class="box rosa">
            <span class="label">Mão 2 (Rosa)</span>
            <span class="value" id="pink-val">READY</span>
        </div>
    </div>

    <div class="terminal" id="term">> AGUARDANDO COMANDO GHOST...</div>

<script>
    const term = document.getElementById('term');
    // ATUALIZAÇÃO BASEADA NO SEU PRINT
    const masterSeed = "RF9mS2vK0zN4bX1vQ8pW5-0-0"; 
    const serverHash = "3b259bd9686d030c41653770dd52deb192221d5"; 

    async function processSync(e) {
        if (e) e.stopPropagation();
        
        const fragmentation = Math.random().toString(36).substring(7);
        logEvent(`ANALISANDO HASH: ${serverHash.substring(0,8)}...`);

        setTimeout(async () => {
            const encoder = new TextEncoder();
            const salt = Date.now().toString() + fragmentation;
            const data = encoder.encode(masterSeed + serverHash + salt);
            
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const view = new DataView(hashBuffer);
            const result = view.getUint32(0) / 0xFFFFFFFF; 

            // FILTRO REFINADO: Se result < 0.40, o gráfico está em retenção (Vácuo)
            const barrierFilter = 0.42; 
            
            if (result < barrierFilter) {
                document.getElementById('safe-val').innerText = "VÁCUO!";
                document.getElementById('pink-val').innerText = "---";
                logEvent("⚠️ RETENÇÃO DETECTADA: NÃO ENTRE AGORA!");
                return;
            }

            // REFINAMENTO ROXAS (2.0x a 5.0x)
            const targetRoxo = (result * 3.5 + 1.8).toFixed(2);
            document.getElementById('safe-val').innerText = targetRoxo + "x";

            // REFINAMENTO ROSAS (Acima de 10x) - Gatilho SHA-256 > 0.92
            let pink = (result > 0.92) ? (result * 45 + 15).toFixed(2) : "---";
            document.getElementById('pink-val').innerText = pink + (pink !== "---" ? "x" : "");

            if(pink !== "---") {
                logEvent(`🚨 ALERTA ROSA DETECTADO: ${pink}x`);
            } else {
                logEvent(`GHOST OK: ALVO ${targetRoxo}x`);
            }
        }, 350);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 6) term.removeChild(term.lastChild);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
