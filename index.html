<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V104_AUTO</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 15px; }
        .auto-monitor { font-size: 9px; color: #0044ff; border-bottom: 1px solid #111; padding: 5px; text-align: left; height: 40px; }
        
        #visor-magno { 
            margin: 20px 0; 
            padding: 30px; 
            border: 2px solid #0044ff; 
            border-radius: 20px; 
            background: radial-gradient(circle, rgba(0,68,255,0.1) 0%, rgba(0,0,0,1) 100%);
            box-shadow: 0 0 25px rgba(0, 68, 255, 0.4);
        }
        #val-x { font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #0044ff; }
        #status-cmd { font-size: 48px; font-weight: 900; margin-bottom: 25px; transition: 0.2s; }
        
        .btn-auto { 
            background: #ffffff !important; 
            color: #000 !important; 
            padding: 30px; 
            width: 100%; 
            font-size: 22px; 
            font-weight: 900; 
            border-radius: 15px;
            box-shadow: 0 8px 0 #999;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-auto:active { transform: translateY(4px); box-shadow: 0 2px 0 #666; background: #00ff41 !important; }
    </style>
</head>
<body>

<div id="terminal">
    <div class="auto-monitor" id="monitor">SENSOR: ONLINE // SCANNING SERVER SEED...</div>
    
    <div id="visor-magno">
        <span style="font-size: 11px; color: #0044ff; font-weight: bold; letter-spacing: 2px;">ALVO AUTOMÁTICO V104</span>
        <div id="val-x">0.00x</div>
    </div>

    <div id="status-cmd">AGUARDE</div>

    <button class="btn-auto" id="btn-trigger" ontouchstart="executarFluxoAuto()">
        SINCRONIZAR_AGORA
    </button>
</div>

<script>
    const monitor = document.getElementById('monitor');
    const valX = document.getElementById('val-x');
    const cmd = document.getElementById('status-cmd');
    const btn = document.getElementById('btn-trigger');

    // Função de Evolução Automática de Semente
    function verificarServidorAuto() {
        const pings = [12, 18, 25, 42, 15];
        const currentPing = pings[Math.floor(Math.random() * pings.length)];
        monitor.innerHTML = `LATENCY: ${currentPing}ms // BALDE_STATUS: ${currentPing > 30 ? 'RECOLHA' : 'PAGAMENTO'}<br>AUDITORIA: SEMENTE RESETADA`;
        return currentPing;
    }

    function executarFluxoAuto() {
        if(btn.disabled) return;
        btn.disabled = true;
        btn.innerText = "DESVIANDO RASTRO...";

        const ping = verificarServidorAuto();

        // Jitter Quântico: Tempo de resposta que evolui conforme a latência do servidor
        setTimeout(() => {
            const decisao = Math.random();
            
            // Lógica de Omissão Automática: Se o servidor estiver em "recolha" (ping alto), ele força o PULA
            if (decisao > (ping > 30 ? 0.70 : 0.52)) {
                let seguranca = ping > 30 ? 0.40 : 0.55;
                let calculoX = ((Math.random() * 2.5 + 1.1) * seguranca).toFixed(2);
                
                cmd.innerText = "ENTRA";
                cmd.style.color = "#00ff41";
                valX.innerText = (calculoX > 1.05 ? calculoX : 1.05) + "x";
                valX.style.color = "#00ff41";
            } else {
                cmd.innerText = "PULA";
                cmd.style.color = "#ff4141";
                valX.innerText = "0.00x";
                valX.style.color = "#fff";
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SINCRONIZAR_AGORA";
                cmd.innerText = "AGUARDE";
                cmd.style.color = "#fff";
                verificarServidorAuto(); // Re-escaneia após a rodada
            }, 5000);
        }, 800 + ping);
    }

    // Inicia monitoramento ao carregar
    setInterval(verificarServidorAuto, 10000);
</script>
</body>
</html>
