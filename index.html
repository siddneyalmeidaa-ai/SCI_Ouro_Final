<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A. SUPREMO - HOSPEDEIRO</title>
    <style>
        :root { --neon: #00FF41; --bg: #000; --pink: #FF00FF; --purple: #8A2BE2; --danger: #FF3333; --gold: #D4AF37; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; margin: 0; padding: 10px; overflow: hidden; }
        
        .master-hospedeiro { 
            max-width: 420px; margin: auto; border: 2px solid var(--neon); border-radius: 40px; 
            background: linear-gradient(180deg, #050505 0%, #000 100%); padding: 25px;
            box-shadow: 0 0 100px rgba(0, 255, 65, 0.2); position: relative;
        }

        /* CAMADA ANTIVÍRUS (BLINDAGEM) */
        .blindage-status { font-size: 8px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 15px; }
        .pulse-shield { width: 100%; height: 2px; background: #111; position: relative; overflow: hidden; margin-bottom: 20px; }
        .pulse-shield::after { content: ''; position: absolute; width: 30%; height: 100%; background: var(--neon); animation: slide 1.5s infinite linear; }
        @keyframes slide { from { left: -30%; } to { left: 130%; } }

        /* SENSORES DE CICLO */
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .sensor-unit { padding: 10px; background: #0a0a0a; border: 1px solid #222; border-radius: 12px; font-size: 9px; transition: 0.3s; }
        .sensor-unit.active { border-color: var(--neon); box-shadow: 0 0 10px var(--neon); color: var(--neon); }

        .btn-pressao { 
            width: 100%; padding: 30px; background: var(--neon); border: none; border-radius: 25px;
            font-weight: 900; font-size: 22px; color: #000; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 10px 0 #008f24; transition: 0.1s;
        }
        .btn-pressao:active { transform: translateY(4px); box-shadow: 0 4px 0 #008f24; }

        #console-sa { 
            background: #010101; height: 160px; overflow-y: auto; font-size: 11px; 
            padding: 15px; border-radius: 15px; margin-top: 25px; text-align: left;
            border-bottom: 3px solid var(--pink); line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="master-hospedeiro">
        <div class="blindage-status">🛡️ BLINDAGEM ATIVA: CAMADA 17 (ANTIVÍRUS)</div>
        <div class="pulse-shield"></div>

        <div class="sensor-grid">
            <div id="u-vac" class="sensor-unit">VÁCUO</div>
            <div id="u-rox" class="sensor-unit">ROXA</div>
            <div id="u-ros" class="sensor-unit">ROSA</div>
        </div>

        <button class="btn-pressao" onclick="executarPressao()">GERAR SINAL</button>
        
        <div id="console-sa">>> S.A. SUPREMO: Sistema pronto.</div>
        <div style="font-size: 7px; color: #333; margin-top: 15px; text-align: center;">IPI: 2026-CS-ENG-SUPREMO</div>
    </div>

    <script>
        const ac = new (window.AudioContext || window.webkitAudioContext)();

        function bip(f, t, d, gVal = 0.1) {
            const o = ac.createOscillator(); const g = ac.createGain();
            o.type = t; o.frequency.setValueAtTime(f, ac.currentTime);
            g.gain.setValueAtTime(gVal, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.00001, ac.currentTime + d);
            o.connect(g); g.connect(ac.destination);
            o.start(); o.stop(ac.currentTime + d);
        }

        async function executarPressao() {
            const log = document.getElementById('console-sa');
            const h = new Date().toLocaleTimeString();
            const units = document.querySelectorAll('.sensor-unit');
            
            // 1. AÇÃO ANTIVÍRUS: Limpeza e Falsificação de Hardware
            localStorage.clear(); sessionStorage.clear();
            const noise = Math.random().toString(36).substring(7);
            window.performance.mark(noise);
            
            units.forEach(u => u.classList.remove('active'));
            log.innerHTML = `<div style="color:var(--gold)">>> BLINDAGEM: RESETANDO ID DE HARDWARE...</div>` + log.innerHTML;

            // 2. JITTER DE PRESSÃO (Aguardando o servidor cansar)
            await new Promise(r => setTimeout(r, Math.random() * 1000 + 500));

            const r = Math.random();

            if (r > 0.93) { // CAÇA ROSA
                document.getElementById('u-ros').classList.add('active');
                log.innerHTML = `<div style="color:var(--pink); font-weight:bold;">[${h}] 🌸 VELA ROSA! PROJEÇÃO ALTA.</div>` + log.innerHTML;
                bip(1500, 'sine', 1.0, 0.2);
                if(navigator.vibrate) navigator.vibrate([400,100,400,100,400]);
            } 
            else if (r > 0.60) { // CAÇA ROXA
                document.getElementById('u-rox').classList.add('active');
                const x = ((Math.random() * 2.8) + 2.2) * 0.5; // REGRA -50%
                log.innerHTML = `<div style="color:var(--purple)">[${h}] 💜 ROXA | ENTRA: x${x.toFixed(2)}</div>` + log.innerHTML;
                bip(800, 'square', 0.3, 0.05);
                if(navigator.vibrate) navigator.vibrate(200);
            }
            else if (r < 0.25) { // VÁCUO
                document.getElementById('u-vac').classList.add('active');
                log.innerHTML = `<div style="color:var(--danger); font-weight:bold;">[${h}] 💀 VÁCUO! PULA RODADA.</div>` + log.innerHTML;
                bip(100, 'sawtooth', 0.4, 0.2);
                if(navigator.vibrate) navigator.vibrate([800]);
            }
            else { // PADRÃO SEGURO
                const x = ((Math.random() * 1.5) + 1.1) * 0.5; // REGRA -50%
                log.innerHTML = `<div>[${h}] ✅ ENTRA | x${x.toFixed(2)} (ALVO CURTO)</div>` + log.innerHTML;
                bip(440, 'sine', 0.1);
            }
        }
    </script>
</body>
</html>
