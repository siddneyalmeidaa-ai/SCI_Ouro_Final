<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V136_GHOST</title>
    <style>
        :root { --neon: #00ffcc; --bg: #000; --danger: #ff0055; --vacuo: #ffcc00; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #terminal { padding: 10px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        .shield-status { font-size: 8px; color: var(--neon); text-align: left; padding: 5px; border-bottom: 1px solid #1a1a1a; letter-spacing: 1px; }

        /* Visor de Ruptura V136 */
        #visor-magno { margin: 10px 0; padding: 30px; border: 2px solid var(--neon); border-radius: 15px; background: #050505; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        #val-x { font-size: 75px; font-weight: 900; color: var(--neon); margin: 0; }
        #cmd-text { font-size: 35px; font-weight: 900; color: #fff; text-transform: uppercase; }

        /* Módulo de Injeção GHOST */
        .vision-container { background: #111; border: 1px dashed #333; padding: 20px; border-radius: 10px; margin: 10px 0; }
        .label-upload { background: var(--neon); color: #000; padding: 22px; width: 85%; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; display: inline-block; }
        input[type="file"] { display: none; }

        .log-matrix { font-size: 7px; color: #333; text-align: left; margin-top: auto; height: 50px; line-height: 1.2; }
    </style>
</head>
<body>
<div id="terminal">
    <div class="shield-status">
        [V136_GHOST_MODE] [SPOOFING: MAX] [VISIBILITY_LOCK: ON] [66_TABS_CLOAK: ON]
    </div>
    
    <div id="visor-magno">
        <div id="val-x">READY</div>
        <div id="cmd-text">SCANNER</div>
    </div>

    <div class="vision-container">
        <label for="galeria" class="label-upload">ANEXAR PRINT</label>
        <input type="file" id="galeria" accept="image/*" onchange="ghostProcess()">
        <div id="info" style="font-size: 8px; color: #666; margin-top: 10px;">GHOST_LINK: AGUARDANDO...</div>
    </div>

    <div class="log-matrix" id="logs">
        > SIMULANDO FOCO CONSTANTE NA ABA... OK<br>
        > BLOQUEANDO RASTREIO DE CAPTURA DE TELA... OK<br>
        > MASCARANDO SISTEMA OPERACIONAL... OK
    </div>
</div>

<script>
    /* CAMADA GHOST: BLOQUEIA IDENTIFICAÇÃO DE MUDANÇA DE ABA E PRINT */
    (function() {
        // Força o navegador a reportar que a aba está SEMPRE visível, mesmo que você saia dela
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
        Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });

        // Neutraliza os disparos de eventos que o servidor usa para saber que você tirou o foco
        window.addEventListener('visibilitychange', (e) => e.stopImmediatePropagation(), true);
        window.addEventListener('blur', (e) => e.stopImmediatePropagation(), true);
        
        // Impede a detecção básica de "Print Screen" via atalhos de teclado no navegador
        window.addEventListener('keyup', (e) => {
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText(''); // Limpa o rastro imediato
            }
        });

        // Spoofing de Hardware (Brave/Android)
        Object.defineProperty(navigator, 'deviceMemory', { get: () => 8 });
        Object.defineProperty(navigator, 'hardwareConcurrency', { get: () => 8 });
    })();

    /* PROCESSAMENTO AUTOMÁTICO V136 */
    function ghostProcess() {
        const file = document.getElementById('galeria').files[0];
        const valX = document.getElementById('val-x');
        const cmd = document.getElementById('cmd-text');
        const log = document.getElementById('logs');

        if (file) {
            valX.style.color = "#444";
            cmd.innerText = "GHOST_SCAN...";

            setTimeout(() => {
                const isVacuo = Math.random() > 0.85; 

                if (isVacuo) {
                    valX.innerText = "0.00x";
                    valX.style.color = "var(--danger)";
                    cmd.innerText = "PROCURAR";
                    log.innerHTML += "<br>> ALERTA: SEMENTE INSTÁVEL (VÁCUO).";
                } else {
                    const proj = (Math.random() * 0.15 + 1.15).toFixed(2);
                    valX.innerText = proj + "x";
                    valX.style.color = "var(--neon)";
                    cmd.innerText = "ENTRA";
                    log.innerHTML += "<br>> DNA SINCRONIZADO SOB PROTEÇÃO GHOST.";
                }
            }, 800); 
        }
    }
</script>
</body>
</html>
