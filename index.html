<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S.A._V87_TOTAL_PROTECTION</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: #000; color: #d0d0d0; font-family: 'Courier New', monospace; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #main-shell { flex: 1; display: flex; flex-direction: column; padding: 15px; border: 4px solid #111; position: relative; background: radial-gradient(circle at 20% 20%, #0a0a1a 0%, #000 100%); }
        
        .sa-header { border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 10px; color: #555; }
        
        /* PAINEL DE BANCA E BANDA */
        .bank-panel { background: rgba(0, 255, 0, 0.03); border: 1px solid #1a1a1a; padding: 12px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .bank-info { display: flex; flex-direction: column; }
        .bank-label { font-size: 9px; color: #444; text-transform: uppercase; }
        .bank-val { font-size: 18px; font-weight: 900; color: #00ff41; }
        .band-status { font-size: 8px; color: #ffcc00; margin-top: 4px; border: 1px solid #332200; padding: 2px 5px; border-radius: 2px; }

        .quantum-display { background: #020202; border: 2px solid #1a1a1a; padding: 20px 10px; text-align: center; border-radius: 4px; position: relative; overflow: hidden; }
        .val-sa { font-size: 70px; font-weight: 900; color: #fff; margin: 5px 0; transition: all 0.2s; text-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
        .status-ghost { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #ff00ff; height: 12px; font-weight: bold; }
        
        .btn-sa { background: #ffffff; color: #000; border: none; width: 100%; padding: 20px; font-size: 24px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: all 0.3s; border-radius: 4px; box-shadow: 0 6px 0 #444; z-index: 10; position: relative; }
        .btn-sa:active { transform: translateY(4px); box-shadow: 0 2px 0 #222; }
        .btn-sa:disabled { background: #111; color: #333; box-shadow: none; transform: translateY(4px); }
        
        .metrics-sync { display: flex; gap: 8px; margin-top: 12px; }
        .m-card { flex: 1; background: #030303; border: 1px solid #111; padding: 8px; text-align: center; }
        .m-label { font-size: 7px; color: #444; margin-bottom: 4px; }
        .m-val { font-size: 14px; font-weight: 900; }

        .favelinha-box { margin-top: 12px; background: #020202; border: 1px solid #0d0d0d; flex: 1; overflow-y: auto; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th { background: #080808; color: #333; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px 10px; border-bottom: 1px solid #060606; color: #444; }
        .row-on { color: #fff !important; background: rgba(0, 255, 255, 0.03); }
        .cmd-e { color: #00ff41 !important; font-weight: bold; }
        .cmd-p { color: #ff4141 !important; font-weight: bold; }
        .pink-v { color: #ff00ff !important; font-weight: bold; }
        
        .sa-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid #111; display: flex; justify-content: space-between; font-size: 8px; color: #333; }
    </style>
</head>
<body>
<div id="main-shell">
    <div class="sa-header"><span>S.A._V87_CORE_TOTAL</span><span>05:04</span></div>
    
    <div class="bank-panel">
        <div class="bank-info">
            <span class="bank-label">BANCA ATUAL (SIM)</span>
            <span id="bank-val" class="bank-val">R$ 100,00</span>
        </div>
        <div class="bank-info" style="text-align: right;">
            <span class="bank-label">BANDA DE RISCO</span>
            <span id="band-status" class="band-status">PROTEÇÃO ATIVA</span>
        </div>
    </div>

    <div class="quantum-display">
        <div class="status-ghost" id="ghost-status">SISTEMA INICIALIZADO...</div>
        <div class="val-sa" id="val-sa">0.00x</div>
        <button class="btn-sa" id="btn-fire">MAPEAR RODADA</button>
    </div>

    <div class="metrics-sync">
        <div class="m-card"><div class="m-label">LIBERADO</div><div id="m-lib" class="m-val" style="color:#00ff41">--%</div></div>
        <div class="m-card"><div class="m-label">PENDENTE</div><div id="m-pen" class="m-val" style="color:#ffcc00">--%</div></div>
        <div class="m-card"><div class="m-label">VÁCUO_SEQ</div><div id="m-vac" class="m-val" style="color:#ff00ff">0</div></div>
    </div>

    <div class="favelinha-box">
        <table>
            <thead><tr><th>ALVO</th><th>S.A.(-50%)</th><th>STAKE</th><th>CMD</th></tr></thead>
            <tbody id="fav-body"></tbody>
        </table>
    </div>

    <div class="sa-footer">
        <span>IPI: V87_CORE_TOTAL_BANCA</span>
        <span id="shield-info">SENTE O NÚCLEO, S.A.</span>
    </div>
</div>

<script>
    (function() {
        const _K = { 
            E: "RU5UUkE=", P: "UFVMQQ==", 
            S1: "UiQgMCwxMA==", S2: "UiQgMCwyMA==", S3: "UiQgMSwwMA==",
            B: "UExPQ0tFRF9CQU5L" 
        };
        
        let banca = 100.00;
        let vacCount = 0;
        let history = [];
        let isCalc = false;

        const b = document.getElementById('btn-fire');
        const v = document.getElementById('val-sa');
        const f = document.getElementById('fav-body');
        const s = document.getElementById('ghost-status');
        const bDisp = document.getElementById('bank-val');
        const bandDisp = document.getElementById('band-status');

        function updateMetrics() {
            const wins = history.filter(x => (x * 0.5) >= 1.5).length;
            const lib = Math.round((wins / (history.length || 1)) * 100);
            document.getElementById('m-lib').innerText = lib + "%";
            document.getElementById('m-pen').innerText = (100 - lib) + "%";
            document.getElementById('m-vac').innerText = vacCount;
            bDisp.innerText = `R$ ${banca.toFixed(2)}`;
            
            if(vacCount >= 3) {
                bandDisp.innerText = "ALERTA: VÁCUO DETECTADO";
                bandDisp.style.color = "#ff4141";
            } else {
                bandDisp.innerText = "PROTEÇÃO ATIVA";
                bandDisp.style.color = "#ffcc00";
            }
        }

        function render() {
            f.innerHTML = history.map((x, i) => {
                const saVal = (x * 0.5).toFixed(2);
                const isEntra = saVal >= 1.50;
                let stk = '---';
                if (saVal >= 50.00) stk = atob(_K.S3);
                else if (saVal >= 2.00) stk = atob(_K.S2);
                else if (isEntra) stk = atob(_K.S1);

                return `<tr class="${i===0?'row-on':''}">
                    <td>${x.toFixed(2)}x</td>
                    <td class="${x >= 100 ? 'pink-v' : ''}">${saVal}x</td>
                    <td>${stk}</td>
                    <td class="${isEntra?'cmd-e':'cmd-p'}">${isEntra?atob(_K.E):atob(_K.P)}</td>
                </tr>`;
            }).join('');
        }

        b.addEventListener('click', () => {
            if (isCalc || banca <= 0) return;
            isCalc = true; b.disabled = true;
            v.style.opacity = "0.1";
            s.innerText = "ANALISANDO BANDA DE RISCO...";

            setTimeout(() => {
                const r = Math.random();
                let raw, col, msg, cost = 0;

                // SIMULAÇÃO DE PERDA E VÁCUO (Aumenta conforme vácuo das fotos)
                if (vacCount >= 3 || r < 0.25) { 
                    raw = (1.0 + Math.random() * 0.25); 
                    col = "#444"; 
                    msg = "PULA: EVITANDO DRENO DE BANCA"; 
                    vacCount++;
                } else if (r > 0.85) { // EXPLOSÃO CORE
                    raw = (200 + Math.random() * 300); 
                    col = "#ff00ff"; 
                    msg = "ENTRA: EXPLOSÃO DETECTADA!"; 
                    cost = 1.00;
                    banca += (raw * 0.5 * cost); 
                    vacCount = 0;
                } else { // ENTRADA PADRÃO
                    raw = (3.0 + Math.random() * 10); 
                    col = "#00ff41"; 
                    msg = "ENTRA: CICLO LIBERADO"; 
                    cost = 0.20;
                    banca += (raw * 0.5 * cost);
                    vacCount = 0;
                }

                banca -= cost; // Custo da Stake
                const final = (raw * 0.5).toFixed(2);
                v.innerText = final + "x"; v.style.color = col; v.style.opacity = "1";
                s.innerText = msg;
                
                history.unshift(raw);
                if(history.length > 15) history.pop();
                
                updateMetrics();
                render();
                
                setTimeout(() => { 
                    isCalc = false; b.disabled = false;
                    b.innerText = "PRÓXIMO SCAN";
                }, 1500); 
            }, 800);
        });

        // Seed inicial baseada no histórico das fotos
        [1.12, 1.45, 1.05, 1.20, 1.33].forEach(x => {
            history.unshift(x);
            vacCount++;
        });
        updateMetrics();
        render();
    })();
</script>
</body>
</html>
