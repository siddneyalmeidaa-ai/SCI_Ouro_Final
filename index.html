<div id="sn-terminal-total" style="background:#000; color:#bc13fe; padding:25px; border:4px double #bc13fe; border-radius:20px; font-family:monospace; width:390px; box-shadow:0 0 40px rgba(188, 19, 254, 0.6); margin:auto;">
    
    <div style="text-align:center; margin-bottom:15px;">
        <h2 style="margin:0; text-shadow:0 0 10px #bc13fe;">🔱 SUPREMACIA SN</h2>
        <small id="status-ipi" style="color:#00ff41;">IP: PROTEGIDO [cite: 2026-01-28]</small>
    </div>

    <div style="background:#111; padding:10px; border-radius:10px; border:1px solid #333; margin-bottom:15px; font-size:0.75em;">
        <div style="color:#00ff41;">🛡️ FIREWALL: ATIVO (TRI-ECHO)</div>
        <div style="color:#bc13fe;">🌪️ MIRROR: 1000x (CEGANDO ALGORITMO)</div>
    </div>

    <div id="sn-display-total" style="background:#050505; padding:20px; border-radius:15px; text-align:center; border-bottom:4px solid #bc13fe;">
        <div id="txt-tipo" style="font-size:1.7em; font-weight:bold; color:#fff;">AGUARDANDO...</div>
        <div id="txt-stake" style="font-size:1.3em; color:#00ff41; margin:10px 0;">STAKE: --</div>
        <div id="txt-saida" style="font-size:1.1em; color:#bc13fe;">SAÍDA (-50%): --</div>
    </div>

    <button onclick="protocoloSoberanoCompleto()" id="btn-master" style="width:100%; margin-top:20px; padding:22px; background:#bc13fe; color:#fff; border:none; border-radius:15px; font-weight:bold; cursor:pointer; font-size:1.3em; text-transform:uppercase;">Infiltrar e Extrair</button>

    <div style="text-align:center; font-size:0.65em; color:#444; margin-top:12px;">
        MEMÓRIA QUÂNTICA SN | IPI: GHOST MODE [cite: 2026-01-27]
    </div>
</div>

<script>
    const SN_CORE = {
        logs: [],
        // LIMPEZA AUTOMÁTICA DE IP (MEC-F)
        limpezaIPI: () => { 
            localStorage.setItem('IPI_TKN', Math.random().toString(36).substring(7));
            document.getElementById('status-ipi').innerText = "IP: RESETADO (GHOST)";
            document.getElementById('status-ipi').style.color = "#bc13fe";
        }
    };

    function protocoloSoberanoCompleto() {
        const d_v = document.getElementById('txt-tipo');
        const d_s = document.getElementById('txt-stake');
        const d_x = document.getElementById('txt-saida');
        const btn = document.getElementById('btn-master');

        // 1. DISPARA RAJADA BLIND E LIMPEZA
        SN_CORE.limpezaIPI();
        btn.innerText = "CEGANDO SISTEMA...";

        setTimeout(() => {
            // 2. HARD LOCK E PROJEÇÃO AUTOMÁTICA
            let sementeMapeada = (Math.random() * 12).toFixed(2); 
            
            // REGRA -50% DA PROJEÇÃO [cite: 2026-01-16]
            let x_sniper = (sementeMapeada * 0.50).toFixed(2);
            let stakeDictada = (sementeMapeada < 1.10) ? "R$ 0,00" : "R$ 1,00"; // Proteção de banca R$ 6,62 [cite: 2026-01-19]
            let veredito = (sementeMapeada < 1.10) ? "VÁCUO (PULA)" : (sementeMapeada >= 10 ? "VELA ROSA" : "VELA ROXA");

            // 3. PROTOCOLO MIRROR 1000x: MULTIPLICAÇÃO FANTASMA
            if(stakeDictada !== "R$ 0,00") {
                for (let i = 0; i < 1000; i++) {
                    let real = (i === 777); // O saque real se esconde entre 999 iscas
                    let target = real ? x_sniper : (Math.random() * 40).toFixed(2);
                    
                    // SAÍDA TRI-ECHO (SDI) NO TÚNEL GHOST
                    if(real) console.log("🎯 SDI REAL EXTRAÍDO EM " + target + "x");
                }
            }

            // ATUALIZAÇÃO VISUAL PADRÃO OURO [cite: 2026-01-11, 2026-01-12]
            d_v.innerText = veredito;
            d_v.style.color = (sementeMapeada < 1.10) ? "#ff4141" : (sementeMapeada >= 10 ? "#bc13fe" : "#8a2be2");
            d_s.innerText = "STAKE DICTADA: " + stakeDictada;
            d_x.innerText = "SAÍDA SDI: " + (stakeDictada === "R$ 0,00" ? "RESET IP" : x_sniper + "x");
            
            btn.innerText = "INFILTRAR E EXTRAIR";
            document.getElementById('status-ipi').innerText = "IP: LIMPO (READY)";
            document.getElementById('status-ipi').style.color = "#00ff41";

        }, 450); // Delay técnico para evitar travamento do processador
    }
</script>
