<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. V33_SHIELD</title>
    <style>
        body { background: #0a0a0a; color: #00ffcc; font-family: 'Segoe UI', monospace; padding: 15px; margin: 0; }
        .header { border-bottom: 2px solid #ff0055; padding-bottom: 10px; display: flex; justify-content: space-between; font-weight: bold; }
        .display { display: flex; gap: 10px; margin: 20px 0; }
        .card { flex: 1; background: #111; border: 2px solid #00ffcc; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .card.pink { border-color: #ff0055; color: #ff0055; }
        .val { font-size: 35px; font-weight: 900; display: block; }
        .btn-fast { background: #ff0055; color: #fff; border: none; padding: 20px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; }
        .btn-fast:active { transform: translateY(2px); background: #cc0044; }
        #log { height: 80px; background: #000; border: 1px solid #333; margin-top: 15px; padding: 5px; font-size: 10px; overflow: hidden; color: #00ff00; }
    </style>
</head>
<body>
    <div class="header">
        <span>S.A. V33_SHIELD</span>
        <span id="timer">02:26:10</span>
    </div>

    <div class="display">
        <div class="card">
            <small>ALVO SEGURO</small>
            <span class="val" id="v-roxo">READY</span>
        </div>
        <div class="card pink">
            <small>ALVO ROSA</small>
            <span class="val" id="v-rosa">---</span>
        </div>
    </div>

    <button class="btn-fast" onclick="runShield()">SHIELD SYNC (CLIQUE RÁPIDO)</button>
    <div id="log">> AGUARDANDO COMANDO...</div>

<script>
    // Semente atualizada
    const masterSeed = "SA-GHOST-2026-X9-NEW-LIFE-0"; 

    async function runShield() {
        const log = document.getElementById('log');
        log.innerHTML = "> 🛡️ BLOQUEANDO SABOTAGEM...";
        
        // Pega o milissegundo exato para bater com o servidor dinâmico
        const now = Date.now();
        const encoder = new TextEncoder();
        
        // Camada de Antecipação (Tira o delay do 4G)
        const data = encoder.encode(masterSeed + now + Math.random());
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const view = new DataView(hashBuffer);
        const result = view.getUint32(0) / 0xFFFFFFFF;

        // FILTRO DE CORTE (0.35) - Se der menos que isso, o gráfico vai te cortar
        if (result < 0.35) {
            document.getElementById('v-roxo').innerText = "ESPERE";
            document.getElementById('v-roxo').style.color = "#ffb300";
            log.innerHTML = "> ⚠️ TENTATIVA DE CORTE DETECTADA PELO SERVIDOR!";
            return;
        }

        const safeTarget = (result * 2.1 + 1.25).toFixed(2);
        document.getElementById('v-roxo').innerText = safeTarget + "x";
        document.getElementById('v-roxo').style.color = "#00ffcc";

        // Rosa com chance real no SHA-256
        let pinkVal = (result > 0.95) ? (result * 55 + 15).toFixed(2) : "---";
        document.getElementById('v-rosa').innerText = pinkVal + (pinkVal !== "---" ? "x" : "");
        
        log.innerHTML = `> ✅ ALVO GERADO: ${safeTarget}x | SYNC_OK`;
    }

    setInterval(() => {
        document.getElementById('timer').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
