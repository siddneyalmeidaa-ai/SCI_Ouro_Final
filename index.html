<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. V19_SEED_DECODER</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 180px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(10,0,0,0.9); }
        .dual-display { display: flex; justify-content: space-around; padding: 10px; gap: 5px; }
        .box { border: 1px solid #00ffcc; flex: 1; text-align: center; padding: 10px; border-radius: 4px; }
        .vacuo { border-color: #555; color: #555; }
        .roxa { border-color: #a020f0; color: #a020f0; }
        .rosa { border-color: #ff0055; color: #ff0055; }
        .value { font-size: 26px; font-weight: 900; display: block; }
        .label { font-size: 8px; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; background: #222; padding: 5px; border-bottom: 2px solid #ff0055; }
        .alert { background: #ff0055; color: #fff; text-align: center; font-weight: bold; padding: 4px; display: none; font-size: 10px; }
    </style>
</head>
<body onclick="processSync(event)">
    <div class="header">
        <span>S.A. V19_SEED_DECODER</span>
        <span id="clock">20:55</span>
    </div>

    <div id="warn" class="alert">⚠️ VÁCUO CONFIRMADO PELA SEED - PULE! ⚠️</div>

    <div class="dual-display">
        <div class="box vacuo">
            <span class="label">SEED STATUS</span>
            <span id="seed-st" class="value" style="font-size: 14px;">SYNC</span>
        </div>
        <div class="box roxa">
            <span class="label">Mão 1 (-50%)</span>
            <span class="value" id="safe-val">READY</span>
        </div>
        <div class="box rosa">
            <span class="label">Mão 2 (Rosa)</span>
            <span class="value" id="pink-val">READY</span>
        </div>
    </div>

    <div class="terminal" id="term">
        > DECODIFICADOR DE SEMENTE ATIVO...<br>
        > SERVER_HASH: 64c61d3223a24...
    </div>

<script>
    const term = document.getElementById('term');
    const clientSeed = "mP8dQ1tS5vR9wF3kL0zN2-0-0"; 
    const serverHash = "64c61d3223a24add5e9260b9bef724318d49ab0";

    function processSync(e) {
        if (e) e.stopPropagation();
        const jitter = Math.floor(Math.random() * 150) + 80;
        
        setTimeout(() => {
            // DECODIFICAÇÃO REAL DO DNA DA RODADA [cite: 2026-01-27]
            const combined = clientSeed + serverHash;
            let hashVal = 0;
            for (let i = 0; i < combined.length; i++) {
                hashVal = ((hashVal << 5) - hashVal) + combined.charCodeAt(i);
                hashVal |= 0; 
            }
            
            const entropy = Math.abs(hashVal % 1000) / 1000;
            const alertBox = document.getElementById('warn');
            alertBox.style.display = "none";

            // DETECÇÃO DE VÁCUO (Abaixo de 1.10x) [cite: 2026-01-23]
            if (entropy < 0.32) {
                alertBox.style.display = "block";
                document.getElementById('seed-st').innerText = "VÁCUO";
                logEvent("SISTEMA EM DRENAGEM - SEED MORTA.");
                return;
            }

            // CÁLCULO MÃO 1: REALIDADE DE SEGURANÇA (-50% S.A.) [cite: 2026-01-16]
            const baseTarget = (entropy * 0.7 + 1.25);
            const safeTarget = (baseTarget * 0.50).toFixed(2);
            document.getElementById('safe-val').innerText = safeTarget + "x";

            // CÁLCULO MÃO 2: VELA ROSA (Projeção Decodificada) [cite: 2025-12-29]
            let pinkTarget = (entropy > 0.91) ? (entropy * 45 + 15.00).toFixed(2) : "---";
            document.getElementById('pink-val').innerText = pinkTarget + (pinkTarget !== "---" ? "x" : "");
            document.getElementById('seed-st').innerText = "CALC";

            logEvent(`SEED_READ: OK | SAFE: ${safeTarget}x | ROSA: ${pinkTarget}x`);
        }, jitter);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 8) term.removeChild(term.lastChild);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
