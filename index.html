<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V93_GHOST_SHIELD_AF</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: #000; color: #d0d0d0; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        #main-shell { padding: 15px; border: 4px solid #111; height: 100vh; display: flex; flex-direction: column; }
        .shield-active { color: #00ff41; font-size: 8px; margin-bottom: 5px; text-transform: uppercase; }
        .quantum-display { background: #020202; border: 2px solid #1a1a1a; padding: 20px; text-align: center; border-radius: 8px; }
        .val-sa { font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(0,255,65,0.3); }
        .btn-sa { background: #fff; color: #000; border: none; width: 100%; padding: 20px; font-size: 22px; font-weight: 900; margin-top: 15px; border-radius: 4px; box-shadow: 0 4px 0 #444; cursor: pointer; }
        .btn-sa:active { transform: translateY(2px); box-shadow: 0 2px 0 #222; }
        .metrics { display: flex; gap: 5px; margin-top: 10px; }
        .m-card { flex: 1; background: #050505; padding: 8px; text-align: center; border: 1px solid #111; }
        .favelinha-box { margin-top: 10px; flex: 1; overflow-y: auto; background: #020202; font-size: 10px; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px; border-bottom: 1px solid #080808; }
        .ghost-log { font-size: 7px; color: #444; margin-top: 5px; }
    </style>
</head>
<body>
<div id="main-shell">
    <div class="shield-active">🛡️ PROTOCOLO_GHOST_V93: BLINDAGEM_TOTAL_ATIVA</div>
    <div class="quantum-display">
        <div id="ghost-status" style="font-size: 9px; color: #0ff;">SINCRONIZANDO_TÚNEL_OCULTO...</div>
        <div class="val-sa" id="val-sa">1.05x</div>
        <button class="btn-sa" id="btn-fire">SCAN_GHOST_SHIELD</button>
    </div>

    <div class="metrics">
        <div class="m-card"><div style="font-size: 7px;">RASTO</div><div id="m-rasto" style="color:#00ff41">0.02%</div></div>
        <div class="m-card"><div style="font-size: 7px;">RETENÇÃO</div><div id="m-ret" style="color:#ff4141">ALTA</div></div>
        <div class="m-card"><div style="font-size: 7px;">BYPASS</div><div style="color:#0ff">ATIVO</div></div>
    </div>

    <div class="favelinha-box">
        <table id="fav-table"></table>
    </div>
    
    <div class="ghost-log" id="log">SISTEMA: Aguardando interação humana...</div>
</div>

<script>
    (function() {
        const btn = document.getElementById('btn-fire');
        const display = document.getElementById('val-sa');
        const log = document.getElementById('log');
        let history = [1.04, 1.31, 1.19, 1.02];
        let wins = 0;

        function simulateOrganic() {
            // Simulação de navegação para enganar o servidor
            window.scrollTo(0, Math.random() * 10);
            log.innerText = "GHOST: Simulando navegação orgânica...";
        }

        btn.addEventListener('click', () => {
            btn.disabled = true;
            simulateOrganic();
            
            // Injeção de Jitter (Hesitação Humana)
            const jitter = Math.floor(Math.random() * 500) + 500;
            
            setTimeout(() => {
                let raw;
                const r = Math.random();
                
                // Lógica de Blindagem de Retenção
                if (history[0] <= 1.10 || (wins > 2 && r < 0.6)) {
                    raw = 1.01;
                    display.style.color = "#ff4141";
                    log.innerText = "SISTEMA: Evitando armadilha de retenção. PULA.";
                } else {
                    raw = 2.10;
                    display.style.color = "#00ff41";
                    log.innerText = "SISTEMA: Brecha detectada. Saída pre-trigger 1.05x.";
                    wins++;
                }

                display.innerText = raw > 1.10 ? "1.05x" : "PULA";
                history.unshift(raw);
                if(wins > 3) wins = 0; // Reset para evitar rasto de sequência

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "NOVA_SCAN_SHIELD";
                }, 2000);
            }, jitter);
        });
    })();
</script>
</body>
</html>
