<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V1250 // GHOST S.I.</title>
    <style>
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --cyan: #00f3ff; --red: #ff1744; --green: #00e676; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 2px solid var(--pink); border-radius: 40px; padding: 20px; background: radial-gradient(circle at top, #ff00ff11, #000); box-shadow: 0 0 50px var(--pink); max-width: 450px; margin: auto; }
        .radar-box { width: 90px; height: 90px; border: 3px solid var(--cyan); border-radius: 50%; margin: 0 auto 15px; position: relative; overflow: hidden; }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--cyan)); animation: rotate 0.5s linear infinite; opacity: 0.6; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .painel-voo { background: rgba(0, 243, 255, 0.05); border: 2px solid var(--cyan); border-radius: 25px; padding: 20px; margin-bottom: 15px; }
        #percentual { font-size: 5.5em; color: var(--pink); display: block; line-height: 1; text-shadow: 0 0 25px var(--pink); }
        #status-missao { font-size: 11px; color: var(--gold); margin-top: 10px; text-transform: uppercase; font-weight: bold; }
        .btn-ignicao { background: var(--pink); color: #fff; padding: 22px; border-radius: 25px; font-size: 1.4em; font-weight: 900; width: 100%; border: none; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 30px var(--pink); }
        .btn-ignicao:disabled { filter: grayscale(1); opacity: 0.2; }
        .hist-log { background: #050505; border-radius: 15px; padding: 10px; font-size: 9px; text-align: left; margin-top: 15px; height: 110px; border: 1px solid #111; overflow-y: hidden; }
    </style>
</head>
<body>
    <div class="master-container">
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--pink); margin-bottom:10px;">
            <span>V1650 // ANTI_IDENTIFICATION</span>
            <span id="timer">04:13:00</span>
        </div>
        <div class="radar-box"><div class="radar-sweep"></div></div>
        <div class="painel-voo">
            <span id="percentual">0%</span>
            <div id="status-missao">MÁSCARA ATIVA</div>
        </div>
        <button id="btnMain" class="btn-ignicao" onclick="atacar()">ATAQUE FANTASMA 🔱</button>
        <div class="hist-log" id="log">
            <div style="color:var(--green)">> INJETANDO OFUSCAÇÃO HEURÍSTICA...</div>
            <div style="color:var(--cyan)">> LIMPANDO RASTROS DE IDENTIDADE...</div>
            <div id="diag" style="color:var(--gold)">> DIAGNÓSTICO: CALCULANDO...</div>
        </div>
    </div>

    <script>
        let rodando = false;
        function updateLog(m, c) {
            const l = document.getElementById('log');
            l.innerHTML = `<div style="color:${c}">> ${m}</div>` + l.innerHTML;
        }

        async function atacar() {
            if(rodando) return;
            rodando = true;
            const p_txt = document.getElementById('percentual'), st = document.getElementById('status-missao'), btn = document.getElementById('btnMain');
            btn.disabled = true; st.innerText = "SINAL OFUSCADO...";

            // JITTER DINÂMICO: Impede o servidor de detectar padrão de clique
            const jitter = Math.random() * 50;

            setTimeout(() => {
                let x = 1.00;
                let loop = () => {
                    x += 0.25; // MOTOR V1650 (3ms)
                    let p = ((x - 1) / (1.20 - 1) * 100);
                    if(p > 100) p = 100;
                    p_txt.innerText = Math.floor(p) + "%";

                    if(p >= 30) { // Saque invisível aos 30% da subida
                        st.innerText = "BYPASS ATIVO!";
                        st.style.color = "var(--red)";
                    }

                    if(x >= 1.25) {
                        p_txt.innerText = "0%"; st.innerText = "EXTRAÇÃO FANTASMA";
                        st.style.color = "var(--gold)";
                        btn.disabled = false; rodando = false;
                        updateLog("EXTRAÇÃO REALIZADA EM 3MS", "var(--green)");
                    } else { setTimeout(loop, 3); } // 3ms - VELOCIDADE CRÍTICA
                }; loop();
            }, jitter);
        }
        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
