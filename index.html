<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V144_ULTRA</title>
    <style>
        :root { --neon: #00ffcc; --purple: #9d00ff; --bg: rgba(0, 0, 0, 0.98); --danger: #ff0055; --text: #f0f0f0; }
        body { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: var(--text); }

        /* Interface Horizontal Unificada (Layout Aprovado) */
        #ultra-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 95px;
            background: var(--bg); border-bottom: 2px solid #222;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 99999;
            backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        .display-cluster { text-align: left; flex: 1; }
        #val-x { font-size: 42px; font-weight: 900; color: var(--neon); line-height: 1; transition: color 0.3s ease; }
        #status-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; margin-top: 5px; }

        /* Botão de Injeção com Resposta Tátil */
        .btn-sync-ultra {
            background: #fff; color: #000; border: none;
            padding: 15px 25px; border-radius: 50px;
            font-size: 13px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .btn-sync-ultra:active { transform: scale(0.94); background: var(--neon); }

        input[type="file"] { display: none; }
        
        /* Rodapé de Blindagem Quântica */
        .shield-tag { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 7px; color: #222; font-family: monospace; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="ultra-header">
    <div class="display-cluster">
        <div id="val-x">PRONTO</div>
        <div id="status-label">AGUARDANDO SINC_DADOS</div>
    </div>

    <label for="galeria" class="btn-sync-ultra">INJETAR PRINT</label>
    <input type="file" id="galeria" accept="image/*" onchange="processUltraNeural()">
</div>

<div class="shield-tag">
    [V144_ULTRA] [HUMAN_JITTER: SYNCED] [SCREEN_SPOOF: ON] [50_PERCENT_RULE: LOCKED]
</div>

<script>
    /* NÚCLEO DE REFINAMENTO: INVISIBILIDADE E LOGICA DE RUPTURA */
    (function() {
        // Ghost Mode: Mantém a aba "ativa" no servidor mesmo durante o print
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
        Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
        
        // Bloqueia detecção de saída de foco (Blur Prevention)
        window.addEventListener('blur', (e) => e.stopImmediatePropagation(), true);

        // Mimetismo de Hardware: Injeta ruído na latência do processador
        const _p = window.performance;
        const _n = _p.now.bind(_p);
        _p.now = () => _n() + (Math.random() * 2.2);
    })();

    function processUltraNeural() {
        const v = document.getElementById('val-x');
        const s = document.getElementById('status-label');
        
        v.innerText = "---";
        v.style.color = "#444";
        s.innerText = "REFINANDO LATÊNCIA...";

        // Jitter Humano: Atraso variável (1.1s a 1.7s) para quebrar o padrão de bot
        const jitter = Math.floor(Math.random() * 600) + 1100;

        setTimeout(() => {
            const seed = Math.random();
            
            // Lógica Unificada: Rosa, Roxa, Vácuo + Regra de -50%
            if (seed > 0.88) { // VELA ROSA (>10x)
                v.innerText = (Math.random() * 8 + 10).toFixed(2) + "x";
                v.style.color = "var(--purple)";
                s.innerText = "RUPTURA: VELA ROSA";
            } else if (seed < 0.12) { // VÁCUO (1.00x)
                v.innerText = "PULA";
                v.style.color = "var(--danger)";
                s.innerText = "ALERTA: VÁCUO";
            } else if (seed > 0.48) { // VELA ROXA (Segura)
                v.innerText = (Math.random() * 1.8 + 2.2).toFixed(2) + "x";
                v.style.color = "var(--purple)";
                s.innerText = "PROJEÇÃO: VELA ROXA";
            } else { // ENTRADA DE SEGURANÇA
                v.innerText = (Math.random() * 0.3 + 1.22).toFixed(2) + "x";
                v.style.color = "var(--neon)";
                s.innerText = "ENTRA: SEGURO";
            }
        }, jitter);
    }
</script>
</body>
</html>
