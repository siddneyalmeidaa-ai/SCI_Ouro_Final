<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V254_ALIVE</title>
    <style>
        :root { --c1: #00ffcc; --c2: #9d00ff; --d: #ff0055; --w: #ffd700; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: #fff; }
        .mimic-h { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; }
        .v-out { font-size: 48px; font-weight: 900; color: var(--c1); letter-spacing: -2px; }
        #status-bar { font-size: 7px; color: var(--w); text-transform: uppercase; margin-top: 4px; }
        .live-indicator { width: 6px; height: 6px; background: var(--c1); border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

<div class="mimic-h">
    <div id="m_box">
        <div id="v_display">INICIANDO...</div>
        <div id="status-bar"><span class="live-indicator"></span>ORGANISMO_VIVO: ATIVO</div>
    </div>
</div>

<script>
    const MEM_KEY = "_ga_u_metrics_v2";
    let globalData = JSON.parse(localStorage.getItem(MEM_KEY)) || { rounds: 0, wins: 0 };

    const getS5Entropy = () => {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
    };

    /* CICLO DE VIDA CONTÍNUO (ANTI-TRAVAMENTO) */
    function startLivingCycle() {
        const d = document.getElementById('v_display');
        const s = document.getElementById('status-bar');
        
        // Fase 1: Limpeza/Análise
        d.innerText = "---";
        d.style.color = "#111";
        s.innerHTML = '<span class="live-indicator"></span>S5: ESCANEANDO HISTÓRICO...';

        // Tempo de "pensamento" (2s a 4s)
        setTimeout(() => {
            const seed = getS5Entropy();
            
            // LÓGICA DE PROJEÇÃO [cite: 2026-01-23]
            if (globalData.wins >= 8 && getS5Entropy() < 0.35) {
                d.innerText = "ENTRA"; d.style.color = "#ffa500"; 
                s.innerHTML = '<span class="live-indicator" style="background: #ffa500"></span>⚠️ PERDA TÁTICA: 0.10c';
                globalData.wins = 0;
            } else if (seed > 0.94) {
                d.innerText = (getS5Entropy() * 4 + 11).toFixed(2) + "x";
                d.style.color = "var(--c2)";
                s.innerHTML = '<span class="live-indicator" style="background: var(--c2)"></span>ATHENA: ALVO_ROSA';
                globalData.wins++;
            } else if (seed < 0.28) {
                d.innerText = "PULA"; d.style.color = "var(--d)";
                s.innerHTML = '<span class="live-indicator" style="background: var(--d)"></span>NYX: AGUARDAR_PADRÃO';
            } else {
                const target = [1.38, 1.51, 2.02, 1.44][Math.floor(getS5Entropy() * 4)];
                d.innerText = target.toFixed(2) + "x";
                d.style.color = "var(--c1)";
                s.innerHTML = '<span class="live-indicator"></span>GHOST: ANALISADO';
                globalData.wins++;
            }

            globalData.rounds++;
            localStorage.setItem(MEM_KEY, JSON.stringify(globalData));

            // AGENDA A PRÓXIMA AUTOMATICAMENTE (18s a 35s)
            // O uso de recursão aqui evita que o navegador mate o processo
            const nextWait = (getS5Entropy() * 17000) + 18000;
            setTimeout(startLivingCycle, nextWait);
            
            // Micro-tremor de página para manter aba "viva" [cite: 2026-02-03]
            window.scrollBy(0, getS5Entropy() > 0.5 ? 1 : -1);

        }, (getS5Entropy() * 2000) + 2000);
    }

    // Inicia o organismo assim que carregar
    window.onload = startLivingCycle;
</script>
</body>
</html>
