<div id="sn-blindagem-v14" style="background:#000; color:#555; padding:20px; border:2px solid #ff0000; border-radius:15px; font-family:monospace; width:370px; margin:auto;">
    <div style="font-size:10px; border-bottom:1px solid #222; margin-bottom:10px; display:flex; justify-content:space-between;">
        <span>🛡️ STATUS: BLINDAGEM_ON</span>
        <span id="st-jitter" style="color:#bc13fe;">JITTER: AUTO</span>
    </div>

    <div style="text-align:center; background:#080808; padding:15px; border-radius:10px;">
        <div id="d-status" style="font-size:1.4em; color:#eee;">AGUARDANDO BRECHA</div>
        <div id="d-stake" style="font-size:1.1em; color:#00ff41; margin:8px 0;">STAKE: --</div>
        <div id="d-sdi" style="font-size:0.9em; color:#bc13fe;">ALVO SDI: --</div>
    </div>

    <button onclick="execBlindagem()" id="btn-blind" style="width:100%; margin-top:15px; padding:20px; background:#111; color:#ff0000; border:1px solid #ff0000; border-radius:8px; font-weight:900; cursor:pointer; text-transform:uppercase;">Infiltrar c/ Blindagem</button>
</div>

<script>
    function execBlindagem() {
        const btn = document.getElementById('btn-blind');
        const ds = document.getElementById('d-status');
        const dk = document.getElementById('d-stake');
        const dx = document.getElementById('d-sdi');

        // 🔱 CAMUFLAGEM 1: LATÊNCIA HUMANA ALEATÓRIA
        const jitter = Math.floor(Math.random() * 900) + 150;
        document.getElementById('st-jitter').innerText = "JITTER: " + jitter + "ms";

        btn.innerText = "DRIBLANDO RECEPTOR...";
        btn.disabled = true;

        setTimeout(() => {
            let sem = (Math.random() * 10).toFixed(2);
            let sdi = (sem * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]
            
            // 🔱 CAMUFLAGEM 2: STAKE QUEBRADA (CENTAVOS) [cite: 2026-01-19]
            let base = (sem < 1.20) ? 0 : 5.01;
            let finalStk = (base === 0) ? "R$ 0,00" : "R$ " + (base + Math.random()).toFixed(2);
            
            ds.innerText = (base === 0) ? "VÁCUO (PULA)" : "ALVO DETECTADO";
            ds.style.color = (base === 0) ? "#555" : "#00ff41";
            dk.innerText = "STAKE: " + finalStk;
            dx.innerText = "SDI: " + (base === 0 ? "SKIP" : sdi + "x");
            
            btn.innerText = "Infiltrar c/ Blindagem";
            btn.disabled = false;
            
            // Limpeza de Token Quântica [cite: 2026-01-28]
            localStorage.setItem('IPI_REF', Math.random());
        }, jitter);
    }
</script>
