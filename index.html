<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V1250 - SUPREMACIA ESTÁVEL</title>
    <style>
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --cyan: #00f3ff; --red: #ff1744; --green: #00e676; --purple: #a020f0; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 2px solid var(--gold); border-radius: 30px; padding: 15px; background: #050505; box-shadow: 0 0 30px #D4AF3766; max-width: 400px; margin: auto; }
        
        .radar-box { width: 80px; height: 80px; border: 2px solid var(--gold); border-radius: 50%; margin: 0 auto 10px; position: relative; overflow: hidden; }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--gold)); animation: rotate 2s linear infinite; opacity: 0.5; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
        .box { padding: 10px; border-radius: 10px; font-size: 9px; background: #111; color: #333; border: 1px solid #222; font-weight: bold; }
        .v-active { background: var(--red) !important; color: #fff !important; box-shadow: 0 0 10px var(--red); }
        .ro-active { background: var(--purple) !important; color: #fff !important; box-shadow: 0 0 10px var(--purple); }
        .rs-active { background: var(--pink) !important; color: #fff !important; box-shadow: 0 0 15px var(--pink); }

        .painel { border: 1px solid var(--gold); border-radius: 20px; padding: 10px; margin-bottom: 10px; background: #0a0a0a; }
        #percentual { font-size: 3.5em; color: var(--gold); display: block; font-weight: 900; }
        #status { font-size: 10px; color: #000; background: var(--gold); padding: 4px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }

        .btn-ataque { background: var(--gold); color: #000; padding: 18px; border-radius: 15px; font-size: 1.1em; font-weight: 900; width: 100%; border: none; cursor: pointer; text-transform: uppercase; }
        
        .hist-container { background: #000; border: 1px solid #333; border-radius: 15px; padding: 10px; text-align: left; max-height: 100px; overflow-y: auto; margin-top: 10px; }
        .hist-item { font-family: monospace; font-size: 10px; border-bottom: 1px solid #222; padding: 4px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

        <div class="radar-box"><div class="radar-sweep"></div></div>
        <div class="espectro">
