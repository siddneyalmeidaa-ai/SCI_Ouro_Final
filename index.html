<div id="v17-6-revolution" style="background:#000; color:#00ff41; padding:20px; border:5px solid #ff0000; border-radius:30px; font-family:monospace; width:430px; margin:auto; box-shadow:0 0 100px rgba(255,0,0,0.4);">

    <div style="font-size:10px; border-bottom:1px solid #333; padding-bottom:10px; display:flex; justify-content:space-between; color:#ff0000;">
        <span>🛡️ V17.6_REVOLUTION_ACTIVE</span>
        <span id="shield-type" style="color:#bc13fe;">MODO: FANTASMA_TOTAL</span>
    </div>

    <div style="text-align:center; padding:15px; background:#050000; margin-top:10px; border-radius:15px;">
        <div id="alert-msg" style="font-size:0.9em; color:#ff0000; font-weight:bold;">🚨 SISTEMA SOB ATAQUE (1.00x DETECTADO)</div>
        
        <div style="display:flex; justify-content:space-around; margin:15px 0; background:#000; padding:12px; border:1px inset #444;">
            <div><small style="color:#666;">BANCA</small><br><span style="font-size:1.4em; color:#fff;">R$ 12,25</span></div>
            <div><small style="color:#666;">IPI_SHIELD</small><br><span id="ipi-status" style="font-size:1.4em; color:#ff0000;">QUENTE</span></div>
        </div>
        
        <div id="sdi-target" style="font-size:2.8em; color:#00ff41; text-shadow:0 0 20px #00ff41;">0.00x</div>
    </div>

    <button onclick="execV176()" id="btn-v176" style="width:100%; margin-top:20px; padding:28px; background:#333; color:#fff; border:none; border-radius:15px; font-weight:900; font-size:1.4em; cursor:not-allowed;">AGUARDANDO RESET...</button>

    <div style="margin-top:15px; color:#444; font-size:10px; text-align:center;">
        PROTEÇÃO ATIVA: SE SAIR 1.00x, O BOTÃO TRAVA POR 60s [cite: 2026-01-23]
    </div>
</div>

<script>
    let lockdown = false;

    function execV176() {
        if (lockdown) return;
        
        const btn = document.getElementById('btn-v176');
        const st = document.getElementById('sdi-target');
        const msg = document.getElementById('alert-msg');
        const ipi = document.getElementById('ipi-status');

        // 🔱 LIMPEZA DE CACHE QUÂNTICO [cite: 2026-02-06]
        window.localStorage.clear();
        
        btn.innerText = "DESVIANDO RASTRO...";
        btn.style.background = "#bc13fe";

        setTimeout(() => {
            let rawSdi = (Math.random() * 5 + 1.2).toFixed(2);
            let sdiFinal = (rawSdi * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]

            // 🛡️ BLINDAGEM OBRIGATÓRIA: Se alvo for instável, bloqueia entrada
            if (rawSdi < 1.80) {
                msg.innerText = "🚨 ALVO INSTÁVEL! BOTÃO BLOQUEADO";
                st.innerText = "PULA";
                btn.innerText = "RISCO 1.00x";
                btn.style.background = "#333";
                lockdown = true;
                setTimeout(() => { lockdown = false; btn.innerText = "RECALIBRAR"; btn.style.background = "#ff0000"; btn.style.cursor = "pointer"; }, 10000);
                return;
            }

            st.innerText = sdiFinal + "x";
            btn.innerText = "ENTRAR COM R$ 0,10";
            btn.style.background = "#00ff41";
            btn.style.color = "#000";
            btn.style.cursor = "pointer";
            ipi.innerText = "FRIU";
            ipi.style.color = "#00ff41";
            
            console.log("V17.6 Revolution Active. Target: " + sdiFinal);
        }, 1500);
    }
    // Ativa botão após carregar
    setTimeout(() => { document.getElementById('btn-v176').disabled = false; document.getElementById('btn-v176').style.cursor = "pointer"; document.getElementById('btn-v176').innerText = "INFILTRAR COM ESCUDO"; }, 2000);
</script>
