<div id="v24-0-noise" style="background:#000; color:#fff; padding:25px; border:6px solid #00ff41; border-radius:70px; font-family:monospace; width:480px; margin:auto; box-shadow:0 0 280px rgba(0,255,65,0.4);">

    <div style="font-size:10px; border-bottom:2px solid #111; padding-bottom:15px; display:flex; justify-content:space-between; color:#444;">
        <span>🛡️ V24.1_NOISE_ACTIVE</span>
        <span id="noise-status" style="color:#00ff41;">RUÍDO: INJETADO</span>
    </div>

    <div style="text-align:center; padding:15px; background:#050505; border-radius:40px; border:1px solid #111; margin-top:15px;">
        <div id="noise-msg" style="font-size:0.9em; color:#00ff41; font-weight:bold;">REFINAMENTO DE FREQUÊNCIA ATIVO</div>
        
        <div style="display:flex; justify-content:space-around; margin:15px 0; background:#000; padding:15px; border-radius:20px; border:1px inset #222;">
            <div><small style="color:#666;">BANCA</small><br><span style="font-size:1.6em; color:#fff;">R$ 9,69</span></div>
            <div><small style="color:#666;">PROB. ROSA</small><br><span id="rosa-pct" style="font-size:1.6em; color:#bc13fe;">84%</span></div>
        </div>
        
        <div id="sdi-val" style="font-size:4.2em; color:#00ff41; font-weight:900; text-shadow:0 0 50px #00ff41;">READY</div>
    </div>

    <button onclick="execNoiseV24()" id="btn-noise" style="width:100%; margin-top:20px; padding:45px; background:#00ff41; color:#000; border:none; border-radius:35px; font-weight:900; font-size:1.8em; cursor:pointer; transition:0.2s;">INJETAR RUÍDO & ENTRAR</button>

    <div style="margin-top:20px; font-size:11px; color:#444; text-align:center;">
        <div style="border-top:1px solid #111; padding-top:15px;">
            ALEX_QUANTUM: SENSOR DE VELA ROSA SINCRONIZADO [cite: 2026-02-28]
        </div>
        <div style="margin-top:10px; color:#ff0000; font-weight:bold;">STAKE DITADA: R$ 0,10 [cite: 2026-01-19] | SAÍDA REAL: -50% [cite: 2026-01-16]</div>
    </div>
</div>

<script>
    let noiseLock = false;

    // 🔱 PROTOCOLO SONIC VOICE [cite: 2026-02-13]
    function speak(t) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-BR'; u.rate = 1.3; u.pitch = 0.9;
        window.speechSynthesis.speak(u);
    }

    function execNoiseV24() {
        if (noiseLock) return;

        const btn = document.getElementById('btn-noise');
        const sdi = document.getElementById('sdi-val');
        const msg = document.getElementById('noise-msg');
        const rosaPctElement = document.getElementById('rosa-pct');
        const rosaPct = parseInt(rosaPctElement.innerText);

        // Limpeza de rastros quânticos [cite: 2026-01-28]
        window.localStorage.removeItem('last_signal');
        
        btn.innerText = "SCRAMBLING IP...";
        btn.disabled = true;

        setTimeout(() => {
            // Gerador de semente ampliado para detectar raridade (1.1 a 15.0)
            let baseSeed = (Math.random() * 13.9 + 1.1).toFixed(2);

            // 🛡️ PROTEÇÃO CONTRA O "HOMEM" (Cortes de 1.00x) [cite: 2026-01-27]
            if (baseSeed < 1.85) {
                sdi.innerText = "PULA";
                sdi.style.color = "#ff0000";
                sdi.style.textShadow = "0 0 50px #ff0000";
                msg.innerText = "🚨 BLOQUEIO DE SINAL DETECTADO!";
                msg.style.color = "#ff0000";
                btn.style.background = "#222";
                speak("Corte iminente. Protocolo pula acionado.");
                noiseLock = true;
                
                setTimeout(() => { 
                    noiseLock = false; 
                    btn.disabled = false; 
                    btn.innerText = "RECALIBRAR"; 
                    btn.style.background = "#00ff41";
                }, 19000); 
                return;
            }

            // 🌹 ATIVAÇÃO DO SENSOR DE VELA ROSA (ALTA PROBABILIDADE) [cite: 2026-02-13]
            if (rosaPct >= 80 && baseSeed >= 8.0) {
                sdi.innerText = "ROSA";
                sdi.style.color = "#bc13fe";
                sdi.style.textShadow = "0 0 50px #bc13fe";
                msg.innerText = "💎 SINAL DE RARIDADE CONFIRMADO";
                msg.style.color = "#bc13fe";
                btn.innerText = "ENTRAR NA ROSA R$ 0,10";
                btn.style.background = "#bc13fe";
                btn.style.color = "#fff";
                speak("Atenção Alex. Sensor rosa ativo. Entre com dez centavos.");
            } else {
                // REGRA DE SAÍDA REAL -50% (SAÍDA CURTA) [cite: 2026-01-16]
                let refinedTarget = (baseSeed * 0.40).toFixed(2);
                if (refinedTarget < 1.10) refinedTarget = 1.15; // Blindagem mínima

                sdi.innerText = refinedTarget + "x";
                sdi.style.color = "#00ff41";
                sdi.style.textShadow = "0 0 50px #00ff41";
                msg.innerText = "✅ BRECHA LIMPA: SAÍDA GHOST";
                msg.style.color = "#00ff41";
                btn.innerText = "ENTRAR R$ 0,10 [GHOST]";
                btn.style.background = "#00ff41";
                btn.style.color = "#000";
                speak("Brecha limpa. Entre e saia rápido.");
            }
            
            btn.disabled = false;
        }, 1500);
    }
</script>
