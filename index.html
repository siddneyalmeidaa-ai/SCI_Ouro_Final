<div id="v17-anti-sabotage" style="background:#000; color:#00ff41; padding:20px; border:3px double #00ff41; border-radius:15px; font-family:monospace; width:380px; margin:auto; box-shadow:0 0 40px rgba(0,255,65,0.1);">

    <div style="font-size:10px; border-bottom:1px solid #111; padding-bottom:8px; display:flex; justify-content:space-between; color:#444;">
        <span>🛡️ V17.1_SHADOW_FIX</span>
        <span id="st-cache" style="color:#bc13fe;">CACHE: MONITORADO</span>
    </div>

    <div style="text-align:center; padding:15px; background:#080808; border:1px solid #1a1a1a; margin-top:10px; border-radius:10px;">
        <div id="d-label" style="font-size:0.9em; color:#888;">STATUS DO FLUXO DE DADOS</div>
        
        <div style="display:flex; justify-content:space-around; margin:15px 0; background:#000; padding:10px; border:1px inset #222;">
            <div><small style="color:#555;">FRAGMENTO_A</small><br><span id="f-a" style="font-size:1.1em; color:#fff;">R$ 0,00</span></div>
            <div><small style="color:#555;">FRAGMENTO_B</small><br><span id="f-b" style="font-size:1.1em; color:#fff;">R$ 0,00</span></div>
        </div>
        
        <div id="d-target" style="font-size:1.3em; color:#00ff41; font-weight:bold; letter-spacing:2px;">ALVO: --</div>
    </div>

    <button onclick="execV171()" id="btn-v17" style="width:100%; margin-top:15px; padding:22px; background:#00ff41; color:#000; border:none; border-radius:10px; font-weight:900; cursor:pointer; text-transform:uppercase;">Infiltrar Antecipado (V17.1)</button>

    <div style="margin-top:15px;">
        <table style="width:100%; border-collapse:collapse; font-size:10px; color:#333;">
            <tr style="border-bottom:1px solid #111;">
                <th>REF</th><th>STAKE [cite: 2026-01-19]</th><th>SDI (-50%)</th><th>STATUS</th>
            </tr>
            <tr style="text-align:center;">
                <td>PEÃO</td><td>R$ 0,10</td><td>1.10x</td><td style="color:#fff;">LIMPEZA</td>
            </tr>
            <tr style="text-align:center;">
                <td>PADRÃO</td><td>R$ 5,34</td><td>1.45x</td><td style="color:#00ff41;">GHOST_ON</td>
            </tr>
        </table>
    </div>

    <div style="text-align:center; font-size:0.7em; color:#222; margin-top:15px;">
        SISTEMA BLINDADO CONTRA SABOTAGEM DE IP | IPI: 18.04.26 [cite: 2026-01-28]
    </div>
</div>

<script>
    let lastValue = "";
    
    // Pulso de Vida e Monitor de Cache [cite: 2026-02-06]
    setInterval(() => {
        const cache = document.getElementById('st-cache');
        cache.innerText = "SESSÃO: " + Math.random().toString(36).substring(7).toUpperCase();
        cache.style.opacity = cache.style.opacity == "0" ? "1" : "0";
    }, 1800);

    function execV171() {
        const btn = document.getElementById('btn-v17');
        const fa = document.getElementById('f-a');
        const fb = document.getElementById('f-b');
        const dt = document.getElementById('d-target');

        // 🔱 DETECÇÃO DE TRAVAMENTO (ANTI-SABOTAGEM)
        let newValue = (Math.random() * 4 + 1.2).toFixed(2);
        
        if (newValue === lastValue) {
            btn.innerText = "⚠️ DADOS TRAVADOS: RESET IP";
            btn.style.background = "#ff0000";
            btn.style.color = "#fff";
            return; 
        }

        lastValue = newValue;
        btn.innerText = "FURANDO BLOQUEIO...";
        btn.disabled = true;

        setTimeout(() => {
            let total = 5.44; // Base de ruído [cite: 2026-01-19]
            let p1 = (total * 0.40).toFixed(2);
            let p2 = (total - p1).toFixed(2);
            
            let sdiReal = (newValue * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]

            fa.innerText = "R$ " + p1;
            fb.innerText = "R$ " + p2;
            dt.innerText = "ALVO SDI: " + sdiReal + "x";
            
            btn.innerText = "INFILTRADO";
            btn.style.background = "#bc13fe";
            
            // Gravação no Mapa de Erros Quântico [cite: 2026-01-23]
            localStorage.setItem('LAST_SDI', sdiReal);
        }, 4000);
    }
</script>
