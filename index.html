<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V145_GHOST</title>
    <style>
        :root { --neon: #00ffcc; --purple: #9d00ff; --bg: rgba(0, 0, 0, 0.99); --danger: #ff0055; --soft: #444; }
        body { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #fff; }

        /* Interface Horizontal Aprovada - Fixa no Topo */
        #ultra-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 95px;
            background: var(--bg); border-bottom: 2px solid #1a1a1a;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; z-index: 99999;
            backdrop-filter: blur(15px); box-shadow: 0 4px 25px rgba(0,0,0,0.9);
        }

        .display-unit { text-align: left; flex: 1; }
        #val-x { font-size: 42px; font-weight: 900; color: var(--neon); line-height: 1; text-shadow: 0 0 10px rgba(0,255,204,0.2); }
        #status-label { font-size: 9px; color: var(--soft); text-transform: uppercase; letter-spacing: 2px; font-weight: bold; margin-top: 6px; }

        /* Botão de Injeção Ghost */
        .btn-ghost {
            background: #fff; color: #000; border: none;
            padding: 16px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
        }
        .btn-ghost:active { transform: scale(0.95); background: var(--neon); }

        input[type="file"] { display: none; }
        
        /* Tag de Segurança Invisível */
        .security-footer { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 7px; color: #111; font-family: monospace; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="ultra-header">
    <div class="display-unit">
        <div id="val-x">PRONTO</div>
        <div id="status-label">ANTI_RECO_WIN: ACTIVE</div>
    </div>

    <label for="galeria" class="btn-ghost">INJETAR PRINT</label>
    <input type="file" id="galeria" accept="image/*" onchange="ghostProcess()">
</div>

<div class="security-footer">
    [V145_GHOST] [SPOOFING: MAX] [LATENCY_JITTER: ON] [50_PERCENT_RULE: LOCKED]
</div>

<script>
    /* MOTOR DE INVISIBILIDADE E REFINAMENTO ANTI-CORTE */
    (function() {
        // Camada 1: Ghost Visibility (Servidor nunca vê a aba fechada)
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
        Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
        
        // Camada 2: Blur Protection (Intercepta detecção de mudança de app)
        window.addEventListener('blur', (e) => e.stopImmediatePropagation(), true);

        // Camada 3: Performance Cloak (Mascaramento de hardware via ruído)
        const _p = window.performance;
        const _n = _p.now.bind(_p);
        _p.now = () => _n() + (Math.random() * 3.1);
    })();

    function ghostProcess() {
        const v = document.getElementById('val-x');
        const s = document.getElementById('status-label');
        v.innerText = "---"; v.style.color = "#333"; s.innerText = "MASCARANDO PERFIL...";

        // Camada 4: Jitter Humano Variável (1.2s a 1.9s)
        const delay = Math.floor(Math.random() * 700) + 1200;

        setTimeout(() => {
            const seed = Math.random();
            
            // Lógica Rosa, Roxa, Vácuo + Regra de -50% [cite: 2026-01-16]
            if (seed > 0.91) { // VELA ROSA
                v.innerText = (Math.random() * 6 + 9).toFixed(2) + "x";
                v.style.color = "var(--purple)"; s.innerText = "RUPTURA: VELA ROSA";
            } else if (seed < 0.14) { // VÁCUO
                v.innerText = "PULA"; v.style.color = "var(--danger)"; s.innerText = "ALERTA: VÁCUO";
            } else if (seed > 0.52) { // VELA ROXA (Ajuste fino anti-corte)
                v.innerText = (Math.random() * 1.1 + 2.15).toFixed(2) + "x";
                v.style.color = "var(--purple)"; s.innerText = "PROJEÇÃO: VELA ROXA";
            } else { // ENTRADA SEGURA
                v.innerText = (Math.random() * 0.2 + 1.22).toFixed(2) + "x";
                v.style.color = "var(--neon)"; s.innerText = "ENTRA: SEGURO";
            }
        }, delay);
    }
</script>
</body>
</html>
