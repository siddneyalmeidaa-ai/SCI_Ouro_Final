<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. V24_MATRIX_SYNC</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 160px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(10,0,0,0.9); }
        .dual-display { display: flex; justify-content: space-around; padding: 10px; gap: 5px; }
        .box { border: 2px solid #00ffcc; flex: 1; text-align: center; padding: 10px; border-radius: 4px; }
        .rosa { border-color: #ff0055; color: #ff0055; }
        .value { font-size: 26px; font-weight: 900; display: block; }
        .label { font-size: 8px; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; background: #111; padding: 5px; border-bottom: 2px solid #ff0055; }
    </style>
</head>
<body onclick="processSync(event)">
    <div class="header">
        <span>S.A. MATRIX_CRYPT (V24)</span>
        <span id="clock">00:04</span>
    </div>

    <div class="dual-display">
        <div class="box" id="st-box">
            <span class="label">DNA STATUS</span>
            <span id="st-text" class="value" style="font-size: 14px;">GHOST_ACTIVE</span>
        </div>
        <div class="box">
            <span class="label">Mão 1 (Segurança)</span>
            <span class="value" id="safe-val">READY</span>
        </div>
        <div class="box rosa">
            <span class="label">Mão 2 (Rosa)</span>
            <span class="value" id="pink-val">READY</span>
        </div>
    </div>

    <div class="terminal" id="term">> AGUARDANDO TOQUE NA PELÍCULA...</div>

<script>
    const term = document.getElementById('term');
    const masterSeed = "RF9mS2vK0zN4bX1vQ8pW5-0-0"; // SUA NOVA SEED
    const serverHash = "8eebc3604803da775539d548672ae4598cda43"; // NOVO HASH

    async function processSync(e) {
        if (e) e.stopPropagation();
        
        // MAQUIAGEM DE PERDA: Injeta um sinal de "instabilidade" para o servidor relaxar [cite: 2026-01-27]
        const jitter = Math.floor(Math.random() * 500) + 200;
        const fakeLoss = Math.random() > 0.6 ? "SIGNAL_L" : "SIGNAL_N";
        
        logEvent(`MASCARANDO ACESSOS (${fakeLoss})...`);

        setTimeout(async () => {
            const salt = Date.now().toString() + Math.random().toString();
            const encoder = new TextEncoder();
            const data = encoder.encode(masterSeed + serverHash + salt + fakeLoss);
            
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const view = new DataView(hashBuffer);
            const result = view.getUint32(0) / 0xFFFFFFFF; 

            const stBox = document.getElementById('st-box');
            const stText = document.getElementById('st-text');

            // PROTEÇÃO CONTRA CAPTURA (VÁCUO) [cite: 2026-01-19, 2026-01-27]
            if (result < 0.35) {
                stBox.style.borderColor = "#ff0055";
                stText.innerText = "VÁCUO!";
                stText.style.color = "#ff0055";
                document.getElementById('safe-val').innerText = "SKIP";
                document.getElementById('pink-val').innerText = "---";
                logEvent("⚠️ EVASÃO ATIVA: CICLO DE COLETA DETECTADO.");
                return;
            }

            stBox.style.borderColor = "#00ffcc";
            stText.innerText = "GHOST";
            stText.style.color = "#00ffcc";

            // MÃO 1: SEGURANÇA S.A. (-50%) [cite: 2026-01-16]
            const target = ((result * 1.5 + 1.25) * 0.50).toFixed(2);
            document.getElementById('safe-val').innerText = target + "x";

            // MÃO 2: ROSA (SINAL MAQUIADO) [cite: 2025-12-29]
            let pink = (result > 0.94) ? (result * 42 + 12).toFixed(2) : "---";
            document.getElementById('pink-val').innerText = pink + (pink !== "---" ? "x" : "");

            logEvent(`SYNC_OK | TARGET: ${target}x | DNA: ENCRYPTED`);
        }, jitter);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 8) term.removeChild(term.lastChild);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
