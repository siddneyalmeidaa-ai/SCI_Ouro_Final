<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. DUAL_STRIKE_V16_GHOST</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 180px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(10,0,0,0.9); }
        .dual-display { display: flex; justify-content: space-around; padding: 10px; gap: 10px; }
        .box { border: 1px solid #00ffcc; flex: 1; text-align: center; padding: 10px; }
        .rosa { border-color: #ff0055; color: #ff0055; }
        .value { font-size: 28px; font-weight: 900; display: block; }
        .label { font-size: 9px; text-transform: uppercase; }
        .header { display: flex; justify-content: space-between; background: #222; padding: 5px; border-bottom: 2px solid #ff0055; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        .reset-alert { color: #ff0055; font-weight: bold; animation: blink 0.8s infinite; text-align: center; font-size: 10px; margin-bottom: 5px; }
    </style>
</head>
<body onclick="processSync()">
    <div class="header">
        <span>S.A. V16_GHOST_FERRARI</span>
        <span id="clock">20:30</span>
    </div>

    <div class="reset-alert">⚠️ RESETAR SEMENTE APÓS VELA ROSA ⚠️</div>

    <div class="dual-display">
        <div class="box">
            <span class="label">Mão 1: Segurança (-50%)</span>
            <span class="value" id="safe-val">READY</span>
        </div>
        <div class="box rosa">
            <span class="label">Mão 2: VELA ROSA</span>
            <span class="value" id="pink-val">READY</span>
        </div>
    </div>

    <div class="terminal" id="term">
        > HIGHWAY GHOST_MODE ATIVO...<br>
        > KEY: MP8dQ1tS5vR9wF3kL0zN2-0 [cite: 2026-01-27]
    </div>

<script>
    const term = document.getElementById('term');
    let clickCount = 0;
    
    function processSync() {
        clickCount++;
        // CORREÇÃO 1: Jitter de micro-atraso para simular película (Ghost Mode)
        const jitter = Math.floor(Math.random() * 150) + 30;
        
        setTimeout(() => {
            const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
            
            // CORREÇÃO 2: Variável de Caos a cada 3 cliques para quebrar o padrão [cite: 2026-01-27]
            const chaosFactor = (clickCount % 3 === 0) ? 0.95 : 1.05;
            
            // MÃO 1 (Pagar a conta) - Regra -50% com Caos Injetado [cite: 2026-01-16]
            const rawTarget = (entropy * 0.9 + 1.25) * chaosFactor;
            const safeTarget = (rawTarget * 0.50).toFixed(2);
            document.getElementById('safe-val').innerText = safeTarget + "x";

            // MÃO 2 (Vela Rosa) - Projeção Dinâmica [cite: 2025-12-29]
            let pinkTarget;
            if (entropy > 0.87) { 
                pinkTarget = (entropy * 48 + 14.00).toFixed(2);
                document.getElementById('pink-val').style.color = "#ff0055";
            } else {
                pinkTarget = "---";
                document.getElementById('pink-val').style.color = "#444";
            }
            document.getElementById('pink-val').innerText = pinkTarget + (pinkTarget !== "---" ? "x" : "");

            logEvent(`SYNC_OK | GHOST: ${jitter}ms | SAFE: ${safeTarget}x | STATUS: LIBERADO 100%`);
        }, jitter);
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 8) term.removeChild(term.lastChild);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
