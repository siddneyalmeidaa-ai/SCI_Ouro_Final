<div id="arsenal-war" style="background:#050505; color:#ff0000; padding:20px; border:5px solid #ff0000; border-radius:15px; font-family:monospace; width:380px; box-shadow:0 0 50px #ff0000; margin:auto;">
    
    <div style="text-align:center; border-bottom:2px solid #ff0000; padding-bottom:10px;">
        <h2 style="margin:0; letter-spacing:3px;">🔥 WAR MODE ON</h2>
        <small id="war-status">STATUS: BOMBARDANDO ALGORITMO...</small>
    </div>

    <div style="margin:15px 0; background:#1a0000; padding:10px; font-size:0.7em; color:#ff4444;">
        [!] INJEÇÃO DE ENTROPIA: ATIVA <br>
        [!] MIRROR 10.000x: SOBRECARREGANDO <br>
        [!] FINGERPRINT: FRAGMENTADO [cite: 2026-01-27]
    </div>

    <button onclick="ataqueSupremo()" id="btn-war" style="width:100%; padding:25px; background:#ff0000; color:#fff; border:none; border-radius:10px; font-weight:900; cursor:pointer; font-size:1.4em; box-shadow:0 0 20px #ff0000;">DESTRUIR E EXTRAIR</button>

    <div style="text-align:center; font-size:0.6em; color:#666; margin-top:10px;">
        MEMÓRIA QUÂNTICA SN | OPERAÇÃO BLACKOUT [cite: 2026-02-06]
    </div>
</div>

<script>
    function ataqueSupremo() {
        const btn = document.getElementById('btn-war');
        const status = document.getElementById('war-status');
        
        btn.innerText = "EXPLODINDO...";
        status.innerText = "STATUS: CEGANDO SERVIDOR...";

        // 🔱 BOMBARDREIO DE DADOS (IPI TOTAL) [cite: 2026-01-28]
        for(let i=0; i<10000; i++) {
            if(i % 100 === 0) {
                localStorage.setItem('WAR_CRY_'+i, Math.random());
            }
        }

        setTimeout(() => {
            let sem = (Math.random() * 20).toFixed(2);
            let sdi = (sem * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]
            
            // STAKE DE GUERRA: Centavos quebrados impossíveis de filtrar [cite: 2026-01-19]
            let stkB = (sem < 1.10) ? 0 : 5.01;
            let stkF = stkB === 0 ? "R$ 0,00" : "R$ " + (stkB + (Math.random() * 2)).toFixed(2);

            alert("💥 ALGORITMO CEGO!\nALVO SDI: " + (stkB === 0 ? "SKIP" : sdi + "x") + "\nSTAKE: " + stkF);
            
            btn.innerText = "DESTRUIR E EXTRAIR";
            status.innerText = "STATUS: AGUARDANDO NOVA CARGA";
            localStorage.clear(); // Limpa rastro de guerra
        }, 120); 
    }
                       </script>
