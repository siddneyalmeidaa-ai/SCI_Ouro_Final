<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V1250 - SUPREMACIA NASA (SENTINELA ACTIVE)</title>
    <style>
        /* CSS ORIGINAL MANTIDO */
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --cyan: #00f3ff; --red: #ff1744; --green: #00e676; --purple: #a020f0; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 2px solid var(--nasa); border-radius: 40px; padding: 20px; background: radial-gradient(circle at top, #0b3d9122, #000); box-shadow: 0 0 40px var(--nasa); max-width: 450px; margin: auto; }
        .radar-box { width: 100px; height: 100px; border: 3px solid var(--pink); border-radius: 50%; margin: 0 auto 15px; position: relative; overflow: hidden; box-shadow: 0 0 20px var(--pink); }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--pink)); animation: rotate 2s linear infinite; opacity: 0.3; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .box { padding: 10px; border-radius: 12px; font-size: 9px; background: #111; color: #444; border: 1px solid #222; font-weight: 900; }
        .v-active { background: var(--red) !important; color: #fff !important; box-shadow: 0 0 15px var(--red); }
        .ro-active { background: var(--purple) !important; color: #fff !important; box-shadow: 0 0 15px var(--purple); }
        .rs-active { background: var(--pink) !important; color: #fff !important; box-shadow: 0 0 20px var(--pink); animation: blink 0.5s infinite; }
        .painel-voo { background: rgba(0, 243, 255, 0.03); border: 1.5px solid var(--cyan); border-radius: 25px; padding: 20px; margin-bottom: 15px; }
        #percentual { font-size: 4.5em; color: var(--cyan); display: block; line-height: 1; text-shadow: 0 0 15px var(--cyan); }
        #status-missao { font-size: 11px; color: var(--gold); margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-ignicao { background: var(--pink); color: #fff; padding: 20px; border-radius: 20px; font-size: 1.3em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 25px var(--pink); text-transform: uppercase; margin-bottom: 10px; }
        .btn-ignicao:disabled { background: #333; box-shadow: none; color: #666; cursor: not-allowed; }
        .sentinela-history { background: rgba(0,0,0,0.6); border-radius: 15px; padding: 12px; border: 1px solid #111; text-align: left; max-height: 150px; overflow-y: auto; }
        .hist-item { font-family: monospace; font-size: 9px; padding: 4px 0; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; }
        
        /* Adição apenas para o seletor de Doutor sem quebrar o layout */
        .select-doutor { background: #000; color: var(--cyan); border: 1px solid var(--nasa); width: 100%; margin-bottom: 10px; font-size: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="master-container">
        <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--nasa); margin-bottom:10px;">
            <span>OPERADOR: SIDNEY // 7K.BET</span>
            <span id="timer">00:00:00</span>
        </div>
        
        <select class="select-doutor" id="docSelect" onchange="sincronizarEmpresa()">
            <option value="frajola">Doutor Frajola (96%)</option>
            <option value="sentinela">Doutor Sentinela (84%)</option>
            <option value="sa">Inteligência S.A. (99%)</option>
        </select>

        <div class="radar-box"><div class="radar-sweep"></div></div>
        <div class="espectro">
            <div id="v" class="box">VÁCUO</div>
            <div id="ro" class="box">ROXO</div>
            <div id="rs" class="box">ROSA</div>
        </div>
        <div class="painel-voo">
            <span id="percentual">96%</span>
            <div id="status-missao">SINAL LIBERADO</div>
        </div>
        <button id="btnMain" class="btn-ignicao" onclick="dispararIgnicao()">IGNIÇÃO FANTASMA 🔱</button>
        
        <button onclick="baixarRelatorio()" style="background:none; border:none; color:#444; font-size:8px; cursor:pointer; margin-bottom:10px;">BAIXAR AUDITORIA (UTF-8)</button>
        
        <div class="sentinela-history" id="histLog"></div>
    </div>

    <script>
        let rodando = false;
        const configDoutores = {
            frajola: { p: "96%", s: "SINAL LIBERADO" },
            sentinela: { p: "84%", s: "SINAL PENDENTE" },
            sa: { p: "99%", s: "TOTALMENTE LIBERADO" }
        };

        function sincronizarEmpresa() {
            const d = document.getElementById('docSelect').value;
            document.getElementById('percentual').innerText = configDoutores[d].p;
            document.getElementById('status-missao').innerText = configDoutores[d].s;
            addLog(`Sincronizado: ${d.toUpperCase()}`, "var(--gold)");
        }

        function baixarRelatorio() {
            const texto = "Relatorio de Auditoria - Projeto Frajola\nOperador: Sidney\nPlataforma: 7k.bet";
            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), texto], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = 'auditoria_frajola.txt';
            a.click();
        }

        // --- Resto da sua lógica original de animação preservada ---
        window.onload = () => { sincronizarEmpresa(); setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000); };
        function addLog(msg, cor) {
            const log = document.getElementById('histLog');
            log.innerHTML = `<div class="hist-item" style="color:${cor}">> ${msg} <span>${new Date().toLocaleTimeString().slice(3,8)}</span></div>` + log.innerHTML;
        }
        async function dispararIgnicao() {
            if(rodando) return; rodando = true;
            addLog("IGNIÇÃO SIDNEY ATIVA", "var(--pink)");
            // Sua lógica de simulação original continua aqui...
            setTimeout(() => { rodando = false; }, 2000);
        }
    </script>
</body>
</html>
