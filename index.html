<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GHOST V81 - MANUAL_LOCK</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; text-align: center; padding: 10px; }
        .box { border: 2px solid #ffcc00; border-radius: 35px; padding: 25px; background: #050505; max-width: 380px; margin: auto; box-shadow: 0 0 50px rgba(255,204,0,0.1); }
        .val { font-size: 95px; font-weight: 900; color: #ffcc00; margin: 10px 0; }
        .btn { background: #ffcc00; color: #000; border: none; padding: 22px; width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 18px; text-transform: uppercase; }
        input { background: #000; border: 1px solid #333; color: #ffcc00; padding: 12px; width: 130px; border-radius: 10px; font-size: 26px; text-align: center; margin-bottom: 10px; outline: none; }
        .key-info { font-size: 8px; color: #444; margin-top: 15px; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <div style="font-size: 9px; letter-spacing: 4px; color: #ffcc00;">V81 // MANUAL_SEED_LOCKED</div>
        
        <div style="margin-top: 20px; font-size: 10px; color: #666;">ÚLTIMA VELA (EX: 2.08):</div>
        <input type="number" id="v" step="0.01" placeholder="0.00">

        <div class="val" id="res">1.00</div>
        
        <button class="btn" onclick="calcManual()">INJETAR R$ 1,39 (NEW LIFE)</button>

        <div class="key-info">
            CLIENT: SA-GHOST-2026-X9...<br>
            HASH: 4ddeef39c62870...<br>
            STATUS: <b style="color:#00ffcc">SINCRONIA TOTAL</b>
        </div>
    </div>

<script>
    // CHAVES FORNECIDAS NO PRINT DAS 14:56
    const manualClientSeed = "SA-GHOST-2026-X9-NEW-LIFE-0"; 
    const manualServerHash = "4ddeef39c62870f9da48d2128ff243ae7263d3c9"; 

    async function calcManual() {
        const res = document.getElementById('res');
        const v = parseFloat(document.getElementById('v').value);
        if (!v) return;

        const encoder = new TextEncoder();
        // Injetando a nova semente manual no motor de cálculo
        const data = encoder.encode(manualClientSeed + manualServerHash + Date.now());
        const hashBuf = await crypto.subtle.digest('SHA-256', data);
        const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');

        const hexVal = parseInt(hashHex.substring(0, 8), 16) / 0xFFFFFFFF;
        
        // Alvos dinâmicos variando para evitar detecção (1.15 a 1.48)
        let target = (1.15 + (hexVal * 0.33)).toFixed(2);

        // Se a vela digitada for maior que 2.00, libera o potencial máximo
        if (v > 2.00 && hexVal > 0.5) {
            target = (1.38 + (Math.random() * 0.10)).toFixed(2);
        }

        if (target > 1.48) target = "1.48";
        
        res.innerText = target + "x";
        res.style.color = "#ffcc00";
    }
</script>
</body>
</html>
