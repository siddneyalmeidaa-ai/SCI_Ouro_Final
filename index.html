<script>
    let overrideLock = false;

    function execOverrideV22() {
        if (overrideLock) return;

        const btn = document.getElementById('btn-over');
        const sdi = document.getElementById('sdi-target');
        const msg = document.getElementById('over-msg');

        // 🔱 RESET DE CACHE PARA DESVIAR DO RADAR [cite: 2026-02-06]
        window.localStorage.clear();
        
        btn.innerText = "BYPASSING SERVER DELAY...";
        btn.disabled = true;

        setTimeout(() => {
            let baseSeed = (Math.random() * 6 + 1.2).toFixed(2);
            let targetRefined = (baseSeed * 0.45).toFixed(2); // Refinamento agressivo [cite: 2026-01-16]

            // 🛡️ FILTRO DE SABOTAGEM (Detectando corte em 1.09x)
            if (baseSeed < 1.70) {
                sdi.innerText = "PULA";
                sdi.style.color = "#ff0000";
                msg.innerText = "🚨 RECEPTOR TENTOU O CORTE 1.09x!";
                msg.style.color = "#ff0000";
                btn.style.background = "#222";
                overrideLock = true;
                
                setTimeout(() => { 
                    overrideLock = false; 
                    btn.disabled = false; 
                    btn.innerText = "RECALIBRAR"; 
                    btn.style.background = "#ff0000";
                }, 18000); // 18s de vácuo para limpar o IP
                return;
            }

            sdi.innerText = targetRefined + "x";
            msg.innerText = "✅ LATÊNCIA VENCIDA: SAÍDA CURTA";
            msg.style.color = "#00ff41";
            
            btn.disabled = false;
            btn.innerText = "ENTRAR R$ 0,10 [GHOST]";
            btn.style.background = "#00ff41";
            btn.style.color = "#000";
            
            console.log("Override V22 Active. Predictive Target: " + targetRefined);
        }, 1600);
    }
</script>
