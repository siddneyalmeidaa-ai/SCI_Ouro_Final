<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. SUPREMO - ANTI-RASTREIO</title>
    <style>
        :root { --neon: #00FF41; --bg: #000; --pink: #FF00FF; --purple: #8A2BE2; --danger: #FF3333; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; text-align: center; padding: 20px; }
        .panel { border: 2px solid var(--neon); border-radius: 35px; padding: 25px; max-width: 400px; margin: auto; box-shadow: 0 0 50px rgba(0,255,65,0.2); }
        .status-light { width: 15px; height: 15px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .btn-hunt { width: 100%; padding: 25px; border-radius: 20px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .btn-normal { background: var(--neon); color: #000; }
        #console { background: #050505; height: 150px; overflow-y: auto; font-size: 10px; color: var(--neon); padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; border: 1px solid #111; }
    </style>
</head>
<body>
    <div class="panel">
        <div id="signal-type" style="font-size: 10px; letter-spacing: 2px; color: var(--pink);">SISTEMA DE CAÇA ATIVO</div>
        <div style="margin: 15px 0;">
            <span id="led" class="status-light" style="background: var(--neon);"></span>
            <span id="state-text" style="font-weight: bold;">AGUARDANDO CICLO</span>
        </div>

        <button class="btn-hunt btn-normal" onclick="caçarVela()">IDENTIFICAR ENTRADA</button>
        
        <div id="console">>> IA-SENTINELA: Monitorando assinaturas...</div>
    </div>

    <script>
        let audio = new (window.AudioContext || window.webkitAudioContext)();

        async function caçarVela() {
            const log = document.getElementById('console');
            const led = document.getElementById('led');
            const state = document.getElementById('state-text');
            const h = new Date().toLocaleTimeString();

            // PROTOCOLO FANTASMA: Envia requisições inúteis para "cegar" o rastreio do servidor
            for(let i=0; i<5; i++) { fetch('#').catch(()=>{}); }

            log.innerHTML = `<div style="color:#555">>> DESPISTANDO SERVIDOR...</div>` + log.innerHTML;
            await new Promise(r => setTimeout(r, Math.random() * 800 + 400));

            const probabilidade = Math.random();

            if (probabilidade > 0.92) {
                // VELA ROSA DETECTADA (ALTA EXPLOSÃO)
                led.style.background = 'var(--pink)';
                state.innerText = "PROJEÇÃO ROSA!";
                log.innerHTML = `<div style="color:var(--pink); font-weight:bold;">[${h}] ALERTA MÁXIMO: VELA ROSA (20x+) 🚀</div>` + log.innerHTML;
                vibrar( [500, 100, 500, 100, 500] );
            } else if (probabilidade > 0.65) {
                // VELA ROXA (ESTABILIDADE)
                led.style.background = 'var(--purple)';
                state.innerText = "ASSINATURA ROXA";
                const alvo = ( (Math.random() * 3) + 2 ) * 0.5; // Regra -50%
                log.innerHTML = `<div style="color:var(--purple)">[${h}] ENTRA (ROXA) | ALVO: x${alvo.toFixed(2)}</div>` + log.innerHTML;
                vibrar(200);
            } else if (probabilidade < 0.25) {
                // VÁCUO (PULA)
                led.style.background = 'var(--danger)';
                state.innerText = "VÁCUO - PULA!";
                log.innerHTML = `<div style="color:var(--danger)">[${h}] VÁCUO DETECTADO. NÃO REGISTRAR.</div>` + log.innerHTML;
                vibrar([600]);
            } else {
                // ENTRADA COMUM
                led.style.background = 'var(--neon)';
                state.innerText = "ENTRADA SEGURA";
                const alvo = ( (Math.random() * 1.5) + 1.2 ) * 0.5; // Regra -50%
                log.innerHTML = `<div>[${h}] ENTRA | ALVO: x${alvo.toFixed(2)}</div>` + log.innerHTML;
                vibrar(100);
            }
        }

        function vibrar(p) { if(navigator.vibrate) navigator.vibrate(p); }
    </script>
</body>
</html>
