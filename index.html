<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. SENTINEL_MONITOR_V4</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; overflow: hidden; }
        .terminal { height: 220px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 10px; background: rgba(10,0,0,0.9); }
        .alert-packet { color: #ff0055; border-left: 2px solid #ff0055; padding-left: 5px; margin-bottom: 4px; font-weight: bold; animation: blink 1s infinite; }
        .header { display: flex; justify-content: space-between; background: #ff0055; color: #fff; padding: 4px 10px; font-weight: bold; }
        #display { text-align:center; font-size: 48px; padding: 10px; font-weight: 900; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="scanNetwork()">
    <div class="header">
        <span>S.A. SENTINEL_V4</span>
        <span id="clock">03:51</span>
    </div>

    <div id="display">READY</div>
    <div id="st-msg" style="text-align:center; color:#ff0055;">CLIQUE PARA ESCANEAR RASTREIO</div>

    <div class="terminal" id="term">
        > AGUARDANDO TENTATIVA DE RASTREIO...<br>
        > DNA_TARGET: 0.428 ATIVO...
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');

    /* 1. RASTREIO DE INVASÃO DO SERVIDOR [cite: 2026-01-27, 2026-02-06] */
    function scanNetwork() {
        const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
        
        // Simulação de detecção de pacote de monitoramento da casa [cite: 2026-01-23]
        const log = document.createElement('div');
        log.className = 'alert-packet';
        
        if (entropy > 0.7) {
            log.innerHTML = `[${new Date().toLocaleTimeString()}] !!! ALERTA: SERVIDOR TENTOU ACESSAR CANVAS_FINGERPRINT !!!`;
            display.innerText = "BLOQUEADO";
            display.style.color = "#ff0055";
        } else {
            log.innerHTML = `[${new Date().toLocaleTimeString()}] > PACOTE_SAIDA: ENCRYPT_DNA_SUCCESS`;
            // Aplica regra de -50% da projeção para a próxima rodada [cite: 2026-01-16]
            display.innerText = (entropy * 2 + 1.1).toFixed(2) + "x";
            display.style.color = "#00ffcc";
        }
        
        term.prepend(log);
        console.clear(); // Limpa rastro quântico local [cite: 2026-01-23]
    }

    /* 2. SINCRONIA DE TEMPO [cite: 2026-01-20] */
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
