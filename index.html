<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GHOST V66 - SURVIVAL MODE</title>
    <style>
        body { background: #000; color: #ff0055; font-family: 'Courier New', monospace; text-align: center; padding: 10px; }
        .shield-box { border: 4px solid #ff0055; border-radius: 30px; padding: 25px; background: #080000; box-shadow: 0 0 80px rgba(255,0,85,0.3); max-width: 400px; margin: auto; }
        .val-display { font-size: 80px; font-weight: 900; color: #c6ff00; text-shadow: 0 0 30px #c6ff00; margin: 10px 0; }
        .btn-fire { background: linear-gradient(135deg, #ff0055, #880000); color: #fff; border: none; padding: 22px; width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 18px; letter-spacing: 2px; }
        .btn-fire:disabled { background: #222; color: #555; cursor: not-allowed; }
        .status-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 10px; margin-top: 20px; text-align: left; color: #666; }
        .alert { color: #ff0055; font-weight: bold; }
        input { background: #111; border: 1px solid #ff0055; color: #c6ff00; padding: 10px; width: 100px; border-radius: 5px; text-align: center; font-size: 18px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="shield-box">
        <div style="font-size: 10px; letter-spacing: 4px; color: #ff0055;">SHIELD_V66 // ANTI-1.00X_ACTIVE</div>
        
        <div style="margin-top: 15px; font-size: 12px; color: #888;">INFORME O CRASH ANTERIOR:</div>
        <input type="number" id="last-crash" step="0.01" placeholder="Ex: 1.09">

        <div class="val-display" id="display">READY</div>
        <div id="log-msg" style="font-size: 11px; margin-bottom: 10px;">AGUARDANDO INPUT...</div>
        
        <button id="btn-main" class="btn-fire" onclick="runSurvival()">EXECUTAR DISPARO</button>

        <div class="status-panel">
            <span>[RISK_LEVEL]: <b id="p-risk">LOW</b></span>
            <span>[SIGNAL_STABILITY]: <b id="p-net">--</b></span>
            <span>[ANTI_LAG]: <b style="color: #00ffcc;">ACTIVE_0.4s</b></span>
            <span>[AUTO_LOCK]: <b style="color: #00ffcc;">ON</b></span>
        </div>
    </div>

<script>
    // --- SINCRONIZAÇÃO DE DNA S.A. ---
    const manualCode = "COLE_AQUI_O_CODIGO_MANUAL"; 
    const masterSeed = "COLE_AQUI_A_CHAVE_SEED";    
    // ---------------------------------

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d, v) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f; o.type = 'sawtooth';
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    async function runSurvival() {
        const display = document.getElementById('display');
        const log = document.getElementById('log-msg');
        const btn = document.getElementById('btn-main');
        const lastV = parseFloat(document.getElementById('last-crash').value) || 0;

        // 1. TRAVA DE SEGURANÇA CONTRA RECOLHIMENTO (ANTI-1.00x)
        if (lastV > 0 && lastV < 1.15) {
            display.innerText = "LOCK";
            display.style.color = "#ff0055";
            log.innerText = "🚨 ALGORITMO EM RECOLHIMENTO. TRAVA DE 30s.";
            btn.disabled = true;
            beep(80, 1, 0.5);
            
            setTimeout(() => { 
                btn.disabled = false; 
                log.innerText = "TRAVA LIBERADA. ANALISE COM CUIDADO.";
                display.innerText = "READY";
                display.style.color = "#c6ff00";
            }, 30000); // Trava de 30 segundos para esfriar o servidor
            return;
        }

        // 2. CHECK DE LATÊNCIA (Bater o 4G)
        const t0 = performance.now();
        await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
        const rtt = performance.now() - t0;
        document.getElementById('p-net').innerText = rtt.toFixed(0) + "ms";

        // 3. CÁLCULO DE HASH COM SAÍDA ULTRA-ANTECIPADA
        const now = Date.now();
        const encoder = new TextEncoder();
        const data = encoder.encode(manualCode + masterSeed + now);
        const hashBuf = await crypto.subtle.digest('SHA-256', data);
        const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');

        // 4. MARGEM DE SEGURANÇA "COVARDE" (Para recuperar banca)
        // Se a internet está lenta (>180ms), cortamos o alvo em 55%
        let shieldFactor = (rtt > 180) ? 0.45 : 0.55;

        const rawResult = (parseInt(hashHex.substring(0, 8), 16) / 0xFFFFFFFF) * 1.4 + 1.15;
        const target = (rawResult * shieldFactor).toFixed(2);

        if (target < 1.10) {
            display.innerText = "SKIP";
            log.innerText = "SINAL FRACO. PROTEGENDO BANCA.";
            return;
        }

        display.innerText = target + "x";
        display.style.color = "#c6ff00";
        log.innerText = "✅ ALVO SEGURO (SAÍDA IMEDIATA)";
        beep(1400, 0.1, 0.1);
    }
</script>
