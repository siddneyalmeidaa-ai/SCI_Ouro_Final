<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V253_BUTTON</title>
    <style>
        :root { --c1: #00ffcc; --c2: #9d00ff; --d: #ff0055; --w: #ffd700; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: #fff; height: 100vh; }
        .mimic-h { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; box-sizing: border-box; z-index: 100; backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; }
        .v-out { font-size: 48px; font-weight: 900; color: var(--c1); letter-spacing: -2px; }
        
        /* BOTÃO CENTRAL GIGANTE */
        #btn_trigger { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 120px; background: #111; border: 2px solid #333; color: #fff; font-size: 20px; font-weight: 900; text-transform: uppercase; border-radius: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; z-index: 50; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #btn_trigger:active { background: #222; transform: translate(-50%, -50%) scale(0.95); border-color: var(--c1); }
        #btn_trigger span { animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .hint-text { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 8px; color: #444; }
    </style>
</head>
<body>

<div class="mimic-h">
    <div id="m_box">
        <div id="v_display">V253_READY</div>
        <div id="s_status" style="font-size: 7px; color: var(--w); text-transform: uppercase;">S5_NEURAL: AGUARDANDO_COMANDO</div>
    </div>
</div>

<button id="btn_trigger" onclick="igniteNeuralGhost()">
    <span>PROJETAR PRÓXIMA</span>
</button>

<div class="hint-text">GATILHO MANUAL ATIVO PARA EVITAR TRAVAMENTO DE ABA</div>

<script>
    const MEM_KEY = "_ga_u_metrics_v2";
    let isAnalyzing = false;
    let globalData = JSON.parse(localStorage.getItem(MEM_KEY)) || { rounds: 0, wins: 0 };

    const getS5Entropy = () => {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
    };

    function igniteNeuralGhost() {
        if(isAnalyzing) return;
        isAnalyzing = true;

        const d = document.getElementById('v_display');
        const s = document.getElementById('s_status');
        const b = document.getElementById('btn_trigger');
        
        d.innerText = "---"; d.style.color = "#222";
        s.innerText = "S5: ANALISANDO PADRÕES...";
        b.style.borderColor = "var(--c1)";
        b.querySelector('span').innerText = "ANALISANDO...";

        // Delay de análise simulada
        setTimeout(() => {
            const seed = getS5Entropy();
            
            // PERDA TÁTICA [cite: 2026-01-23]
            if (globalData.wins >= 8 && getS5Entropy() < 0.35) {
                d.innerText = "ENTRA"; d.style.color = "#ffa500"; 
                s.innerText = "⚠️ PERDA TÁTICA: MÍNIMA (0.10)";
                globalData.wins = 0;
            } else if (seed > 0.94) {
                d.innerText = (getS5Entropy() * 5 + 10.1).toFixed(2) + "x";
                d.style.color = "var(--c2)"; s.innerText = "ATHENA: VELA_ROSA";
                globalData.wins++;
            } else if (seed < 0.28) {
                d.innerText = "PULA"; d.style.color = "var(--d)";
                s.innerText = "NYX: RODADA_RISCO";
            } else {
                const targets = [1.35, 1.48, 2.10, 1.34];
                const g = targets[Math.floor(getS5Entropy() * 4)];
                d.innerText = (g + (getS5Entropy() * 0.05)).toFixed(2) + "x";
                d.style.color = g > 2 ? "var(--c2)" : "var(--c1)";
                s.innerText = "GHOST: ANALISADO";
                globalData.wins++;
            }

            globalData.rounds++;
            localStorage.setItem(MEM_KEY, JSON.stringify(globalData));
            
            b.querySelector('span').innerText = "PROJETAR PRÓXIMA";
            b.style.borderColor = "#333";
            isAnalyzing = false;
            
            // Tremor orgânico de scroll
            window.scrollBy(0, (getS5Entropy() * 4) - 2);
        }, (getS5Entropy() * 1200) + 1000);
    }
</script>
</body>
</html>
