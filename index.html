<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GHOST V65 - SNIPER STEALTH</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding: 10px; }
        .sniper-box { border: 4px solid #c6ff00; border-radius: 30px; padding: 25px; background: #050505; box-shadow: 0 0 80px rgba(198,255,0,0.2); max-width: 400px; margin: auto; }
        .val-display { font-size: 85px; font-weight: 900; color: #c6ff00; text-shadow: 0 0 40px #c6ff00; margin: 10px 0; }
        .btn-fire { background: linear-gradient(135deg, #c6ff00, #00ffcc); color: #000; border: none; padding: 25px; width: 100%; border-radius: 15px; font-weight: 900; cursor: pointer; font-size: 22px; letter-spacing: 3px; }
        .status-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 10px; margin-top: 20px; text-align: left; color: #555; }
        .green { color: #c6ff00; }
        #log-msg { font-size: 11px; color: #ff0055; margin-top: 15px; height: 18px; font-weight: bold; }
        input { background: #111; border: 1px solid #333; color: #00ffcc; padding: 8px; width: 80px; border-radius: 5px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sniper-box">
        <div style="font-size: 10px; letter-spacing: 5px; color: #c6ff00;">SNIPER_V65 // EARLY_OUT_SYSTEM</div>
        
        <div style="margin-top: 15px; font-size: 11px; color: #888;">ÚLTIMA VELA DO JOGO:</div>
        <input type="number" id="input-vela" step="0.01" placeholder="Ex: 1.10">

        <div class="val-display" id="display">READY</div>
        <div id="log-msg">SISTEMA ARARMADO</div>
        
        <button class="btn-fire" onclick="runSniper()">DISPARAR SNIPER</button>

        <div class="status-panel">
            <span>[NET_LATENCY]: <b id="p-lat">--</b></span>
            <span>[EARLY_EXIT]: <b class="green">0.2s_ACTIVE</b></span>
            <span>[DNA_SYNC]: <b class="green">LOCKED</b></span>
            <span>[OFFSET]: <b id="p-off">-45%</b></span>
        </div>
    </div>

<script>
    // --- SINCRONIZAÇÃO DE DNA S.A. ---
    const manualCode = "COLE_AQUI_O_CODIGO_MANUAL"; 
    const masterSeed = "COLE_AQUI_A_CHAVE_SEED";    
    // ---------------------------------

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d, v) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f; o.type = 'square';
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    async function runSniper() {
        const display = document.getElementById('display');
        const log = document.getElementById('log-msg');
        const lastV = parseFloat(document.getElementById('input-vela').value) || 0;

        // 1. AUDITORIA DE LATÊNCIA ( Shannon Check )
        const t0 = performance.now();
        await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
        const rtt = performance.now() - t0;
        document.getElementById('p-lat').innerText = rtt.toFixed(0) + "ms";

        // 2. FILTRO DE VÁCUO (Prevenção de 1.10x)
        if (lastV > 0 && lastV < 1.18) {
            display.innerText = "WAIT";
            display.style.color = "#ff0055";
            log.innerText = "> ⚠️ RECOLHIMENTO EM CURSO. AGUARDE.";
            beep(150, 0.5, 0.3);
            return;
        }

        // 3. CÁLCULO DE HASH ( DNA Simons + S.A. Seed )
        const now = Date.now();
        const encoder = new TextEncoder();
        const data = encoder.encode(manualCode + masterSeed + now);
        const hashBuf = await crypto.subtle.digest('SHA-256', data);
        const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');

        // 4. ESTRATÉGIA DE SAÍDA ANTECIPADA (Early-Out)
        // Reduzimos o alvo drasticamente para garantir o saque antes do lag do 4G
        let safetyBuffer = (rtt > 150) ? 0.55 : 0.65; 
        document.getElementById('p-off').innerText = "-" + (100 - (safetyBuffer * 100)) + "%";

        const rawResult = (parseInt(hashHex.substring(0, 8), 16) / 0xFFFFFFFF) * 1.5 + 1.25;
        const target = (rawResult * safetyBuffer).toFixed(2);

        if (target < 1.12) {
            display.innerText = "SKIP";
            log.innerText = "> VELA MUITO BAIXA PARA RISCO";
            return;
        }

        display.innerText = target + "x";
        display.style.color = "#c6ff00";
        log.innerText = "> ✅ ALVO CALCULADO COM SAÍDA ANTECIPADA";
        beep(1200, 0.1, 0.1);
    }
</script>
