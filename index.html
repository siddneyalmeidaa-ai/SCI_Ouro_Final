<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V102_ALVO_X</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        
        /* VISOR DE ALVO X - PRIORITÁRIO */
        #visor-alvo { 
            margin: 20px 0; 
            padding: 25px; 
            background: rgba(0, 68, 255, 0.1); 
            border: 2px solid #0044ff; 
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 68, 255, 0.3);
        }
        .label { font-size: 14px; color: #0044ff; font-weight: bold; text-transform: uppercase; }
        #valor-x { font-size: 55px; font-weight: 900; color: #fff; margin: 10px 0; }

        #comando { font-size: 45px; font-weight: 900; margin-bottom: 25px; }
        
        .btn-sync { 
            background: #ffffff !important; 
            color: #000 !important; 
            border: none; 
            padding: 30px; 
            width: 100%; 
            font-size: 20px; 
            font-weight: 900; 
            border-radius: 12px;
            box-shadow: 0 6px 0 #999;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-sync:active { transform: translateY(4px); box-shadow: 0 2px 0 #666; background: #00ff41 !important; }
    </style>
</head>
<body>

<div id="terminal">
    <div id="visor-alvo">
        <span class="label">Alvo de Saída (Seguro -50%)</span>
        <div id="valor-x">0.00x</div>
    </div>

    <div id="comando">AGUARDE</div>

    <button class="btn-sync" id="btn" ontouchstart="sincronizarX()">
        SINCRONIZAR_SEMENTE
    </button>
</div>

<script>
    const btn = document.getElementById('btn');
    const cmd = document.getElementById('comando');
    const displayX = document.getElementById('valor-x');

    function sincronizarX() {
        if(btn.disabled) return;
        btn.disabled = true;
        btn.innerText = "CALCULANDO X...";
        
        // Reset imediato
        displayX.innerText = "0.00x";
        displayX.style.color = "#fff";

        setTimeout(() => {
            const semente = Math.random();
            
            // Lógica Aurora: Pega um X possível e corta pela metade
            let xBruto = (Math.random() * 2.2 + 1.2); 
            let xProjetado = (xBruto * 0.50).toFixed(2);

            if (semente > 0.54) {
                cmd.innerText = "ENTRA";
                cmd.style.color = "#00ff41";
                // Exibe o X calculado com destaque
                displayX.innerText = (xProjetado > 1.05 ? xProjetado : 1.05) + "x";
                displayX.style.color = "#00ff41";
            } else {
                cmd.innerText = "PULA";
                cmd.style.color = "#ff4141";
                displayX.innerText = "0.00x";
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SINCRONIZAR_SEMENTE";
                cmd.innerText = "AGUARDE";
                cmd.style.color = "#fff";
            }, 3500);
        }, 800);
    }
</script>
</body>
</html>
