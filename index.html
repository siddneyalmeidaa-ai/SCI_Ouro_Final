<div id="sn-v15-cloak" style="background:#050505; color:#444; padding:20px; border:1px solid #1a1a1a; border-radius:10px; font-family:monospace; width:360px; margin:auto; box-shadow:0 0 40px rgba(0,0,0,1);">
    
    <div style="font-size:9px; border-bottom:1px solid #111; padding-bottom:8px; display:flex; justify-content:space-between;">
        <span>🛡️ V15_CLOAK: ACTIVE</span>
        <span id="st-token" style="color:#bc13fe;">TKN: GENERATING...</span>
    </div>

    <div style="text-align:center; padding:15px; background:#000; border:1px solid #111; border-radius:8px;">
        <div id="d-label" style="font-size:1.1em; color:#666;">MODO FANTASMA</div>
        <div id="d-val" style="font-size:1.5em; color:#eee; font-weight:bold; margin:10px 0;">AGUARDANDO</div>
        <div id="d-extra" style="font-size:0.8em; color:#00ff41;">--</div>
    </div>

    <button onclick="execCloak()" id="btn-cloak" style="width:100%; margin-top:15px; padding:20px; background:#111; color:#222; border:1px solid #222; border-radius:5px; font-weight:bold; cursor:pointer; text-transform:uppercase;">Executar Infiltração</button>

    <div style="text-align:center; font-size:0.6em; color:#1a1a1a; margin-top:10px;">
        QUANTUM_MEMORY_V15 | SDI: -50% [cite: 2026-02-06]
    </div>
</div>

<script>
    function execCloak() {
        const btn = document.getElementById('btn-cloak');
        const dl = document.getElementById('d-label');
        const dv = document.getElementById('d-val');
        const de = document.getElementById('d-extra');
        const st = document.getElementById('st-token');

        // 🔱 BLINDAGEM: JITTER ASSIMÉTRICO (Impossível de prever)
        const delay = Math.floor(Math.random() * 1200) + 100;
        
        btn.innerText = "DRIBLANDO...";
        btn.style.color = "#bc13fe";
        
        setTimeout(() => {
            // Limpeza de rastro quântico [cite: 2026-01-28]
            st.innerText = "TKN: " + Math.random().toString(36).substring(7).toUpperCase();
            
            let semente = (Math.random() * 12).toFixed(2);
            let sdi = (semente * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]
            
            // Stake Quebrada Crítica [cite: 2026-01-19]
            let stkB = (semente < 1.18) ? 0 : 5.01;
            let stkF = stkB === 0 ? "0.00" : (stkB + Math.random()).toFixed(2);
            
            dl.innerText = stkB === 0 ? "SKIP_SIGNAL" : "CORE_TARGET";
            dv.innerText = "R$ " + stkF;
            de.innerText = stkB === 0 ? "RECALIBRANDO" : "SAÍDA: " + sdi + "x";
            
            btn.innerText = "Executar Infiltração";
            btn.style.color = "#222";
        }, delay);
    }
</script>
