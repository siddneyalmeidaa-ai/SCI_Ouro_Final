<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._BRAVA_GHOST</title>
    <style>
        :root { --neon: #00ffcc; --bg: #000; }
        body { margin: 0; background: #000; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; height: 100vh; }
        
        .container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            padding: 20px; box-sizing: border-box; display: flex; flex-direction: column;
            background: #000; z-index: 10;
        }

        #v_out { font-size: 72px; font-weight: 900; color: var(--neon); text-shadow: 0 0 20px var(--neon); margin-top: 20px; }
        
        .panel { 
            margin: 20px 0; padding: 15px; text-align: center; font-weight: bold;
            border: 2px solid var(--neon); border-radius: 10px; background: rgba(0, 255, 204, 0.05);
        }

        #dna_bar { height: 6px; width: 0%; background: var(--neon); box-shadow: 0 0 15px var(--neon); margin: 15px 0; transition: 1s; }
        
        .info { font-size: 11px; color: #444; display: flex; justify-content: space-between; text-transform: uppercase; font-weight: bold; }
        .val { color: #eee; }

        #drop_zone {
            margin-top: auto; margin-bottom: 50px; padding: 30px;
            border: 2px dashed #333; border-radius: 15px; text-align: center;
            background: rgba(255,255,255,0.02); cursor: pointer;
        }

        /* Camada Anti-Print (Invisibilidade) */
        #ghost_layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.01); backdrop-filter: blur(0px);
            z-index: 9999; pointer-events: none;
        }
        .active_ghost { backdrop-filter: blur(4px) !important; background: rgba(0,0,0,0.6) !important; }
    </style>
</head>
<body>

<div id="ghost_layer"></div>

<div class="container">
    <div id="v_out">2.69x</div>
    
    <div class="panel">
        STATUS: ENTRA LIBERADO
    </div>

    <div id="dna_bar" style="width: 100%;"></div>
    
    <div class="info">
        <span>MONITOR: <span class="val">SECURE</span></span>
        <span>DNA: <span class="val">0.428</span></span>
    </div>

    <div id="drop_zone" onclick="document.getElementById('file_in').click()">
        <span style="color:var(--neon); font-size:12px; font-weight:bold;">INGESTÃO GHOST ATIVA</span>
        <input type="file" id="file_in" accept="image/*" style="display:none" onchange="process_ghost()">
    </div>
</div>

<script>
    function process_ghost() {
        const ghost = document.getElementById('ghost_layer');
        ghost.className = 'active_ghost';
        alert("S.A., Print detectado. A camada de invisibilidade foi acionada para proteger a captura.");
        setTimeout(() => { ghost.className = ''; }, 2000);
    }
</script>
</body>
</html>
