<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V240_ECOLOGY</title>
    <style>
        :root { --c1: #00ffcc; --c2: #9d00ff; --d: #ff0055; --w: #ffd700; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: #fff; }
        .mimic-h { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(25px); border-bottom: 1px solid #1a1a1a; transition: all 0.5s; }
        .v-out { font-size: 42px; font-weight: 900; color: var(--c1); letter-spacing: -2px; }
        .btn-ui { background: #fff; color: #000; border: none; padding: 12px 22px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        #s_msg { font-size: 8px; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

<div id="m_root" class="mimic-h">
    <div id="m_box">
        <div id="v_display">GHOST_ECO_READY</div>
        <div id="s_status" style="color: var(--w); text-transform: uppercase;">MODO: ECOLOGIA_ATIVA</div>
    </div>
    <button class="btn-ui" onclick="toggleMimic()">START_V240</button>
</div>

<script>
    const MEM_KEY = "_ga_u_metrics_v2";
    let isAutoRunning = false;
    let globalData = JSON.parse(localStorage.getItem(MEM_KEY)) || { rounds: 0, wins: 0 };

    const getS5Entropy = () => {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
    };

    /* 1. MÓDULO DE RUÍDO DE TRÁFEGO (MULTITASK SIMULATOR) [cite: 2026-02-13] */
    function injectTrafficNoise() {
        const domains = ['https://www.google.com/favicon.ico', 'https://www.facebook.com/favicon.ico'];
        const img = new Image();
        img.src = domains[Math.floor(getS5Entropy() * domains.length)] + '?v=' + getS5Entropy();
    }

    /* 2. MOTOR DE INTERFACE MUTANTE [cite: 2026-02-03] */
    function mutateUI() {
        const header = document.querySelector('.mimic-h');
        header.style.paddingTop = (Math.floor(getS5Entropy() * 12) + 8) + 'px';
        header.style.paddingBottom = (Math.floor(getS5Entropy() * 12) + 8) + 'px';
    }

    function toggleMimic() {
        isAutoRunning = !isAutoRunning;
        const btn = document.querySelector('.btn-ui');
        btn.innerText = isAutoRunning ? "STOP_ECO" : "START_ECO";
        btn.style.background = isAutoRunning ? "var(--d)" : "#fff";
        if(isAutoRunning) runAutoCycle();
    }

    function runAutoCycle() {
        if(!isAutoRunning) return;
        igniteNeuralGhost();
        const nextTick = (getS5Entropy() * 25000) + 20000;
        setTimeout(runAutoCycle, nextTick);
    }

    /* 3. LÓGICA DE PERDA TÁTICA E NEURAL [cite: 2026-01-23, 2026-01-19] */
    function igniteNeuralGhost() {
        const d = document.getElementById('v_display');
        const s = document.getElementById('s_status');
        
        d.innerText = "---"; d.style.color = "#111";
        s.innerText = "SELENE: ANALISANDO...";

        injectTrafficNoise(); // Simula multitarefa durante a análise

        const fatigue = Math.min(globalData.rounds * 105, 3500);
        const delay = (getS5Entropy() * 2500) + 1500 + fatigue;

        setTimeout(() => {
            const seed = getS5Entropy();
            const lossTacticalSeed = getS5Entropy();

            // MÓDULO DE PERDA TÁTICA: Força uma entrada de erro a cada 6-8 vitórias
            if (globalData.wins >= 7 && lossTacticalSeed < 0.4) {
                d.innerText = "ENTRA"; d.style.color = "#ffa500"; 
                s.innerText = "⚠️ PERDA TÁTICA: USE 0.10c";
                globalData.wins = 0; // Reseta o contador de vitórias
                return;
            }

            if (seed > 0.94) {
                d.innerText = (getS5Entropy() * 8 + 8).toFixed(2) + "x";
                d.style.color = "var(--c2)"; s.innerText = "ATHENA: VELA_ROSA";
                globalData.wins++;
            } else if (seed < 0.28) {
                d.innerText = "PULA"; d.style.color = "var(--d)";
                s.innerText = "NYX: VÁCUO_DETECTADO";
            } else {
                const target = [1.35, 1.48, 2.15, 1.40][Math.floor(getS5Entropy() * 4)];
                d.innerText = target.toFixed(2) + "x";
                d.style.color = target > 2 ? "var(--c2)" : "var(--c1)";
                s.innerText = "GHOST: ENTRADA_LIMPA";
                globalData.wins++;
            }

            globalData.rounds++;
            localStorage.setItem(MEM_KEY, JSON.stringify(globalData));
            mutateUI();
        }, delay);
    }
</script>
</body>
</html>
