<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GHOST V64 - ULTRA-REINFORCED</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding: 15px; }
        .master-shield { border: 4px solid #ff0055; border-radius: 25px; padding: 25px; background: #050505; box-shadow: 0 0 60px rgba(255,0,85,0.2); max-width: 420px; margin: auto; }
        .val-display { font-size: 80px; font-weight: 900; color: #c6ff00; text-shadow: 0 0 30px #c6ff00; margin: 10px 0; }
        .btn-op { background: linear-gradient(90deg, #ff0055, #c6ff00); color: #000; border: none; padding: 22px; width: 100%; border-radius: 12px; font-weight: 900; cursor: pointer; font-size: 20px; text-transform: uppercase; }
        .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 9px; margin-top: 20px; text-align: left; color: #444; }
        .active { color: #00ffcc; font-weight: bold; }
        #log-shield { font-size: 11px; color: #ff0055; margin-top: 15px; height: 18px; font-weight: bold; }
        input { background: #111; border: 1px solid #333; color: #00ffcc; padding: 5px; width: 60px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="master-shield">
        <div style="font-size: 10px; letter-spacing: 2px; color: #ff0055;">SHIELD_V64 // ANTI-VACUUM_SYSTEM</div>
        
        <div style="margin: 15px 0; font-size: 12px;">
            ÚLTIMA VELA: <input type="number" id="last-vela" step="0.01" placeholder="1.10">
        </div>

        <div class="val-display" id="display">READY</div>
        <div id="log-shield">AGUARDANDO AUDITORIA...</div>
        
        <button class="btn-op" onclick="executeUltraShield()">EXECUTAR BLINDAGEM</button>

        <div class="sensor-grid">
            <span>[ANTI_VACUUM]: <b id="s-vac" class="active">MONITORING</b></span>
            <span>[ANTI_PREDATOR]: <b id="s-pre" class="active">STREAK_0</b></span>
            <span>[SIGNAL_SHANNON]: <b id="s-sha" class="active">CLEAN</b></span>
            <span>[HFT_OFFSET]: <b id="s-off" class="active">-35%</b></span>
        </div>
    </div>

<script>
    // --- INJEÇÃO DE DNA DO PRINT (S.A.) ---
    const manualCode = "COLE_AQUI_O_CODIGO_MANUAL"; 
    const masterSeed = "COLE_AQUI_A_CHAVE_SEED";    
    // --------------------------------------

    let greenStreak = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function beep(f, d, v) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = f; o.type = 'sine';
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    }

    async function executeUltraShield() {
        const display = document.getElementById('display');
        const log = document.getElementById('log-shield');
        const lastVela = parseFloat(document.getElementById('last-vela').value) || 0;

        // 1. FILTRO ANTI-VÁCUO (Prevenção do erro de 1.10x)
        if (lastVela > 0 && lastVela < 1.15) {
            display.innerText = "WAIT";
            display.style.color = "#ff0055";
            log.innerText = "> 🚨 RISCO DE RECOLHIMENTO (VÁCUO DETECTADO)";
            beep(100, 0.8, 0.4);
            greenStreak = 0; // Reseta a sequência por segurança
            return;
        }

        // 2. AJUSTE DE MARGEM DINÂMICA (Anti-Predador)
        let offset = 0.65; // Desconto de 35% (Padrão)
        if (greenStreak >= 3) {
            offset = 0.50; // Desconto de 50% (Modo Ultra-Safe)
            document.getElementById('s-off').innerText = "-50%";
            log.innerText = "> ⚠️ MODO ANTI-PREDADOR ATIVO";
        }

        // 3. CÁLCULO DE HASH SINCRONIZADO
        const t0 = performance.now();
        await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
        const latency = performance.now() - t0;
        document.getElementById('s-sha').innerText = latency.toFixed(0) + "ms";

        const now = Date.now();
        const encoder = new TextEncoder();
        const data = encoder.encode(manualCode + masterSeed + now);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

        // 4. RESULTADO FINAL COM BLINDAGEM
        const raw = (parseInt(hashHex.substring(0, 8), 16) / 0xFFFFFFFF) * 1.5 + 1.22;
        const target = (raw * offset).toFixed(2);

        if (target < 1.15) {
            display.innerText = "SKIP";
            log.innerText = "> EVITANDO VELA DE BAIXA INTENSIDADE";
            return;
        }

        display.innerText = target + "x";
        display.style.color = "#c6ff00";
        log.innerText = "> ✅ CANAL SEGURO IDENTIFICADO";
        beep(1100, 0.1, 0.1);
        
        // Simulação de acerto para controle de streak
        greenStreak++;
        document.getElementById('s-pre').innerText = "STREAK_" + greenStreak;
    }

    Object.defineProperty(document, 'visibilityState', {value: 'visible', writable: false});
</script>
</
    body>
</html>
