<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A._NETWORK_SNIFFER_V1</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 20px; font-size: 10px; }
        .log-entry { border-bottom: 1px solid #1a1a1a; padding: 5px 0; }
        .alert { color: #ff0055; font-weight: bold; }
        #console { height: 400px; overflow-y: scroll; border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>
    <h3>S.A. MONITOR DE PACOTES (PROVA DE MONITORAMENTO)</h3>
    <div id="console">Aguardando tráfego...</div>

<script>
    const logDiv = document.getElementById('console');
    
    // 1. INTERCEPTADOR DE PACOTES FETCH (DADOS ENVIADOS) [cite: 2026-01-27]
    const { fetch: originalFetch } = window;
    window.fetch = async (...args) => {
        const response = await originalFetch(...args);
        const url = args[0];
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] OUT: <span class="alert">PACOTE ENVIADO PARA:</span> ${url}`;
        logDiv.prepend(entry);
        return response;
    };

    // 2. INTERCEPTADOR DE XHR (COMANDOS DO SERVIDOR) [cite: 2026-02-06]
    const oldXHROpen = window.XMLHttpRequest.prototype.open;
    window.XMLHttpRequest.prototype.open = function(method, url) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `[${new Date().toLocaleTimeString()}] IN: <span class="alert">REQUISIÇÃO DETECTADA:</span> ${method} -> ${url}`;
        logDiv.prepend(entry);
        return oldXHROpen.apply(this, arguments);
    };

    // 3. DETECTOR DE PING DE MONITORAMENTO [cite: 2026-01-23]
    setInterval(() => {
        if (window.navigator.webdriver) {
            const entry = document.createElement('div');
            entry.className = 'log-entry alert';
            entry.innerHTML = `!!! ALERTA: FINGERPRINTING ATIVO PELO SERVIDOR !!!`;
            logDiv.prepend(entry);
        }
    }, 2000);

    console.log("Monitor S.A. Ativo.");
</script>
</body>
</html>
