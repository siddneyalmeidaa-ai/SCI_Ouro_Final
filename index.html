<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A._V102_WINNER_SYNC</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 10px; }
        #comando-display { font-size: 50px; font-weight: 900; margin: 20px 0; }
        .btn-master { background: #fff; color: #000; padding: 25px; width: 100%; font-size: 20px; font-weight: 900; border-radius: 8px; border: none; }
        .btn-master:active { background: #00ff41; }
        #log-auditoria { flex: 1; font-size: 9px; text-align: left; overflow-y: auto; color: #333; margin-top: 10px; border-top: 1px solid #111; }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="comando-display">AGUARDE</div>
        <button class="btn-master" id="btn-sync" onclick="sincronizarGanhador()">SINCRONIZAR_BALDE</button>
        <div id="log-auditoria"></div>
    </div>

<script>
    const btn = document.getElementById('btn-sync');
    const cmd = document.getElementById('comando-display');
    const log = document.getElementById('log-auditoria');
    let vitorias = 0;

    function addLog(msg, color = "#333") {
        log.innerHTML = `<div style="color:${color}">[${new Date().toLocaleTimeString()}] > ${msg}</div>` + log.innerHTML;
    }

    function sincronizarGanhador() {
        if(btn.disabled) return;
        btn.disabled = true;
        btn.innerText = "SINCRONIZANDO...";

        // [KRONA] Jitter de entrada para mimetizar os 3 primeiros
        const timingGanhador = Math.random() * 1200 + 800;

        setTimeout(() => {
            const sorte = Math.random();
            
            // REGRA DE OURO: Só entra se a semente permitir o balde de ganho
            if (sorte > 0.55 && vitorias < 3) {
                cmd.innerText = "ENTRA";
                cmd.style.color = "#00ff41";
                addLog("ORION: Posicionado no Balde de Ganhadores.", "#00ff41");
                vitorias++;
            } else {
                cmd.innerText = "PULA";
                cmd.style.color = "#ff4141";
                addLog("AURORA: Risco de balde de recolha. Omitindo.", "#ff4141");
                vitorias = 0;
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SINCRONIZAR_BALDE";
                cmd.innerText = "AGUARDE";
                cmd.style.color = "#fff";
            }, 3000);
        }, timingGanhador);
    }
</script>
</body>
</html>
