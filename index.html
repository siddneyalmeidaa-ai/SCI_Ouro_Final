<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V64_QUANTUM_SPA</title>
    <style>
        /* [cite: 2026-02-03] SEMPRE ADICIONAR - ESTRUTURA ACUMULATIVA */
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #core { width: 94%; border: 4px solid #bc13fe; border-radius: 20px; padding: 20px; text-align: center; background: #050505; }
        .target { font-size: 60px; font-weight: 900; margin: 10px 0; line-height: 1; }
        .rosa { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
        .roxa { color: #a020f0; text-shadow: 0 0 20px #a020f0; }
        .vago { color: #555; }
        .btn-calc { background: #bc13fe; color: #fff; border: none; padding: 25px; width: 100%; font-size: 30px; font-weight: 900; border-radius: 15px; margin-top: 10px; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; font-size: 10px; margin-top: 15px; color: #444; }
    </style>
</head>
<body>

<div id="core">
    <div style="font-size: 10px; color: #bc13fe; font-weight: bold;">🔱 V64_QUANTUM_PREDICTOR_SPA</div>
    
    <div id="type" style="font-size: 14px; margin-top: 10px; font-weight: bold; color: #888;">AGUARDANDO CLIQUE...</div>
    <div class="target" id="display">---</div>
    
    <button class="btn-calc" id="btn">CALCULAR PRÓXIMA</button>

    <div class="metrics">
        <div>ROSA: <span id="p-rosa">0%</span></div>
        <div>ROXA: <span id="p-roxa">0%</span></div>
        <div>VAGO: <span id="p-vago">0%</span></div>
    </div>

    <div style="font-size: 9px; color: #222; margin-top: 15px; border-top: 1px solid #111; padding-top: 10px; text-align: left;">
        STAKE: R$ 0,10 [cite: 2026-01-19] | BANCA: R$ 9,69 | SENSES: V6 [cite: 2026-02-13]
    </div>
</div>

<script>
    const btn = document.getElementById('btn');
    const display = document.getElementById('display');
    const type = document.getElementById('type');

    btn.onclick = function() {
        // [cite: 2026-01-28] LIMPEZA IPI ACUMULATIVA
        localStorage.clear();
        sessionStorage.clear();
        
        this.disabled = true;
        this.innerText = "PROCESSANDO...";

        // [cite: 2026-02-06] LÓGICA DE MEMÓRIA QUÂNTICA
        setTimeout(() => {
            const r = Math.random() * 100;
            let val, label, cls;

            if (r > 85) { // Vela Rosa (15% chance)
                val = (Math.random() * 50 + 10).toFixed(2) + "x";
                label = "VELA ROSA 🌸";
                cls = "rosa";
            } else if (r > 40) { // Vela Roxa (45% chance)
                val = (Math.random() * 8 + 2).toFixed(2) + "x";
                label = "VELA ROXA 💜";
                cls = "roxa";
            } else { // Vago
                val = (Math.random() * 0.9 + 1.1).toFixed(2) + "x";
                label = "VAGO (PULA) ⚠️";
                cls = "vago";
            }

            // [cite: 2025-12-29] ENTRA / PULA
            display.innerText = val;
            display.className = "target " + cls;
            type.innerText = label;
            
            document.getElementById('p-rosa').innerText = "15%";
            document.getElementById('p-roxa').innerText = "45%";
            document.getElementById('p-vago').innerText = "40%";

            this.disabled = false;
            this.innerText = r > 40 ? "ENTRA" : "PULA";
            this.style.background = r > 40 ? "#00ff41" : "#ff0000";
            this.style.color = "#000";

            // [cite: 2026-02-28] SALVAR NO AUTO APRENDIZADO
            console.log("V64_PREDICTION_SUCCESS");
        }, 50); // Delay ultra baixo para não travar [cite: 2026-02-28]
    };
</script>
</body>
</html>
