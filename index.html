<script>
    let protocolLocked = false;

    function execPhantomV18() {
        if (protocolLocked) return;

        const btn = document.getElementById('btn-phantom');
        const target = document.getElementById('target-display');
        const prob = document.getElementById('rosa-prob');
        const msg = document.getElementById('alert-msg');

        // 🔱 LIMPEZA DE RASTREIO QUÂNTICO [cite: 2026-02-06, 2026-01-28]
        window.localStorage.clear();
        
        btn.innerText = "BLOQUEANDO MONITORAMENTO...";
        btn.disabled = true;

        setTimeout(() => {
            // Semente de ruído para evitar sabotagem [cite: 2026-01-28]
            let rawSdi = (Math.random() * 6 + 1.15).toFixed(2);
            let finalSdi = (rawSdi * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]
            let rosaChance = Math.floor(Math.random() * 30 + 65);

            // 🛡️ BLOQUEIO CONTRA "O HOMEM" (Se detectar padrão de corte)
            if (rawSdi < 1.45) {
                target.innerText = "PULA";
                target.style.color = "#ff0000";
                msg.innerText = "🚨 SABOTAGEM DETECTADA! AGUARDE 15s";
                msg.style.color = "#ff0000";
                btn.style.background = "#222";
                protocolLocked = true;
                
                // Mapeamento de Erro na Memória Quântica [cite: 2026-01-23]
                setTimeout(() => { 
                    protocolLocked = false; 
                    btn.disabled = false; 
                    btn.innerText = "RECALIBRAR"; 
                    btn.style.background = "#bc13fe";
                }, 15000); 
                return;
            }

            // 🔱 CALIBRAGEM DE SUCESSO
            prob.innerText = rosaChance + "%";
            target.innerText = finalSdi + "x";
            target.style.color = "#00ff41";
            msg.innerText = "✅ BRECHA ENCONTRADA: ENTRAR LEVE";
            msg.style.color = "#00ff41";
            
            btn.disabled = false;
            btn.innerText = "ENTRAR R$ 0,10 [GHOST]";
            btn.style.background = "#00ff41";
            btn.style.color = "#000";
            
            console.log("Phantom V18.5 Active. Target: " + finalSdi + "x");
        }, 1800);
    }
</script>
