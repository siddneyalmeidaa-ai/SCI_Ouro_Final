<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V800 - PINK MARKET NASA</title>
    <style>
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --neon: #00f3ff; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; overflow-x: hidden; }
        .caixa-preta { border: 2px solid var(--nasa); border-radius: 30px; padding: 15px; background: radial-gradient(circle at top, #0b3d9133, #000); box-shadow: 0 0 40px var(--nasa); position: relative; }
        
        /* RADAR TELEMETRIA NASA */
        .radar-nasa { width: 100px; height: 100px; border: 2px solid var(--pink); border-radius: 50%; margin: 10px auto; position: relative; overflow: hidden; }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--pink)); animation: rotate 2s linear infinite; opacity: 0.3; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* PAINEL PINK MARKET */
        .pink-market-stats { display: grid; grid-columns: 1fr 1fr; gap: 10px; background: rgba(255, 0, 255, 0.05); border: 1px solid var(--pink); padding: 10px; border-radius: 15px; margin-bottom: 15px; }
        .stat-label { font-size: 8px; color: var(--pink); text-transform: uppercase; }
        .stat-val { font-size: 16px; color: #fff; text-shadow: 0 0 5px var(--pink); }

        .monitor-voo { background: rgba(0, 243, 255, 0.05); padding: 20px; border-radius: 25px; border: 1px solid var(--neon); margin: 15px 0; }
        #percentual { font-size: 4em; color: var(--neon); display: block; }
        
        .btn-nasa { background: var(--pink); color: #fff; padding: 20px; border-radius: 20px; font-size: 1.2em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 20px var(--pink); text-transform: uppercase; }
        
        .esquadroes-mini { display: flex; justify-content: center; gap: 3px; margin-top: 10px; }
        .ponto { width: 6px; height: 6px; background: #333; border-radius: 50%; }
        .ponto.active { background: var(--neon); box-shadow: 0 0 5px var(--neon); }
    </style>
</head>
<body>

    <div class="caixa-preta">
        <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--nasa); margin-bottom:5px;">
            <span>S.A. V800 // PINK_MARKET_NASA</span>
            <span id="timer">00:00:00</span>
        </div>

        <div class="radar-nasa"><div class="radar-sweep"></div></div>

        <div class="pink-market-stats">
            <div><span class="stat-label">📡 Telemetria Global</span><span class="stat-val">SINCRO_NASA</span></div>
            <div><span class="stat-label">🚀 Propulsão Extração</span><span class="stat-val">99.8%</span></div>
        </div>

        <div class="monitor-voo">
            <div style="font-size: 10px; color: var(--neon);">CONTAGEM REGRESSIVA PARA EXTRAÇÃO</div>
            <div id="percentual">0%</div>
            <div id="status" style="margin-top:10px; font-size:12px; color:var(--pink); font-weight:bold;">SISTEMA EM ÓRBITA</div>
            
            <div class="esquadroes-mini" id="pontosFarol">
                <script>for(let i=0; i<20; i++) document.write('<div class="ponto"></div>');</script>
            </div>
        </div>

        <button id="mainBtn" class="btn-nasa" onclick="ignicaoNasa()">IGNIÇÃO PINK MARKET 🔱</button>

        <div id="log" style="font-size: 9px; color: #666; margin-top: 10px; font-family: monospace; text-align: left; height: 50px; overflow: hidden;">
            > AGUARDANDO COMANDO DE IGNICAO...
        </div>
    </div>

    <script>
        let rodando = false;
        function updateLog(msg) {
            const log = document.getElementById('log');
            log.innerHTML = `> ${msg}<br>` + log.innerHTML;
        }

        async function ignicaoNasa() {
            if(rodando) return; rodando = true;
            const btn = document.getElementById('mainBtn');
            const pontos = document.querySelectorAll('.ponto');
            btn.disabled = true;

            updateLog("INICIANDO PROTOCOLO NASA...");
            
            // Ativação rápida dos 20 faróis
            for(let p of pontos) {
                await new Promise(r => setTimeout(r, 30));
                p.classList.add('active');
            }

            updateLog("TELEMETRIA DEEP SPACE ATIVA");
            
            let x = 1.00;
            let loop = () => {
                x += 0.09;
                let p = ((x - 1) / (1.25 - 1) * 100);
                if(p > 100) p = 100;
                document.getElementById('percentual').innerText = Math.floor(p) + "%";
                
                if (p >= 85) { 
                    document.getElementById('status').innerText = "SAQUE IMEDIATO - NASA CONFIRMED"; 
                    document.getElementById('percentual').style.color = "var(--pink)";
                }
                
                if (x >= 2.0) { 
                    rodando = false; btn.disabled = false;
                    updateLog("EXTRAÇÃO CONCLUÍDA - RETORNANDO À ÓRBITA");
                    setTimeout(reset, 2000);
                } else { setTimeout(loop, 40); }
            }; loop();
        }

        function reset() {
            document.querySelectorAll('.ponto').forEach(p => p.classList.remove('active'));
            document.getElementById('percentual').innerText = "0%";
            document.getElementById('percentual').style.color = "var(--neon)";
            document.getElementById('status').innerText = "SISTEMA EM ÓRBITA";
        }
        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
