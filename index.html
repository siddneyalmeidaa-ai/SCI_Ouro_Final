<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: transparent; overflow: hidden; }
        /* Barra Horizontal Ghost [cite: 2026-01-23] */
        #sa_bar {
            width: 100%; height: 40px; background: #000;
            display: flex; align-items: center; justify-content: space-around;
            border-bottom: 1px solid #00ffcc; color: #00ffcc;
            font-family: monospace; font-size: 14px; font-weight: bold;
            transition: 0.3s; cursor: pointer;
        }
        .ghost_blur { backdrop-filter: blur(10px); background: rgba(0,0,0,0.9) !important; }
    </style>
</head>
<body>

<div id="sa_bar" oncontextmenu="return false;" onmousedown="start_ghost()" onmouseup="end_ghost()" ontouchstart="start_ghost()" ontouchend="end_ghost()">
    <span>S.A. GHOST</span>
    <span id="v">2.69x</span>
    <span id="st" style="font-size: 10px;">LIBERADO</span>
    <span id="dna" style="color: #444;">0.428</span>
</div>

<script>
    /* Regra -50% e Anti-Monitoramento [cite: 2026-01-16, 2026-01-23] */
    function start_ghost() {
        const bar = document.getElementById('sa_bar');
        bar.classList.add('ghost_blur'); // Camada para não identificar print [cite: 2026-01-23]
        document.getElementById('st').innerText = "CALCULANDO...";
    }

    function end_ghost() {
        setTimeout(() => {
            const bar = document.getElementById('sa_bar');
            bar.classList.remove('ghost_blur');
            // Projeção baseada no DNA 0.428 do seu print
            document.getElementById('v').innerText = "2.69x"; 
            document.getElementById('st').innerText = "LIBERADO";
            console.clear();
        }, 500);
    }
</script>
</body>
</html>
