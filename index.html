<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. MONITOR_OURO_V7</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 150px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 10px; background: rgba(10,0,0,0.9); }
        .config-panel { border: 1px solid #00ffcc; padding: 10px; margin-bottom: 10px; }
        input { background: #111; border: 1px solid #00ffcc; color: #00ffcc; width: 90%; margin: 5px 0; padding: 5px; font-size: 10px; }
        .header { display: flex; justify-content: space-between; background: #00ffcc; color: #000; padding: 4px 10px; font-weight: bold; }
        #display { text-align:center; font-size: 40px; padding: 10px; font-weight: 900; }
        .btn-sync { background: #00ffcc; color: #000; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <span>S.A. MONITOR_OURO</span>
        <span id="clock">04:12</span>
    </div>

    <div class="config-panel">
        <label>CLIENT_SEED:</label>
        <input type="text" id="c-seed" placeholder="Cole a Semente do Cliente...">
        <label>SERVER_HASH:</label>
        <input type="text" id="s-hash" placeholder="Cole o SHA256 do Servidor...">
        <button class="btn-sync" onclick="syncData()">SYNC_OURO</button>
    </div>

    <div id="st-msg" style="text-align:center; color:#ff0055;">STATUS: PENDENTE 0%</div>
    <div id="display">READY</div>

    <div class="terminal" id="term">
        > AGUARDANDO CONFIGURAÇÕES VAZIAS...<br>
        > MONITOR DE PACOTES: ATIVO
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');
    const stMsg = document.getElementById('st-msg');

    function syncData() {
        const cSeed = document.getElementById('c-seed').value;
        const sHash = document.getElementById('s-hash').value;

        if (cSeed === "" || sHash === "") {
            stMsg.innerText = "STATUS: PENDENTE 0%"; //
            stMsg.style.color = "#ff0055";
            logEvent("ERRO: CAMPOS VAZIOS DETECTADOS");
            return;
        }

        // Simulação de Ingestão de Dados
        stMsg.innerText = "STATUS: LIBERADO 100%"; //
        stMsg.style.color = "#00ffcc";
        logEvent("SINCRONIA OURO ESTABELECIDA");
        
        calculateNext(cSeed, sHash);
    }
