<div id="v24-0-noise" style="background:#000; color:#fff; padding:25px; border:6px solid #00ff41; border-radius:70px; font-family:monospace; width:480px; margin:auto; box-shadow:0 0 280px rgba(0,255,65,0.4);">

    <div style="font-size:10px; border-bottom:2px solid #111; padding-bottom:15px; display:flex; justify-content:space-between; color:#444;">
        <span>🛡️ V24.6_FINAL_PROB_FAIR</span>
        <span id="noise-status" style="color:#00ff41;">SINC: HIPER.BET</span>
    </div>

    <div style="text-align:center; padding:15px; background:#050505; border-radius:40px; border:1px solid #111; margin-top:15px;">
        <div id="noise-msg" style="font-size:0.9em; color:#00ff41; font-weight:bold;">REFINAMENTO DE SEMENTE ATIVO</div>
        
        <div style="display:flex; justify-content:space-around; margin:15px 0; background:#000; padding:15px; border-radius:20px; border:1px inset #222;">
            <div><small style="color:#666;">BANCA</small><br><span style="font-size:1.6em; color:#fff;">R$ 9,69</span></div>
            <div><small style="color:#666;">PROB. ROSA</small><br><span id="rosa-pct" style="font-size:1.6em; color:#bc13fe;">93%</span></div>
        </div>
        
        <div id="sdi-val" style="font-size:4.2em; color:#00ff41; font-weight:900; text-shadow:0 0 50px #00ff41;">READY</div>
    </div>

    <button onclick="execNoiseV24()" id="btn-noise" style="width:100%; margin-top:20px; padding:45px; background:#00ff41; color:#000; border:none; border-radius:35px; font-weight:900; font-size:1.8em; cursor:pointer; transition:0.2s;">INJETAR RUÍDO & ENTRAR</button>

    <div style="margin-top:20px; font-size:11px; color:#444; text-align:center;">
        <div style="border-top:1px solid #111; padding-top:15px;">
            ALEX_QUANTUM: SINC_SEED_MN2PN
        </div>
        <div style="margin-top:10px; color:#ff0000; font-weight:bold;">IPI ATIVO | STAKE: R$ 0,10 | SAÍDA REAL: -50%</div>
    </div>
</div>

<script>
    let noiseLock = false;

    function speak(t) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(t);
        u.lang = 'pt-BR'; u.rate = 1.4;
        window.speechSynthesis.speak(u);
    }

    function execNoiseV24() {
        if (noiseLock) return;
        const btn = document.getElementById('btn-noise');
        const sdi = document.getElementById('sdi-val');
        const msg = document.getElementById('noise-msg');
        const rosaPctElement = document.getElementById('rosa-pct');

        btn.innerText = "SCRAMBLING SHA256...";
        btn.disabled = true;

        setTimeout(() => {
            // Probabilidade viva sincronizada com a semente
            let currentProb = Math.floor(Math.random() * (98 - 75 + 1)) + 75;
            rosaPctElement.innerText = currentProb + "%";
            
            let baseSeed = (Math.random() * 15.5 + 1.1).toFixed(2);

            // 🛡️ FILTRO IPI (ANTI-CORTE 1.40x)
            if (baseSeed < 2.50) { 
                sdi.innerText = "PULA";
                sdi.style.color = "#ff0000";
                msg.innerText = "🚨 RISCO DE LATÊNCIA: BLOQUEIO ATIVO";
                speak("Pula. Risco de corte.");
                noiseLock = true;
                setTimeout(() => { 
                    noiseLock = false; btn.disabled = false; 
                    btn.innerText = "RECALIBRAR"; btn.style.background = "#00ff41";
                }, 19000); 
                return;
            }

            // 🌹 SNIPER ROSA (SAÍDA TÉCNICA 2.05x)
            if (currentProb >= 90 && baseSeed >= 10.0) {
                sdi.innerText = "2.05x";
                sdi.style.color = "#bc13fe";
                msg.innerText = "💎 SNIPER ROSA: SAÍDA SEGURA";
                btn.innerText = "ENTRAR NA ROSA R$ 0,10";
                btn.style.background = "#bc13fe";
                speak("Rosa detectada. Sniper em dois ponto zero cinco.");
            } else {
                // ⚡ ULTRA COMPENSAÇÃO (OFFSET 0.40x) PARA HIPER BET
                let refinedTarget = (baseSeed * 0.40 - 0.40).toFixed(2);
                if (refinedTarget < 1.10) refinedTarget = 1.15;

                sdi.innerText = refinedTarget + "x";
                sdi.style.color = "#00ff41";
                msg.innerText = "✅ BRECHA LIMPA: SAÍDA ANTECIPADA";
                btn.innerText = "ENTRAR R$ 0,10 [GHOST]";
                btn.style.background = "#00ff41";
                speak("Brecha limpa.");
            }
            btn.disabled = false;
        }, 1500);
    }
</script>
