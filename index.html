<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V230_MIMIC</title>
    <style>
        :root { --c1: #00ffcc; --c2: #9d00ff; --d: #ff0055; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: #fff; }
        
        /* Interface Mutante: Posição dinâmica via JS */
        .mimic-h { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(25px); border-bottom: 1px solid #1a1a1a; transition: all 0.5s ease-in-out; }
        .v-out { font-size: 42px; font-weight: 900; color: var(--c1); letter-spacing: -2px; }
        .btn-ui { background: #fff; color: #000; border: none; padding: 12px 22px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: transform 0.2s; }
        
        #n-logs { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 5px; color: #222; opacity: 0.5; }
    </style>
</head>
<body>

<div id="m_root" class="mimic-h">
    <div id="m_box">
        <div id="v_display">MIMIC_READY</div>
        <div id="s_status" style="font-size: 7px; color: #ffd700; text-transform: uppercase;">HERA_MIMIC: ON</div>
    </div>
    <button class="btn-ui" onclick="toggleMimic()">START_V230</button>
</div>

<div id="n-logs">HEATMAP_SHIELD | DISTRACTION_ENGINE | PANDORA_JITTER</div>

<script>
    /* 1. MEMÓRIA E ENTROPIA [cite: 2026-01-27, 2026-02-06] */
    const MEM_KEY = "_ga_u_metrics_v2";
    let isAutoRunning = false;
    let globalData = JSON.parse(localStorage.getItem(MEM_KEY)) || { rounds: 0, consecutive_skips: 0 };

    const getS5Entropy = () => {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
    };

    /* 2. MOTOR DE DISTRAÇÃO ERRÁTICA (HERA & SELENE) [cite: 2026-02-13] */
    function organicDistraction() {
        if(!isAutoRunning) return;
        // Simula scroll leve (ajuste de tela)
        window.scrollBy(0, getS5Entropy() > 0.5 ? 3 : -3);
        // Simula micro-movimentos de mouse em áreas vazias
        const move = new MouseEvent('mousemove', {
            clientX: getS5Entropy() * 100,
            clientY: getS5Entropy() * 100,
            bubbles: true
        });
        document.dispatchEvent(move);
    }

    /* 3. INTERFACE MUTANTE (ANTI-HEATMAP) [cite: 2026-02-03] */
    function mutateUI() {
        const header = document.querySelector('.mimic-h') || document.querySelector('div[id^="sh_"]');
        const box = document.querySelector('#m_box') || document.querySelector('div[id^="sh_"] div');
        
        // Altera aleatoriamente o padding e a altura para que o clique nunca seja no mesmo pixel
        header.style.paddingTop = (Math.floor(getS5Entropy() * 15) + 5) + 'px';
        header.style.paddingBottom = (Math.floor(getS5Entropy() * 15) + 5) + 'px';
        box.style.marginLeft = (Math.floor(getS5Entropy() * 20) - 10) + 'px';
    }

    function toggleMimic() {
        isAutoRunning = !isAutoRunning;
        const btn = document.querySelector('.btn-ui');
        btn.innerText = isAutoRunning ? "STOP_MIMIC" : "START_MIMIC";
        btn.style.background = isAutoRunning ? "var(--d)" : "#fff";
        if(isAutoRunning) {
            mutateUI();
            runAutoCycle();
        }
    }

    function runAutoCycle() {
        if(!isAutoRunning) return;
        
        igniteNeuralGhost();
        
        // Agendamento com Jitter agressivo (15s a 45s) [cite: 2026-02-28]
        const nextTick = (getS5Entropy() * 30000) + 15000;
        
        // Injeta distrações aleatórias durante a espera
        setTimeout(organicDistraction, nextTick / 2);
        
        setTimeout(() => {
            mutateUI(); // Muda a interface antes do próximo ciclo
            runAutoCycle();
        }, nextTick);
    }

    /* 4. LÓGICA NEURAL V230 [cite: 2026-01-28, 2026-01-19] */
    function igniteNeuralGhost() {
        const d = document.querySelector('.v-out') || document.querySelector('div[id^="sh_"] div');
        const s = document.querySelector('div[style*="color: #ffd700"]');
        
        d.innerText = "---"; d.style.color = "#111";
        s.innerText = "SELENE: MIMETIZANDO...";

        const fatigue = Math.min(globalData.rounds * 100, 3000);
        const delay = (getS5Entropy() * 2500) + 1000 + fatigue;

        setTimeout(() => {
            const seed = getS5Entropy();
            
            // Proteção de Retenção Morgana [cite: 2025-12-29]
            if (globalData.consecutive_skips >= 2 && seed < 0.6) {
                d.innerText = "PAUSE"; d.style.color = "var(--d)";
                s.innerText = "MORGANA: RESET_WAIT";
                globalData.consecutive_skips = 0;
                return;
            }

            if (seed > 0.93) { // ALVO ROSA
                d.innerText = (getS5Entropy() * 7 + 8.1).toFixed(2) + "x";
                d.style.color = "var(--c2)";
                globalData.consecutive_skips = 0;
            } else if (seed < 0.25) { // VÁCUO
                d.innerText = "PULA"; d.style.color = "var(--d)";
                globalData.consecutive_skips++;
            } else {
                const goals = [1.28, 1.45, 2.10, 1.33, 1.95];
                const g = goals[Math.floor(getS5Entropy() * goals.length)];
                d.innerText = (g + (getS5Entropy() * 0.1)).toFixed(2) + "x";
                d.style.color = g > 2 ? "var(--c2)" : "var(--c1)";
                globalData.consecutive_skips = 0;
            }

            globalData.rounds++;
            localStorage.setItem(MEM_KEY, JSON.stringify(globalData));
        }, delay);
    }

    // Ofuscação de DOM inicial [cite: 2026-01-27]
    (function(){
        const ids = ['m_root', 'v_display', 's_status', 'm_box'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if(el) el.id = 'sh_' + Math.floor(getS5Entropy() * 99999);
        });
    })();
</script>
</body>
</html>
