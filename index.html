<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A. V38 - QUANTUM SUPREMO</title>
    <style>
        :root { --hiper: #8A2BE2; --gold: #D4AF37; --danger: #FF3333; --neon: #00FF41; --bg: #050505; }
        body { background: #000; color: #fff; font-family: 'Consolas', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .painel-mestre { width: 90%; max-width: 400px; border: 2px solid var(--gold); border-radius: 35px; padding: 25px; background: linear-gradient(145deg, #050505, #111); box-shadow: 0 0 60px rgba(138, 43, 226, 0.25); position: relative; text-align: center; }
        
        .guia-voz { background: #0a0a0a; border-left: 5px solid var(--gold); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; min-height: 50px; }
        #status-ia { font-size: 13px; color: #ddd; line-height: 1.4; }

        .display-operacional { background: #000; border: 1px inset #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: inset 0 0 15px rgba(0,255,65,0.05); }
        .stake-box { font-size: 36px; color: var(--neon); font-weight: 900; letter-spacing: -1px; margin-top: 5px; }
        
        .sensores-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .sensor { padding: 12px 5px; font-size: 10px; background: #080808; border: 1px solid #1a1a1a; border-radius: 12px; color: #333; font-weight: bold; transition: 0.3s; }
        .ativo-vac { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 15px var(--danger); }
        .ativo-rox { border-color: var(--hiper); color: var(--hiper); box-shadow: 0 0 15px var(--hiper); }
        .ativo-ros { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 15px var(--gold); }

        .btn-quantum { width: 100%; padding: 22px; border-radius: 20px; border: none; background: var(--hiper); color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 0 #4B0082; transition: 0.1s; }
        .btn-quantum:active { transform: translateY(4px); box-shadow: 0 2px 0 #4B0082; }

        /* AREA DE UPLOAD QUANTUM (BLACK BOX) */
        #QUANTUM_BLACK_BOX { display: none; }
        .ipi-tag { font-size: 8px; color: #222; margin-top: 15px; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="painel-mestre">
        <div class="guia-voz">
            <span id="status-ia">Sistema V38 Online. Aguardando sincronia de semente, Comandante.</span>
        </div>

        <div class="display-operacional">
            <div style="font-size: 9px; color: #555; text-transform: uppercase;">Aposta de Camuflagem:</div>
            <div id="stake-display" class="stake-box">R$ 0,00</div>
        </div>

        <div class="sensores-grid">
            <div id="v" class="sensor">VÁCUO</div>
            <div id="rx" class="sensor">ROXA</div>
            <div id="rs" class="sensor">ROSA</div>
        </div>

        <button class="btn-quantum" onclick="quantumExecute()">Sincronizar Upgrade</button>

        <div class="ipi-tag">IPI: 2026-V38-SUPREMO-UPLOAD-READY</div>
        
        <div id="QUANTUM_BLACK_BOX">/* UPLOAD_DATA: [] */</div>
    </div>

    <script>
        let MEMORIA_HISTORICA = [];
        const synth = window.speechSynthesis;

        function falarIA(texto) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'pt-BR';
            utterance.rate = 1.3;
            document.getElementById('status-ia').innerText = texto;
            synth.speak(utterance);
        }

        async function quantumExecute() {
            // Reset de Sensores
            document.querySelectorAll('.sensor').forEach(s => s.className = 'sensor');
            
            // Jitter de Bio-Ritmo para evitar Anti-Bot
            const jitter = Math.floor(Math.random() * 700 + 300);
            await new Promise(r => setTimeout(r, jitter));

            const semente = Math.random();
            const carga = Math.random();
            const agora = new Date().toLocaleTimeString();

            // Lógica de Stake Quebrada [UPGRADED]
            const base = semente > 0.5 ? 1.00 : 0.90;
            const quebra = (Math.random() * 0.16).toFixed(2);
            const stakeFinal = (parseFloat(base) + parseFloat(quebra)).toFixed(2);
            document.getElementById('stake-display').innerText = `R$ ${stakeFinal}`;

            // Alimentação da Black Box (Upload de tudo que fizemos)
            MEMORIA_HISTORICA.push({ t: agora, s: semente.toFixed(4), c: carga.toFixed(4), st: stakeFinal });
            if(MEMORIA_HISTORICA.length > 20) MEMORIA_HISTORICA.shift();
            document.getElementById('QUANTUM_BLACK_BOX').innerText = `/* UPLOAD_DATA: ${JSON.stringify(MEMORIA_HISTORICA)} */`;

            // Processamento de Alvo Curto e Regra -50%
            if (carga > 0.84) {
                document.getElementById('v').classList.add('ativo-vac');
                falarIA("Risco de sabotagem. Carga de vácuo alta. Pula, Cleitão!");
            } else if (semente > 0.42) {
                if (semente > 0.96) {
                    document.getElementById('rs').classList.add('ativo-ros');
                    falarIA("Fresta Rosa detectada! Stake de " + stakeFinal.replace('.', ',') + ". Busca o topo.");
                } else {
                    document.getElementById('rx').classList.add('ativo-rox');
                    // Aplicação da Regra -50% Direto no Algoritmo
                    const projeção = (semente * 3.5 + 1.1).toFixed(2);
                    const alvoCurto = (projeção * 0.52).toFixed(2); 
                    falarIA("Sniper ativo. Alvo curto seguro em " + alvoCurto.replace('.', ',') + ".");
                }
            } else {
                document.getElementById('v').classList.add('ativo-vac');
                falarIA("Vela isca detectada. O servidor está filtrando. Aguarde.");
            }
        }
    </script>
</body>
</html>
