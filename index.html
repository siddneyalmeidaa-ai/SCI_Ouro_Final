<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. DEEP_SCAN_V6</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; overflow: hidden; }
        .terminal { height: 180px; overflow-y: auto; border: 1px solid #ff0055; padding: 5px; margin-top: 5px; background: rgba(15,0,0,0.9); }
        .v-box { display: flex; justify-content: space-around; border: 1px solid #444; padding: 5px; margin-bottom: 5px; }
        .alert { color: #ff0055; font-weight: bold; animation: blink 0.5s infinite; }
        .header { display: flex; justify-content: space-between; background: #00ffcc; color: #000; padding: 4px 10px; font-weight: bold; }
        #display { text-align:center; font-size: 44px; padding: 10px; font-weight: 900; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body onclick="forceScan()">
    <div class="header">
        <span>S.A. DEEP_SCAN_V6</span>
        <span id="clock">04:05</span>
    </div>

    <div class="v-box">
        <div>VÁCUO: <span id="v-status">CALCULANDO...</span></div>
        <div>RASTREIO: <span id="r-status">OFF</span></div>
    </div>

    <div id="display">READY</div>
    <div id="st-msg" style="text-align:center; color:#00ffcc; font-size: 9px;">MONITORAMENTO DE DECOLAGEM ATIVO</div>

    <div class="terminal" id="term">
        > INICIALIZANDO DEEP_SCAN...<br>
        > DNA_TARGET: 0.428 [cite: 2026-01-23]
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');
    const vStatus = document.getElementById('v-status');
    const rStatus = document.getElementById('r-status');

    function forceScan() {
        const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
        
        // 1. DETECTOR DE VÁCUO (PACOTES OMITIDOS) [cite: 2026-01-27]
        if (entropy > 0.78) {
            vStatus.innerText = "ALTO RISCO";
            vStatus.className = "alert";
            rStatus.innerText = "MONITORADO";
            display.innerText = "PULA";
            display.style.color = "#ff0055";
            logEvent("!!! VÁCUO DETECTADO NA DECOLAGEM !!!");
        } else {
            vStatus.innerText = "ESTÁVEL";
            vStatus.className = "";
            rStatus.innerText = "GHOST_MODE";
            // Regra de -50% sobre o DNA 0.428 [cite: 2026-01-16]
            const val = (entropy * 1.5 + 1.12).toFixed(2);
            display.innerText = val + "x";
            display.style.color = "#00ffcc";
            logEvent(`PACOTE_SYNC: LIBERADO ${val}x`);
        }
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.style.borderBottom = "1px solid #222";
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        console.clear(); // Limpa rastro quântico [cite: 2026-01-23]
    }

    /* SINCRONIA DE TEMPO [cite: 2026-01-20] */
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
