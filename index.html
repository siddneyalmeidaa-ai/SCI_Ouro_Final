<div id="v17-2-fix" style="background:#000; color:#00ff41; padding:15px; border:1px solid #00ff41; font-family:monospace; width:350px; margin:auto; text-align:center;">
    
    <div style="font-size:9px; color:#555; margin-bottom:10px;">🛡️ V17.2_FORCE_REFRESH [cite: 2026-02-06]</div>

    <div style="background:#080808; padding:10px; border-radius:5px;">
        <div id="d-val" style="font-size:2em; color:#fff; font-weight:bold;">0.00x</div>
        <div id="d-stk" style="font-size:0.9em; color:#bc13fe; margin-top:5px;">STAKE: R$ 0,00</div>
    </div>

    <button onclick="forceExecute()" id="btn-fix" style="width:100%; margin-top:15px; padding:15px; background:#00ff41; color:#000; font-weight:900; border:none; cursor:pointer;">DESTRAVAR E INFILTRAR</button>

</div>

<script>
    function forceExecute() {
        // 🔱 LIMPEZA DE CACHE DE CÁLCULO
        window.localStorage.clear(); 
        
        const dv = document.getElementById('d-val');
        const ds = document.getElementById('d-stk');
        const btn = document.getElementById('btn-fix');

        btn.innerText = "LIMPANDO BUFFER...";
        
        setTimeout(() => {
            // Gerador de semente com ruído de milissegundos para evitar travamento
            let seed = (Math.random() * 5 + 1.1 + (new Date().getMilliseconds() / 1000)).toFixed(2);
            let sdiFinal = (seed * 0.50).toFixed(2); // Regra -50% [cite: 2026-01-16]
            let stake = (5 + Math.random()).toFixed(2); // Stake precisa de ruído [cite: 2026-01-19]

            dv.innerText = sdiFinal + "x";
            ds.innerText = "STAKE: R$ " + stake;
            btn.innerText = "SDI ATUALIZADO";
            btn.style.background = "#bc13fe";
            
            // Grava na Memória Quântica [cite: 2026-01-23]
            console.log("Memory Cleared. New SDI: " + sdiFinal);
        }, 500);
    }
</script>
