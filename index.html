<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL S.A. V159 - ALTA FREQUÊNCIA</title>
    <style>
        :root {
            --gold: #D4AF37;
            --dark-bg: #0a0a0a;
            --purple: #6200ea;
            --red: #ff1744;
            --green: #00e676;
            --card-blue: #1a237e;
        }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
            -webkit-user-select: none;
        }
        .header { border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 15px; text-align: center; }
        .gold-text { color: var(--gold); font-weight: bold; }
        
        /* Dashboard Principal */
        .card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: center;
        }

        /* Painel Sentinela Automático */
        #painelComando {
            font-size: 1.4em;
            font-weight: bold;
            padding: 25px;
            border-radius: 10px;
            margin: 10px 0;
            border: 2px solid #333;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .status-pula { background: rgba(255, 23, 68, 0.15); border-color: var(--red) !important; color: var(--red); box-shadow: 0 0 15px var(--red); }
        .status-entra { background: rgba(0, 230, 118, 0.15); border-color: var(--green) !important; color: var(--green); box-shadow: 0 0 15px var(--green); }
        .status-scan { background: rgba(212, 175, 55, 0.05); border-color: var(--gold) !important; color: var(--gold); }

        /* Tabela da Favelinha */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #111; }
        th, td { border: 1px solid #222; padding: 10px; text-align: center; font-size: 12px; }
        th { background: var(--card-blue); color: white; text-transform: uppercase; }

        .lucro-moldado { font-size: 1.8em; cursor: pointer; margin: 10px 0; }
        .footer-info { font-size: 9px; color: #444; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <span class="gold-text">TERMINAL S.A. V159</span><br>
        <small id="timer">--:--:--</small>
    </div>

    <div class="card">
        <div class="gold-text">SENTINELA: MONITORAMENTO ATIVO (500ms)</div>
        <div id="painelComando" class="status-scan">INICIALIZANDO...</div>
        <div style="font-size: 14px;">PRÓXIMA STAKE: <span id="autoStake" class="gold-text">---</span></div>
    </div>

    <div class="card">
        <div class="gold-text" style="font-size: 11px;">LUCRO MOLDADO (-50% MARGEM)</div>
        <div class="lucro-moldado" id="lucroDisplay" onclick="toggleMargem()">R$ 2.740,00</div>
        <small id="statusMargem" style="color: #666;">PROTEÇÃO S.A. ATIVA</small>
    </div>

    <div class="card">
        <div class="gold-text" style="margin-bottom: 10px;">TABELA DA FAVELINHA</div>
        <table>
            <thead>
                <tr>
                    <th>SINAL</th>
                    <th>AÇÃO</th>
                    <th>STAKE</th>
                </tr>
            </thead>
            <tbody id="favelinhaBody">
                <tr>
                    <td>M1-SENTINELA</td>
                    <td id="favAcao">--</td>
                    <td id="favStake">--</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer-info">
        IPI: 2026-V38-SUPREMO | CAIXA PRETA ENCRYPTED | SEMENTE: <span id="semente">--</span>
    </div>

    <script>
        // --- CONFIGURAÇÕES DE COMANDO ---
        let margemAtiva = true;
        let sementeAtual = "SA-" + Math.random().toString(36).toUpperCase().substring(2, 10);
        document.getElementById('semente').innerText = sementeAtual;

        // --- MOTOR DE ALTA FREQUÊNCIA (500ms) ---
        function scannerSentinela() {
            const painel = document.getElementById('painelComando');
            const stakeDisplay = document.getElementById('autoStake');
            const favAcao = document.getElementById('favAcao');
            const favStake = document.getElementById('favStake');

            // Simulação de Leitura de Caixa Preta (Lógica de Servidor)
            let analise = Math.random();

            if (analise > 0.75) {
                // ALERTA DE SABOTAGEM
                painel.innerText = "⚠️ PULA - VELA ISCA";
                painel.className = "status-pula";
                stakeDisplay.innerText = "R$ 0,00";
                favAcao.innerText = "PULA";
                favAcao.style.color = "#ff1744";
                favStake.innerText = "VÁCUO";
            } else if (analise < 0.25) {
                // SINAL LIBERADO
                painel.innerText = "✅ ENTRA - SINAL LIMPO";
                painel.className = "status-entra";
                stakeDisplay.innerText = "R$ 0,20";
                favAcao.innerText = "ENTRA";
                favAcao.style.color = "#00e676";
                favStake.innerText = "0,20";
            } else {
                // VARREDURA
                painel.innerText = "🔍 ESCANEANDO SERVIDOR...";
                painel.className = "status-scan";
                stakeDisplay.innerText = "---";
            }
        }

        // --- FUNÇÕES COMPLEMENTARES ---
        function toggleMargem() {
            const display = document.getElementById('lucroDisplay');
            const status = document.getElementById('statusMargem');
            if(margemAtiva) {
                display.innerText = "R$ 5.480,00";
                status.innerText = "MODO BRUTO (RISCO ALTO)";
                status.style.color = "orange";
                margemAtiva = false;
            } else {
                display.innerText = "R$ 2.740,00";
                status.innerText = "PROTEÇÃO S.A. ATIVA (-50%)";
                status.style.color = "#666";
                margemAtiva = true;
            }
        }

        // Execução em Alta Frequência (0.5 segundos)
        setInterval(scannerSentinela, 500);

        // Relógio
        setInterval(() => {
            document.getElementById('timer').innerText = new Date().toLocaleTimeString();
        }, 1000);

    </script>
</body>
</html>
