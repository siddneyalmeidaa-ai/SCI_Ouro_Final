<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA OPERACIONAL</title> <style>
        :root { --neon: #00FF41; --bg: #000; --gold: #D4AF37; --danger: #FF3333; --ghost: #FF00FF; }
        body { background: var(--bg); color: #fff; font-family: 'Consolas', monospace; padding: 10px; margin: 0; overflow: hidden; }
        .master-panel { width: 100%; max-width: 420px; background: #050505; border-radius: 30px; border: 2px solid var(--neon); padding: 25px; box-shadow: 0 0 60px rgba(0, 255, 65, 0.2); margin: auto; text-align: center; position: relative; }
        
        .fog-status { font-size: 9px; color: var(--ghost); letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; animation: glitch 2s infinite; }
        @keyframes glitch { 0% { opacity: 1; } 50% { opacity: 0.7; color: #fff; } 100% { opacity: 1; } }

        #radar-cont { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; padding: 12px; background: #0a0a0a; border-radius: 15px; border: 1px solid #1a1a1a; }
        #radar-led { width: 12px; height: 12px; background: var(--neon); border-radius: 50%; box-shadow: 0 0 15px var(--neon); }
        
        .btn-main { width: 100%; padding: 25px; background: var(--neon); border: none; border-radius: 20px; font-weight: 900; cursor: pointer; font-size: 20px; color: #000; text-transform: uppercase; box-shadow: 0 5px 20px rgba(0,255,65,0.4); transition: 0.1s; }
        .btn-main:hover { background: #00db37; }
        .btn-main:active { transform: scale(0.95); background: var(--gold); }
        
        #console-msg { background: #010101; height: 180px; font-size: 11px; color: var(--neon); overflow-y: auto; padding: 15px; border-radius: 12px; border: 1px solid #151515; margin-top: 20px; text-align: left; line-height: 1.5; box-shadow: inset 0 0 10px #000; }
        .ipi-tag { font-size: 7px; color: #333; margin-top: 15px; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="master-panel">
        <div class="fog-status">✨ STATUS: INVISÍVEL (NEBULOSA V3)</div>
        <div id="radar-cont">
            <div id="radar-led"></div>
            <span id="radar-status" style="font-size: 11px; font-weight: bold; color: var(--neon);">FREQUÊNCIA LIMPA</span>
        </div>
        
        <button class="btn-main" onclick="execMetaX()">EXECUTAR META X</button>
        
        <div id="console-msg">>> S.A. SENTINELA: Aguardando comando...</div>
        <div class="ipi-tag">PROPRIEDADE DA ENGENHARIA S.A. | IPI: 2026-CS</div>
    </div>

    <script>
        let audioCtx;

        // Gerador de Ruído de Hardware (Anti-Rastreio)
        function aplicarBlindagem() {
            localStorage.clear();
            sessionStorage.clear();
            // Injeta elementos fantasmas para quebrar o mapeamento de DOM
            const ghost = document.createElement('div');
            ghost.style.display = 'none';
            ghost.id = Math.random().toString(36).substring(2);
            document.body.appendChild(ghost);
            setTimeout(() => ghost.remove(), 100);
        }

        async function execMetaX() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const log = document.getElementById('console-msg');
            const led = document.getElementById('radar-led');
            
            aplicarBlindagem();
            
            // Simulação de Processamento de Nebulosa
            led.style.background = 'var(--ghost)';
            led.style.boxShadow = '0 0 15px var(--ghost)';
            log.innerHTML = `<div style="color:var(--ghost)">>> DISPERSANDO DADOS...</div>` + log.innerHTML;

            // JITTER HUMANO: Oscilação entre 350ms e 950ms
            const delay = Math.floor(Math.random() * 600) + 350;
            await new Promise(r => setTimeout(r, delay));

            const h = new Date().toLocaleTimeString();
            const rand = Math.random();

            if (rand < 0.25) {
                // PROTOCOLO DE VÁCUO (PULA)
                led.style.background = 'var(--danger)';
                led.style.boxShadow = '0 0 15px var(--danger)';
                log.innerHTML = `<div style="color:var(--danger); font-weight:bold;">[${h}] VÁCUO DETECTADO! PULA.</div>` + log.innerHTML;
                if (navigator.vibrate) navigator.vibrate([400, 100, 400]);
            } else {
                // CÁLCULO DE PROJEÇÃO COM REGRA -50%
                const projecao = (Math.random() * 2.2 + 1.3);
                const alvoFinal = (projecao * 0.5).toFixed(2); // Sua regra de ouro
                
                led.style.background = 'var(--gold)';
                led.style.boxShadow = '0 0 15px var(--gold)';
                log.innerHTML = `<div>[${h}] ENTRA | ALVO: <b style="color:var(--gold)">x${alvoFinal}</b></div>` + log.innerHTML;
                
                // Audio Feedback com variação de pitch (evita padrões de som)
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.setValueAtTime(800 + (Math.random() * 200), audioCtx.currentTime);
                o.connect(g); g.connect(audioCtx.destination);
                g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                o.start(); o.stop(audioCtx.currentTime + 0.3);
                if (navigator.vibrate) navigator.vibrate(100);
            }
            
            // Reset do LED após ação
            setTimeout(() => {
                led.style.background = 'var(--neon)';
                led.style.boxShadow = '0 0 15px var(--neon)';
                document.title = "SISTEMA " + Math.floor(Math.random()*999); // Muda o título da aba
            }, 1000);
        }
    </script>
</body>
</html>
