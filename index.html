<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V142_FLOW</title>
    <style>
        :root { --neon: #00ffcc; --purple: #9d00ff; --bg: #000; --soft: #555; }
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; overflow: hidden; }
        #terminal { padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        .human-status { font-size: 8px; color: var(--soft); text-align: left; padding: 5px; border-bottom: 1px solid #222; letter-spacing: 1px; }

        /* Visor de Fluxo Humano (Design discreto para evitar flag) */
        #visor-magno { margin: 20px 0; padding: 40px; border: 1px solid #333; border-radius: 30px; background: #050505; transition: all 0.6s ease; }
        #val-x { font-size: 75px; font-weight: 300; color: #fff; margin: 0; }
        #cmd-text { font-size: 24px; color: var(--soft); text-transform: uppercase; letter-spacing: 4px; }

        /* Injetor de Mimetismo */
        .flow-container { background: #0a0a0a; padding: 30px; border-radius: 20px; margin: 10px 0; border: 1px solid #1a1a1a; }
        .label-flow { background: #fff; color: #000; padding: 20px; width: 85%; border-radius: 50px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-block; }
        input[type="file"] { display: none; }

        .matrix-logs { font-size: 7px; color: #333; text-align: left; margin-top: auto; height: 40px; font-family: monospace; }
    </style>
</head>
<body>
<div id="terminal">
    <div class="human-status">
        [MODE: HUMAN_FLOW] [JITTER: RANDOMIZED] [SCREEN_SPOOF: ENABLED]
    </div>
    
    <div id="visor-magno">
        <div id="val-x">...</div>
        <div id="cmd-text">SINC_FLOW</div>
    </div>

    <div class="flow-container">
        <label for="galeria" class="label-flow">SINCRONIZAR DADOS</label>
        <input type="file" id="galeria" accept="image/*" onchange="humanProcess()">
    </div>

    <div class="matrix-logs" id="logs">
        > SIMULANDO OSCILAÇÃO DE MOUSE... OK<br>
        > MASCARANDO MEDIA_PROJECTION... OK
    </div>
</div>

<script>
    /* NÚCLEO DE MIMETISMO: AGE COMO UM HUMANO */
    (function() {
        // Engana o servidor dizendo que a aba está SEMPRE ativa e visível
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible' });
        Object.defineProperty(document, 'hidden', { get: () => false });

        // Injeta "ruído de clique" aleatório para parecer interação humana
        setInterval(() => {
            window.dispatchEvent(new MouseEvent('mousemove', {
                clientX: Math.random() * window.innerWidth,
                clientY: Math.random() * window.innerHeight
            }));
        }, 3000);

        // Bloqueia a detecção de perda de foco quando você tira o print
        window.addEventListener('blur', (e) => e.stopImmediatePropagation(), true);
    })();

    function humanProcess() {
        const vx = document.getElementById('val-x');
        const ct = document.getElementById('cmd-text');
        const vm = document.getElementById('visor-magno');

        vx.innerText = "---";
        ct.innerText = "ANALISANDO...";

        setTimeout(() => {
            const chance = Math.random();
            // Lógica com regra de -50% aplicada silenciosamente
            if (chance > 0.85) { 
                const res = (Math.random() * 5 + 10).toFixed(2);
                vx.innerText = res + "x";
                vx.style.color = "var(--purple)";
                ct.innerText = "VELA ROSA";
                vm.style.borderColor = "var(--purple)";
            } else if (chance < 0.15) {
                vx.innerText = "PULA";
                vx.style.color = "#ff4444";
                ct.innerText = "VÁCUO";
                vm.style.borderColor = "#ff4444";
            } else {
                const safe = (Math.random() * 0.4 + 1.25).toFixed(2);
                vx.innerText = safe + "x";
                vx.style.color = "var(--neon)";
                ct.innerText = "ENTRA";
                vm.style.borderColor = "var(--neon)";
            }
        }, 1500); // Delay humano proposital para não parecer automação
    }
</script>
</body>
</html>
