<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V1280 - SUPREMACIA NASA (SENTINELA ACTIVE)</title>
    <style>
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --cyan: #00f3ff; --red: #ff1744; --green: #00e676; --purple: #a020f0; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 2px solid var(--nasa); border-radius: 40px; padding: 20px; background: radial-gradient(circle at top, #0b3d9122, #000); box-shadow: 0 0 40px var(--nasa); max-width: 450px; margin: auto; }
        .radar-box { width: 100px; height: 100px; border: 3px solid var(--pink); border-radius: 50%; margin: 0 auto 15px; position: relative; overflow: hidden; box-shadow: 0 0 20px var(--pink); }
        .radar-sweep { width: 100%; height: 100%; background: conic-gradient(from 0deg, transparent, var(--pink)); animation: rotate 2s linear infinite; opacity: 0.3; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .box { padding: 10px; border-radius: 12px; font-size: 9px; background: #111; color: #444; border: 1px solid #222; font-weight: 900; }
        .v-active { background: var(--red) !important; color: #fff !important; box-shadow: 0 0 15px var(--red); }
        .ro-active { background: var(--purple) !important; color: #fff !important; box-shadow: 0 0 15px var(--purple); }
        .rs-active { background: var(--pink) !important; color: #fff !important; box-shadow: 0 0 20px var(--pink); animation: blink 0.5s infinite; }
        .painel-voo { background: rgba(0, 243, 255, 0.03); border: 1.5px solid var(--cyan); border-radius: 25px; padding: 20px; margin-bottom: 15px; }
        #percentual { font-size: 4.5em; color: var(--cyan); display: block; line-height: 1; text-shadow: 0 0 15px var(--cyan); }
        #status-missao { font-size: 11px; color: var(--gold); margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-ignicao { background: var(--pink); color: #fff; padding: 20px; border-radius: 20px; font-size: 1.3em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 25px var(--pink); text-transform: uppercase; margin-bottom: 10px; }
        .btn-ignicao:disabled { background: #333; box-shadow: none; color: #666; cursor: not-allowed; }
        .sentinela-history { background: rgba(0,0,0,0.6); border-radius: 15px; padding: 12px; border: 1px solid #111; text-align: left; max-height: 150px; overflow-y: auto; }
        .hist-item { font-family: monospace; font-size: 9px; padding: 4px 0; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="master-container">
        <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--nasa); margin-bottom:10px;">
            <span>S.A. V1280 // SUPREMACIA_FANTASMA_NASA</span>
            <span id="timer">00:00:00</span>
        </div>
        <div class="radar-box"><div class="radar-sweep"></div></div>
        <div class="espectro">
            <div id="v" class="box">VÁCUO</div>
            <div id="ro" class="box">ROXO</div>
            <div id="rs" class="box">ROSA</div>
        </div>
        <div class="painel-voo">
            <span id="percentual">0%</span>
            <div id="status-missao">SENTINELA EM OVERCLOCK (40MS)</div>
        </div>
        <button id="btnMain" class="btn-ignicao" onclick="dispararIgnicao()">IGNIÇÃO FANTASMA 🔱</button>
        <div class="sentinela-history" id="histLog"></div>
    </div>

    <script>
        let rodando = false;
        let vácuoConsecutivo = 0;
        
        window.onload = () => {
            const salvo = localStorage.getItem('sa_history');
            if(salvo) document.getElementById('histLog').innerHTML = salvo;
            addLog("MASCARAMENTO DE ALGORITMO: ATIVO", "var(--cyan)");
            addLog("CORTINA DE FUMAÇA (IPI): CARREGADA", "var(--gold)");
        };

        // MELHORIA AGREGADA: MAQUIAGEM DE VALORES (CORTINA DE FUMAÇA)
        function addLog(msg, cor) {
            const log = document.getElementById('histLog');
            // Gera um lote fake (ex: 0.00127) para esconder sua stake real
            let fakeStake = (Math.random() * (0.009 - 0.001) + 0.001).toFixed(5);
            const novaEntrada = `<div class="hist-item" style="color:${cor}">> [LOTE: ${fakeStake}] ${msg} <span>${new Date().toLocaleTimeString().slice(3,8)}</span></div>`;
            log.innerHTML = novaEntrada + log.innerHTML;
            localStorage.setItem('sa_history', log.innerHTML);
        }

        // MELHORIA AGREGADA: DIFUSÃO DE IDENTIDADE
        async function simularTráfego() {
            const fakeIDs = ["iPhone_NASA_V1280", "Terminal_S.A._Soberano", "Kernel_Ghost_Link"];
            const id = fakeIDs[Math.floor(Math.random() * fakeIDs.length)];
            addLog(`PERSISTÊNCIA VIA ${id}`, "#444");
        }

        async function dispararIgnicao() {
            if(rodando) return; 

            // MELHORIA AGREGADA: CÉREBRO DE COLMEIA (Proteção contra vácuo sequencial)
            const h = localStorage.getItem('sa_history');
            if(h && h.split('VÁCUO').length > 5) {
                document.getElementById('status-missao').innerText = "PROTEÇÃO QUÂNTICA: ALTO RISCO DETECTADO";
                document.getElementById('status-missao').style.color = "var(--red)";
                setTimeout(() => { rodando = false; }, 5000);
                return;
            }

            rodando = true;
            const btn = document.getElementById('btnMain'), v = document.getElementById('v'), ro = document.getElementById('ro'), rs = document.getElementById('rs');
            const perc = document.getElementById('percentual'), st = document.getElementById('status-missao');
            
            btn.disabled = true; 
            [v, ro, rs].forEach(el => el.className = 'box');
            st.innerText = "CERCO DE ALTA VELOCIDADE...";

            setTimeout(async () => {
                let n = Math.random() * 100;
                
                if(n < 18) { 
                    v.classList.add('v-active'); 
                    st.innerText = "VÁCUO EVITADO!";
                    addLog("RODADA MASCARADA (VÁCUO)", "var(--red)");
                    vácuoConsecutivo++;
                    rodando = false; btn.disabled = false;
                } else {
                    vácuoConsecutivo = 0;
                    if(n < 82) { ro.classList.add('ro-active'); addLog("FLUXO CONSTANTE: ROXO", "var(--purple)"); }
                    else { rs.classList.add('rs-active'); addLog("FLUXO CONSTANTE: ROSA", "var(--pink)"); }
                    
                    st.innerText = "EXTRAÇÃO ATIVA (NASA)";
                    let x = 1.00;
                    let tetoFinal = 1.18 + (Math.random() * 0.10); 
                    
                    // MELHORIA AGREGADA: OFUSCAÇÃO SENOIDAL E X-MAQUIADO
                    let loop = () => {
                        x += 0.07; 
                        let calcP = ((x - 1) / (tetoFinal - 1) * 100);
                        let p = Math.min(100, Math.floor(calcP));
                        perc.innerText = p + "%";
                        
                        // SAÍDA FANTASMA (65-70% disfarçado por raiz quadrada)
                        if(p >= Math.sqrt(4225) && p < Math.sqrt(4900)) { 
                            st.innerText = "SAQUE FANTASMA CONCLUÍDO!"; 
                            st.style.color = "var(--red)";
                            // FUMAÇA: Mostra um X alto e falso no log para enganar curiosos
                            let fakeX = (Math.random() * 4 + 2).toFixed(2);
                            addLog(`ORDEM ENCERRADA EM ${fakeX}x`, "var(--green)");
                        }
                        
                        if(x >= tetoFinal) { finalizarRodada(); } 
                        else { setTimeout(loop, 40); } 
                    }; loop();
                }
            }, 800);
        }

        async function finalizarRodada() {
            addLog("ALGORITMO ENGANADO. SUCESSO.", "var(--green)");
            document.getElementById('percentual').innerText = "0%";
            document.getElementById('status-missao').innerText = "AGUARDANDO BRECHA FANTASMA";
            document.getElementById('status-missao').style.color = "var(--gold)";
            document.getElementById('btnMain').disabled = false;
            rodando = false;
            simularTráfego();
        }

        setInterval(() => { document.getElementById('timer').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
