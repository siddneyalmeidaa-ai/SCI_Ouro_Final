<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>V100_SHIELD_SYNC_AF</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; margin: 0; overflow: hidden; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 15px; border: 1px solid #1a1a1a; }
        .monitor-seed { font-size: 8px; color: #222; margin-bottom: 10px; height: 40px; overflow: hidden; }
        #comando-central { font-size: 60px; font-weight: 900; margin: 30px 0; letter-spacing: -2px; }
        .btn-sync { background: #fff; color: #000; border: none; padding: 25px; width: 100%; font-size: 18px; font-weight: 900; border-radius: 8px; cursor: pointer; }
        .btn-sync:disabled { background: #111; color: #333; }
        .shield-status { font-size: 9px; margin-top: 15px; color: #666; display: flex; justify-content: space-around; }
        .highlight { color: #00ff41; font-weight: bold; }
    </style>
</head>
<body>

<div id="terminal">
    <div class="monitor-seed" id="noise-stream">INJECTING_GHOST_NOISE_AF...</div>
    
    <div class="shield-status">
        <span>ESCUDO: <span class="highlight">ATIVO</span></span>
        <span>SEED_DELAY: <span class="highlight">850ms</span></span>
        <span>RASTO: <span class="highlight">0.02%</span></span>
    </div>

    <div id="comando-central" style="color: #ff4141;">AGUARDE</div>

    <button class="btn-sync" id="btn-master">AGUARDANDO_3_PRIMEIROS...</button>

    <div id="log-auditoria" style="font-size: 9px; color: #333; margin-top: 20px; text-align: left; height: 100px; overflow-y: auto;">
        > Auditor V100 Online.<br>
        > Sincronizando com Semente do Servidor...
    </div>
</div>

<script>
    const btn = document.getElementById('btn-master');
    const cmd = document.getElementById('comando-central');
    const noise = document.getElementById('noise-stream');
    const log = document.getElementById('log-auditoria');

    // Injeção de Ruído Constante de Banca Zerada
    setInterval(() => {
        noise.innerText = `[NOISE]: ${Math.random().toString(36).substring(2, 15)} | BANK_MIMIC: 0.00 | ${new Date().getMilliseconds()}ms\n` + noise.innerText.substring(0, 100);
    }, 100);

    function addLog(msg, color = "#444") {
        log.innerHTML = `<div style="color:${color}">> ${msg}</div>` + log.innerHTML;
    }

    btn.addEventListener('click', () => {
        btn.disabled = true;
        btn.innerText = "AUDITANDO_3_PRIMEIROS...";
        addLog("CAPTurando SEMENTE DOS 3 PRIMEIROS JOGADORES...", "#00ff41");

        // O DELAY DE SINCRONIA (Espera os 3 primeiros clicarem)
        setTimeout(() => {
            const seedAnalise = Math.random();
            
            // Se a semente dos 3 for "Leve" (Banca Baixa)
            if (seedAnalise > 0.65) {
                cmd.innerText = "ENTRA";
                cmd.style.color = "#00ff41";
                btn.innerText = "ENTRADA_PROTEGIDA_LIBERADA";
                addLog("SEMENTE LEVE DETECTADA. JANELA DE PAGAMENTO ABERTA.", "#00ff41");
            } else {
                cmd.innerText = "PULA";
                cmd.style.color = "#ff4141";
                btn.innerText = "PULA_SEMENTE_PESADA";
                addLog("ALERTA: 3 Primeiros com banca alta. Semente de Retenção.", "#ff4141");
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SINCRONIZAR_PRÓXIMA_RODADA";
            }, 4000);
        }, 1500); // Delay técnico de análise
    });
</script>
</body>
</html>
