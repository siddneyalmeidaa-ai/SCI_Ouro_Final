<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL S.A. V160 - SNIPER</title>
    <style>
        :root { --gold: #D4AF37; --dark: #0a0a0a; --purple: #6200ea; --red: #ff1744; --green: #00e676; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; }
        .card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 12px; text-align: center; }
        .gold-text { color: var(--gold); font-weight: bold; }
        
        /* Painel de Vulnerabilidade - O Coração da V160 */
        #painelVulnerabilidade {
            font-size: 1.2em;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #333;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .v-alta { background: rgba(0, 230, 118, 0.2); border-color: var(--green) !important; color: var(--green); }
        .v-baixa { background: rgba(255, 23, 68, 0.2); border-color: var(--red) !important; color: var(--red); }
        
        .btn-status { font-size: 1.5em; font-weight: bold; text-transform: uppercase; margin: 10px 0; }
        .lucro-moldado { font-size: 1.8em; cursor: pointer; margin: 10px 0; }
    </style>
</head>
<body>

    <div style="text-align:center; border-bottom: 2px solid var(--gold); padding-bottom:10px;">
        <span class="gold-text">S.A. V160 - SNIPER MODE</span><br>
        <small id="relogio">--:--:--</small>
    </div>

    <div class="card" style="margin-top: 15px;">
        <div class="gold-text" style="font-size: 12px; margin-bottom: 10px;">EXPOSIÇÃO DO SERVIDOR (PAGAMENTO)</div>
        <div id="painelVulnerabilidade">ANALISANDO BRECHA...</div>
        <div id="statusTexto" style="margin-top: 10px; font-weight: bold;">--</div>
    </div>

    <div class="card">
        <div class="gold-text">AÇÃO IMEDIATA</div>
        <div id="comandoAcao" class="btn-status">---</div>
        <div>STAKE RECOMENDADA: <span id="stakeRecomendada" class="gold-text">---</span></div>
    </div>

    <div class="card">
        <div class="gold-text">LUCRO MOLDADO (-50%)</div>
        <div class="lucro-moldado" id="displayLucro" onclick="toggleMargem()">R$ 2.740,00</div>
        <small>IPI: 2026-V160-SNIPER | SEMENTE: <span id="seed">--</span></small>
    </div>

    <script>
        let margemAtiva = true;

        function scannerVulnerabilidade() {
            const painel = document.getElementById('painelVulnerabilidade');
            const texto = document.getElementById('statusTexto');
            const comando = document.getElementById('comandoAcao');
            const stake = document.getElementById('stakeRecomendada');
            const seed = document.getElementById('seed');

            // Simulação de leitura de fluxo de saída do servidor
            let vulnerabilidade = Math.random() * 100;
            seed.innerText = "SA-" + Math.random().toString(36).toUpperCase().substring(2, 8);

            if (vulnerabilidade > 80) {
                // SERVIDOR PAGANDO
                painel.innerText = vulnerabilidade.toFixed(2) + "% - VULNERÁVEL";
                painel.className = "v-alta";
                texto.innerText = "⚠️ SERVIDOR EXPOSTO: PODE IR AGORA!";
                comando.innerText = "ENTRA";
                comando.style.color = "#00e676";
                stake.innerText = "R$ 1,00"; // Aumenta stake na vulnerabilidade alta
            } else if (vulnerabilidade < 30) {
                // SERVIDOR RETENDO
                painel.innerText = vulnerabilidade.toFixed(2) + "% - BLINDADO";
                painel.className = "v-baixa";
                texto.innerText = "⛔ BLOQUEIO: SERVIDOR RETENDO.";
                comando.innerText = "PULA";
                comando.style.color = "#ff1744";
                stake.innerText = "R$ 0,00";
            } else {
                // MODO SEGURO
                painel.innerText = vulnerabilidade.toFixed(2) + "% - ESTÁVEL";
                painel.className = "";
                texto.innerText = "BUSCANDO BRECHA DE LIQUIDEZ...";
                comando.innerText = "AGUARDE";
                comando.style.color = "#D4AF37";
                stake.innerText = "0,20 (TESTE)";
            }
        }

        function toggleMargem() {
            const d = document.getElementById('displayLucro');
            d.innerText = margemAtiva ? "R$ 5.480,00" : "R$ 2.740,00";
            margemAtiva = !margemAtiva;
        }

        // Execução Ultra-Rápida (500ms)
        setInterval(scannerVulnerabilidade, 500);
        setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
