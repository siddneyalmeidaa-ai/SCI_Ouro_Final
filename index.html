<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. V165 - ECOSSISTEMA SNIPER</title>
    <style>
        :root { --gold: #D4AF37; --dark: #0a0a0a; --red: #ff1744; --green: #00e676; --purple: #6200ea; }
        body { background: var(--dark); color: white; font-family: sans-serif; padding: 15px; margin: 0; text-align: center; }
        .card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .gold-text { color: var(--gold); font-weight: bold; }
        
        #displayX { font-size: 4em; font-weight: bold; color: var(--gold); margin: 5px 0; transition: 0.1s; }
        
        .container-barra { background: #222; border-radius: 20px; height: 45px; width: 100%; margin: 15px 0; border: 2px solid #444; position: relative; overflow: hidden; }
        #barraLive { height: 100%; width: 0%; background: var(--green); transition: width 0.1s linear; }
        #targetX { position: absolute; right: 30%; top: 0; height: 100%; width: 4px; background: rgba(255,255,255,0.7); z-index: 5; box-shadow: 0 0 10px white; }

        .btn-acao { background: var(--purple); color: white; padding: 22px; border-radius: 15px; font-size: 1.4em; font-weight: bold; cursor: pointer; border: none; width: 100%; box-shadow: 0 5px 15px rgba(98, 0, 234, 0.4); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #333; padding: 10px; }
        th { background: #1a237e; }
        .status-alert { font-size: 1.5em; font-weight: bold; margin: 10px 0; min-height: 35px; }
    </style>
</head>
<body>

    <div style="border-bottom: 2px solid var(--gold); padding-bottom:10px; margin-bottom: 15px;">
        <span class="gold-text">S.A. V165 - ECOSSISTEMA ATIVO</span><br>
        <small id="relogio">--:--:--</small>
    </div>

    <div class="card">
        <div class="gold-text" style="font-size: 11px;">PRESSÃO DO SERVIDOR VS X ATUAL</div>
        <div id="displayX">1.00x</div>
        
        <div class="container-barra">
            <div id="targetX"></div> <div id="barraLive"></div>
        </div>
        
        <div id="statusVoo" class="status-alert">SISTEMA PRONTO</div>
        <button class="btn-acao" onclick="ativarEcossistema()">DECOLAR SCANNER 🚀</button>
    </div>

    <div class="card">
        <div class="gold-text">TABELA DA FAVELINHA (LIVE)</div>
        <table>
            <thead>
                <tr><th>ALVO X</th><th>AÇÃO</th><th>RISCO</th></tr>
            </thead>
            <tbody>
                <tr>
                    <td id="favAlvo" class="gold-text">---</td>
                    <td id="favAcao">AGUARDANDO</td>
                    <td id="favRisco">---</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div style="font-size: 10px; color: #444; margin-top: 20px;">
        IPI: 2026-V165-ECO | SEMENTE: <span id="seed">--</span>
    </div>

    <script>
        let emExecucao = false;

        function ativarEcossistema() {
            if(emExecucao) return;
            emExecucao = true;

            const displayX = document.getElementById('displayX');
            const barra = document.getElementById('barraLive');
            const status = document.getElementById('statusVoo');
            const favAlvo = document.getElementById('favAlvo');
            const favAcao = document.getElementById('favAcao');
            const favRisco = document.getElementById('favRisco');
            const seed = document.getElementById('seed');

            let x = 1.00;
            let crashPoint = 1.3 + (Math.random() * 5); // Onde o servidor quebra
            let alvoSeguro = (crashPoint * 0.5).toFixed(2); // Sua regra de -50%
            
            favAlvo.innerText = alvoSeguro + "x";
            favAcao.innerText = "ENTRA AGORA";
            favAcao.style.color = "#00e676";
            favRisco.innerText = "BAIXO";
            status.innerText = "SCANNER EM CURSO...";
            status.style.color = "white";
            seed.innerText = "SA-" + Math.random().toString(36).toUpperCase().substring(2, 9);

            let loop = setInterval(() => {
                x += 0.05;
                displayX.innerText = x.toFixed(2) + "x";
                
                let progresso = (x / crashPoint) * 100;
                barra.style.width = progresso + "%";

                // INTERAÇÃO DO ECOSSISTEMA: Alerta de Saída
                if (x >= alvoSeguro) {
                    barra.style.backgroundColor = "#ff1744";
                    status.innerText = "SAIR NO " + x.toFixed(2) + "x! 🚨";
                    status.style.color = "#ff1744";
                    favAcao.innerText = "SAIR IMEDIATO";
                    favAcao.style.color = "red";
                }

                if (x >= crashPoint) {
                    clearInterval(loop);
                    displayX.style.color = "red";
                    status.innerText = "VÁCUO NO " + x.toFixed(2) + "x";
                    favAcao.innerText = "PULA / LIMPA";
                    favRisco.innerText = "MÁXIMO";
                    emExecucao = false;

                    setTimeout(() => {
                        displayX.style.color = var(--gold);
                        displayX.innerText = "1.00x";
                        barra.style.width = "0%";
                        barra.style.backgroundColor = var(--green);
                        status.innerText = "PRONTO PARA SCANNER";
                        status.style.color = "white";
                    }, 3000);
                }
            }, 80);
        }

        setInterval(() => { document.getElementById('relogio').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
