<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V200_SHADOW_SHIELD</title>
    <style>
        :root { --c1: #00ffcc; --c2: #9d00ff; --d: #ff0055; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; color: #fff; }
        
        /* Interface Fantasma Adaptativa (Gaia) */
        .sh-h { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 9999; backdrop-filter: blur(20px); border-bottom: 1px solid #1a1a1a; transition: height 0.3s; }
        .v-out { font-size: 44px; font-weight: 900; color: var(--c1); letter-spacing: -2px; }
        .btn-ui { background: #fff; color: #000; border: none; padding: 14px 24px; border-radius: 2px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        
        #n-logs { position: fixed; top: 97px; width: 100%; text-align: center; font-size: 6px; color: #333; font-family: monospace; }
        
        /* Proteção Visual contra Monitoramento [cite: 2026-01-23] */
        .anti-spy { filter: blur(15px) grayscale(1); opacity: 0.3; }
    </style>
</head>
<body>

<div id="wrapper" class="sh-h">
    <div>
        <div id="display" class="v-out">SHADOW_LOAD</div>
        <div id="status" style="font-size: 7px; color: #ffd700; text-transform: uppercase; letter-spacing: 1px;">S5_PERSISTENCE: ON</div>
    </div>
    <label for="f-in" class="btn-ui">SYNC_S5</label>
    <input type="file" id="f-in" accept="image/*" onchange="igniteShadow()">
</div>

<div id="n-logs">ATHENA_OSC | HERA_IP_BLOCK | PANDORA_NOISE | CHRONOS_FATIGUE</div>

<script>
    /* 1. BLOQUEIO DE INVASÃO DE ÁUDIO (MATA O SOM DO MONITOR) [cite: 2026-01-27] */
    const killAudioSpy = () => {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            ctx.suspend(); 
        } catch(e) {}
    };

    /* 2. MOTOR DE ENTROPIA E CANVASS SPOOFING (PANDORA) */
    const getS5Entropy = () => {
        const a = new Uint32Array(1);
        window.crypto.getRandomValues(a);
        return a[0] / 4294967296;
    };

    let globalRounds = parseInt(localStorage.getItem('s5_rounds')) || 0;

    (function obfuscateDOM() {
        const ids = ['wrapper', 'display', 'status'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if(el) el.id = 'z_' + Math.floor(getS5Entropy() * 888888);
        });
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "rgba(255,255,255,0.01)";
        ctx.fillRect(getS5Entropy()*10, getS5Entropy()*10, 1, 1);
    })();

    function igniteShadow() {
        killAudioSpy(); // Mata o monitoramento de áudio ao iniciar [cite: 2026-01-27]
        
        const wrap = document.querySelector('.sh-h');
        const d = document.querySelector('.v-out');
        const s = document.querySelector('div[style*="color: #ffd700"]');
        
        // Ativa blindagem visual momentânea [cite: 2026-01-23]
        wrap.classList.add('anti-spy');
        d.innerText = "---"; d.style.color = "#111";
        s.innerText = "CHRONOS: PROCESSANDO FADIGA...";

        const fatigueLevel = Math.min(globalRounds * 85, 2200); 
        const delay = (getS5Entropy() * 1800) + 2400 + fatigueLevel;

        setTimeout(() => {
            const seed = getS5Entropy();
            const focusLoss = getS5Entropy();

            wrap.classList.remove('anti-spy');

            if (focusLoss < 0.14) {
                d.innerText = "PULA"; d.style.color = "var(--d)";
                s.innerText = "SELENE: DISTRAÇÃO DETECTADA";
            } else if (seed > 0.94) {
                d.innerText = (getS5Entropy() * 5 + 7.8).toFixed(2) + "x";
                d.style.color = "var(--c2)"; s.innerText = "ATHENA: VELA_ROSA";
            } else if (seed < 0.22) {
                d.innerText = "PULA"; d.style.color = "var(--d)";
                s.innerText = "NYX: VÁCUO_SHIELD";
            } else {
                const targets = [1.25, 1.42, 1.88, 2.08, 1.34];
                const goal = targets[Math.floor(getS5Entropy() * targets.length)];
                d.innerText = (goal + (getS5Entropy() * 0.1)).toFixed(2) + "x";
                d.style.color = goal > 2 ? "var(--c2)" : "var(--c1)";
                s.innerText = "S5: MIMETISMO_ATIVO";
            }

            globalRounds++;
            localStorage.setItem('s5_rounds', globalRounds);
            wrap.style.height = (Math.floor(getS5Entropy() * 6) + 92) + 'px';
            console.clear(); // Limpa rastros para o servidor não ler o log [cite: 2026-01-23]
        }, delay);
    }
</script>
</body>
</html>
