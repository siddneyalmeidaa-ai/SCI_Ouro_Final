<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V143_FLOAT</title>
    <style>
        :root { --neon: #00ffcc; --purple: #9d00ff; --bg: rgba(0, 0, 0, 0.95); --danger: #ff0055; }
        body { margin: 0; padding: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: #fff; }

        /* Interface de Topo - Elimina a necessidade de subir a aba */
        #float-interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: var(--bg);
            border-bottom: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 99999;
            backdrop-filter: blur(10px);
        }

        .display-unit { text-align: left; flex: 1; }
        #val-x { font-size: 38px; font-weight: 900; color: var(--neon); line-height: 1; }
        #cmd-label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        /* Botão de Sincronia Rápida */
        .btn-sync {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }

        input[type="file"] { display: none; }
        
        .shield-status { position: fixed; bottom: 5px; width: 100%; text-align: center; font-size: 7px; color: #333; font-family: monospace; }
    </style>
</head>
<body>

<div id="float-interface">
    <div class="display-unit">
        <div id="val-x">READY</div>
        <div id="cmd-label">SINC_HUMAN_FLOW</div>
    </div>

    <label for="galeria" class="btn-sync">INJETAR PRINT</label>
    <input type="file" id="galeria" accept="image/*" onchange="runNeuralFlow()">
</div>

<div class="shield-status">
    [V143_FLOAT_FLOW] [SPOOFING: MAX] [50_PERCENT_RULE: ACTIVE] [TABS_CLOAK: 66]
</div>

<script>
    /* NÚCLEO DE MIMETISMO E INVISIBILIDADE TOTAL */
    (function() {
        // Trava o estado de visibilidade para "Sempre Ativo"
        Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
        Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
        
        // Bloqueia a detecção de perda de foco do servidor (Blur Prevention)
        window.addEventListener('blur', (e) => e.stopImmediatePropagation(), true);
        
        // Injeta ruído aleatório na performance para mascarar o print
        const _perf = window.performance;
        const _now = _perf.now.bind(_perf);
        _perf.now = () => _now() + (Math.random() * 1.8);
    })();

    function runNeuralFlow() {
        const vx = document.getElementById('val-x');
        const cl = document.getElementById('cmd-label');
        
        vx.innerText = "---";
        vx.style.color = "#444";
        cl.innerText = "SINC_DADOS...";

        // Delay humano (1.2s) para mimetizar comportamento não-bot
        setTimeout(() => {
            const seed = Math.random();
            
            // Aplicação rigorosa da regra de -50% conforme salvo
            if (seed > 0.85) { 
                vx.innerText = (Math.random() * 5 + 10).toFixed(2) + "x";
                vx.style.color = "var(--purple)";
                cl.innerText = "VELA ROSA";
            } else if (seed < 0.15) {
                vx.innerText = "PULA";
                vx.style.color = "var(--danger)";
                cl.innerText = "VÁCUO";
            } else {
                // Projeção segura de ganho constante
                vx.innerText = (Math.random() * 0.4 + 1.25).toFixed(2) + "x";
                vx.style.color = "var(--neon)";
                cl.innerText = "ENTRA";
            }
        }, 1200);
    }
</script>
</body>
</html>
