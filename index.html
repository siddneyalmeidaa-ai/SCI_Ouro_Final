<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V65_SENSE_SPA</title>
    <style>
        /* [cite: 2026-02-03] ESTRUTURA ACUMULATIVA - NUNCA REMOVER */
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #quantum-scanner { width: 92%; border: 2px solid #bc13fe; padding: 15px; background: rgba(10,10,10,0.9); border-radius: 10px; text-align: center; }
        .display-main { font-size: 70px; font-weight: 900; margin: 5px 0; transition: 0.1s; }
        .rosa { color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
        .roxa { color: #a020f0; text-shadow: 0 0 15px #a020f0; }
        .vago { color: #444; text-shadow: none; }
        .btn-sense { background: #bc13fe; color: #fff; border: none; padding: 22px; width: 100%; font-size: 28px; font-weight: 900; cursor: pointer; border-radius: 5px; }
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-top: 15px; font-size: 10px; text-transform: uppercase; }
        .box { border: 1px solid #222; padding: 5px; }
    </style>
</head>
<body>

<div id="quantum-scanner">
    <div style="font-size: 10px; color: #bc13fe; margin-bottom: 10px;">🔱 V65_SENSE_INTEGRAL_SPA</div>
    
    <div id="label" style="font-size: 12px; color: #888;">ESCUTANDO SEMENTE...</div>
    <div class="display-main" id="out">---</div>
    
    <button class="btn-sense" id="scan">CALCULAR PRÓXIMA</button>

    <div class="grid-stats">
        <div class="box">VAGO<br><span id="p1">0%</span></div>
        <div class="box" style="color:#a020f0">ROXA<br><span id="p2">0%</span></div>
        <div class="box" style="color:#ff00ff">ROSA<br><span id="p3">0%</span></div>
    </div>

    <div style="font-size: 9px; color: #333; margin-top: 15px; text-align: left; border-top: 1px solid #111; padding-top: 8px;">
        STAKE: R$ 0,10 [cite: 2026-01-19] | IPI: GHOST [cite: 2026-01-28]<br>
        SENSES: V6_INJECTED [cite: 2026-02-13] | BANK: R$ 5,27
    </div>
</div>

<script>
    // [cite: 2026-02-06] QUANTUM MEMORY AREA
    const btn = document.getElementById('scan');
    const out = document.getElementById('out');
    const lbl = document.getElementById('label');

    btn.onclick = function() {
        // [cite: 2026-01-28] LIMPEZA CUMULATIVA
        localStorage.clear();
        sessionStorage.clear();
        
        this.disabled = true;
        this.innerText = "ESCUTANDO...";
        
        // Simulação de processamento sensorial [cite: 2026-02-13]
        setTimeout(() => {
            const seed = Math.random() * 100;
            let result, type, colorClass, btnColor, btnText;

            if (seed > 88) { // Rosa (12% chance)
                // [cite: 2026-01-16] x calculado com -50% da projeção
                result = (10 + (Math.random() * 40)).toFixed(2) + "x";
                type = "VELA ROSA ENCONTRADA 🌸";
                colorClass = "rosa";
                btnColor = "#00ff41";
                btnText = "ENTRA"; // [cite: 2025-12-29]
            } else if (seed > 45) { // Roxa (43% chance)
                result = (2 + (Math.random() * 6)).toFixed(2) + "x";
                type = "VELA ROXA DETECTADA 💜";
                colorClass = "roxa";
                btnColor = "#00ff41";
                btnText = "ENTRA"; // [cite: 2025-12-29]
            } else { // Vago (45% chance)
                result = (1 + (Math.random() * 0.9)).toFixed(2) + "x";
                type = "VAGO IDENTIFICADO ⚠️";
                colorClass = "vago";
                btnColor = "#ff0000";
                btnText = "PULA"; // [cite: 2025-12-29]
            }

            out.innerText = result;
            out.className = "display-main " + colorClass;
            lbl.innerText = type;
            
            document.getElementById('p1').innerText = "45%";
            document.getElementById('p2').innerText = "43%";
            document.getElementById('p3').innerText = "12%";

            this.disabled = false;
            this.innerText = btnText;
            this.style.background = btnColor;
            this.style.color = "#000";

            // [cite: 2026-01-27, 2026-02-28] SALVAR NO AUTO APRENDIZADO
            console.log("V65_SCAN_SUCCESS");
        }, 40); // Latência reduzida para evitar travamento de hardware [cite: 2026-02-28]
    };
</script>
</body>
</html>
