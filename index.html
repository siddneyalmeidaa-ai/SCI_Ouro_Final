<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NASA SUPREMACY // FINAL RECOVERY</title>
    <style>
        :root { --dark: #000; --gold: #D4AF37; --pink: #ff00ff; --nasa: #0b3d91; --cyan: #00f3ff; --red: #ff1744; --green: #00e676; }
        body { background: var(--dark); color: white; font-family: 'Arial Black', sans-serif; margin: 0; padding: 10px; text-align: center; }
        .master-container { border: 3px solid var(--nasa); border-radius: 40px; padding: 20px; background: radial-gradient(circle at top, #0b3d9144, #000); box-shadow: 0 0 60px var(--nasa); max-width: 420px; margin: auto; }
        
        .espectro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; }
        .box { padding: 12px; border-radius: 12px; font-size: 9px; background: #111; color: #666; border: 1.5px solid #222; font-weight: 900; cursor: pointer; }
        .v-active { background: var(--red) !important; color: white !important; box-shadow: 0 0 15px var(--red); }
        .ro-active { background: #6a0dad !important; color: white !important; box-shadow: 0 0 15px #6a0dad; }
        .rs-active { background: var(--pink) !important; color: white !important; box-shadow: 0 0 15px var(--pink); }

        .painel-voo { border: 2px solid var(--cyan); border-radius: 25px; padding: 25px; background: rgba(0, 243, 255, 0.05); }
        #percentual { font-size: 6em; color: var(--cyan); display: block; line-height: 1; text-shadow: 0 0 30px var(--cyan); }
        
        .btn-ignicao { background: var(--pink); color: #fff; padding: 20px; border-radius: 25px; font-size: 1.5em; font-weight: 900; width: 100%; border: none; cursor: pointer; box-shadow: 0 0 40px var(--pink); margin-top: 15px; }

        .diag-box { background: #050505; border: 1.5px solid var(--gold); border-radius: 20px; padding: 15px; margin-top: 15px; text-align: left; font-size: 10px; }
        .btn-emergency { background: var(--red); color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; margin-top: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="master-container">
        <div style="font-size:10px; color:var(--nasa); margin-bottom:10px;">NASA SUPREMACY // V1800_RAW</div>

        <div class="espectro">
            <div id="v" class="box" onclick="setMode('v')">VÁCUO</div>
            <div id="ro" class="box" onclick="setMode('ro')">ROXO</div>
            <div id="rs" class="box rs-active" onclick="setMode('rs')">ROSA</div>
        </div>

        <div class="painel-voo">
            <span id="percentual">0%</span>
            <div id="st" style="color:var(--gold); font-size:10px;">SISTEMA ONLINE</div>
        </div>

        <button class="btn-ignicao" onclick="atacar()">IGNIÇÃO NASA 🔱</button>

        <div class="diag-box">
            <b style="color:var(--gold)">DIAGNÓSTICO:</b> <span id="diag" style="color:var(--green)">100% LIBERADO</span><br>
            <b style="color:var(--cyan)">PROGNÓSTICO:</b> SAQUE 1.25x (MOTOR 2ms)<br>
            <button class="btn-emergency" onclick="resetForced()">RESET FORÇADO DE SESSÃO</button>
        </div>
    </div>

    <script>
        let r = false;
        function setMode(m){
            document.querySelectorAll('.box').forEach(b => b.className = 'box');
            document.getElementById(m).className = 'box ' + m + '-active';
        }
        function resetForced() {
            window.location.reload(); // Única forma de quebrar o congelamento de buffer do servidor
        }
        async function atacar() {
            if(r) return; r = true;
            const p = document.getElementById('percentual'), s = document.getElementById('st');
            s.innerText = "ESTRAÇALHANDO LATÊNCIA...";
            let x = 1.00;
            let loop = () => {
                x += 0.28; // MOTOR MÁXIMO (2ms)
                let pct = ((x - 1) / (1.20 - 1) * 100);
                if(pct > 100) pct = 100;
                p.innerText = Math.floor(pct) + "%";
                if(x >= 1.25) {
                    p.innerText = "0%"; s.innerText = "EXTRAÇÃO SUCESSO!";
                    r = false;
                } else { setTimeout(loop, 2); }
            }; loop();
        }
    </script>
</body>
</html>
