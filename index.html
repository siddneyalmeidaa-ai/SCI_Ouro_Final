<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A._V106_FORCE_EVO</title>
    <style>
        body { background: #000; color: #00ff41; font-family: monospace; text-align: center; margin: 0; overflow: hidden; }
        #terminal { height: 100vh; display: flex; flex-direction: column; padding: 15px; }
        .evo-status { font-size: 9px; color: #0044ff; border-bottom: 1px solid #111; padding: 5px; text-align: left; }
        #visor-magno { margin: 20px 0; padding: 30px; border: 2px solid #0044ff; border-radius: 20px; background: rgba(0, 68, 255, 0.05); box-shadow: 0 0 25px rgba(0, 68, 255, 0.3); }
        #val-x { font-size: 70px; font-weight: 900; color: #fff; text-shadow: 0 0 15px #0044ff; }
        #cmd-text { font-size: 48px; font-weight: 900; margin-bottom: 25px; }
        .btn-evo { background: #fff !important; color: #000 !important; padding: 30px; width: 100%; font-size: 22px; font-weight: 900; border-radius: 15px; border: none; box-shadow: 0 8px 0 #999; }
        .btn-evo:active { transform: translateY(4px); box-shadow: 0 2px 0 #666; background: #00ff41 !important; }
    </style>
</head>
<body>
<div id="terminal">
    <div class="evo-status" id="monitor">EVOLUÇÃO ATIVA: CICLO DE RETENÇÃO DETECTADO</div>
    <div id="visor-magno">
        <span style="font-size:11px; color:#0044ff; font-weight:bold;">ALVO EVOLUTIVO V106</span>
        <div id="val-x">0.00x</div>
    </div>
    <div id="cmd-text">AGUARDE</div>
    <button class="btn-evo" id="btn" ontouchstart="sincronizarEvolucao()">SINCRONIZAR_BALDE</button>
</div>

<script>
    const monitor = document.getElementById('monitor');
    const valX = document.getElementById('val-x');
    const cmdText = document.getElementById('cmd-text');
    const btn = document.getElementById('btn');

    function sincronizarEvolucao() {
        if(btn.disabled) return;
        btn.disabled = true;
        btn.innerText = "MUDANDO ASSINATURA...";

        // Simulação de quebra de rastro por latência variável
        const jitter = Math.floor(Math.random() * 1500 + 800);

        setTimeout(() => {
            const seed = Math.random();
            // Após o corte de 1.17x, forçamos alvos de segurança extrema
            let target = (Math.random() * 0.08 + 1.04).toFixed(2);

            if (seed > 0.68) { // Filtro mais rigoroso
                cmdText.innerText = "ENTRA";
                cmdText.style.color = "#00ff41";
                valX.innerText = target + "x";
                valX.style.color = "#00ff41";
            } else {
                cmdText.innerText = "PULA";
                cmdText.style.color = "#ff4141";
                valX.innerText = "0.00x";
            }

            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SINCRONIZAR_BALDE";
                cmdText.innerText = "AGUARDE";
                cmdText.style.color = "#fff";
            }, 7000); // Resfriamento aumentado para 7s para "esquecer" seu ID
        }, jitter);
    }
</script>
</body>
</html>
