<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S.A._V87_EXPLOSAO_DE_NUCLEO</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: #000; color: #d0d0d0; font-family: 'Courier New', monospace; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #main-shell { flex: 1; display: flex; flex-direction: column; padding: 15px; border: 4px solid #111; position: relative; background: radial-gradient(circle at center, #050a1a 0%, #000 100%); }
        
        .sa-header { border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; font-size: 10px; color: #444; }
        
        /* PAINEL DE CICLO NOVO */
        .core-panel { background: rgba(0, 255, 255, 0.05); border: 1px solid #111; padding: 10px; margin-bottom: 10px; border-radius: 4px; border-left: 3px solid #00ffff; }
        .core-row { display: flex; justify-content: space-between; font-size: 8px; margin-bottom: 3px; }
        .core-label { color: #446; }
        .core-val { color: #00ffff; font-weight: bold; text-transform: uppercase; }

        .quantum-display { background: #020202; border: 2px solid #1a1a1a; padding: 25px 10px; text-align: center; border-radius: 4px; position: relative; overflow: hidden; }
        .val-sa { font-size: 80px; font-weight: 900; color: #fff; margin: 5px 0; transition: all 0.2s; text-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }
        .status-ghost { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #ff00ff; height: 12px; font-weight: bold; }
        
        .btn-sa { background: #ffffff; color: #000; border: none; width: 100%; padding: 25px; font-size: 26px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; transition: all 0.3s; border-radius: 4px; box-shadow: 0 6px 0 #444; z-index: 10; position: relative; }
        .btn-sa:active { transform: translateY(4px); box-shadow: 0 2px 0 #222; }
        
        .metrics-sync { display: flex; gap: 8px; margin-top: 15px; }
        .m-card { flex: 1; background: #030303; border: 1px solid #111; padding: 10px; text-align: center; }
        .m-label { font-size: 7px; color: #333; margin-bottom: 4px; }
        .m-val { font-size: 16px; font-weight: 900; }

        .favelinha-box { margin-top: 15px; background: #020202; border: 1px solid #0d0d0d; flex: 1; overflow-y: auto; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #080808; color: #222; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 14px 12px; border-bottom: 1px solid #060606; color: #444; }
        .row-on { color: #fff !important; background: rgba(0, 255, 255, 0.03); }
        .cmd-e { color: #00ff41 !important; font-weight: bold; }
        .cmd-p { color: #ff4141 !important; font-weight: bold; }
        .pink-v { color: #ff00ff !important; font-weight: bold; text-shadow: 0 0 15px #ff00ff; }
        
        .sa-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid #111; display: flex; justify-content: space-between; font-size: 9px; color: #222; }
    </style>
</head>
<body>
<div id="main-shell">
    <div class="sa-header"><span>S.A._V87_CORE_EXPLOSION</span><span>05:01</span></div>
    
    <div class="core-panel">
        <div class="core-row"><span class="core-label">NOVA_SEED:</span><span class="core-val">Vc07iBwJ...8tjW</span></div>
        <div class="core-row"><span class="core-label">NUCLEO_SHA256:</span><span class="core-val">72f6182f...d4bc</span></div>
        <div class="core-row"><span class="core-label">PRESSAO_RTP:</span><span id="p-val" class="core-val" style="color:#00ff41">MÁXIMA</span></div>
    </div>

    <div class="quantum-display">
        <div class="status-ghost" id="ghost-status">AGUARDANDO QUEBRA DA BALIZA...</div>
        <div class="val-sa" id="val-sa">0.00x</div>
        <button class="btn-sa" id="btn-fire">CAPTURAR_CORREÇÃO</button>
    </div>

    <div class="metrics-sync">
        <div class="m-card"><div class="m-label">LIBERADO</div><div id="m-lib" class="m-val" style="color:#00ff41">--%</div></div>
        <div class="m-card"><div class="m-label">PENDENTE</div><div id="m-pen" class="m-val" style="color:#ffcc00">--%</div></div>
        <div class="m-card"><div class="m-label">VÁCUO</div><div id="m-vac" class="m-val" style="color:#ff00ff">0</div></div>
    </div>

    <div class="favelinha-box">
        <table>
            <thead><tr><th>ALVO_X</th><th>S.A.(-50%)</th><th>STAKE</th><th>CMD</th></tr></thead>
            <tbody id="fav-body"></tbody>
        </table>
    </div>

    <div class="sa-footer">
        <span>STAKE: R$ 0,10 / R$ 0,20 / R$ 1,00</span>
        <span id="shield-info">IPI: CORE_EXPLOSION_V87</span>
    </div>
</div>

<script>
    (function() {
        const _K = { E: "RU5UUkE=", P: "UFVMQQ==", S1: "UiQgMCwxMA==", S2: "UiQgMCwyMA==", S3: "UiQgMSwwMA==" };
        const b = document.getElementById('btn-fire');
        const v = document.getElementById('val-sa');
        const f = document.getElementById('fav-body');
        const s = document.getElementById('ghost-status');

        let isCalc = false;
        let vacCount = 0;
        let history = [];

        function render(last) {
            if(last) history.unshift(last);
            if(history.length > 15) history.pop();
            const wins = history.filter(x => (x * 0.5) >= 1.5).length;
            const lib = Math.round((wins / (history.length || 1)) * 100);
            document.getElementById('m-lib').innerText = lib + "%";
            document.getElementById('m-pen').innerText = (100 - lib) + "%";
            document.getElementById('m-vac').innerText = vacCount;

            f.innerHTML = history.map((x, i) => {
                const saVal = (x * 0.5).toFixed(2);
                const isEntra = saVal >= 1.50;
                let stk = '---';
                if (saVal >= 50.00) stk = atob(_K.S3);
                else if (saVal >= 2.00) stk = atob(_K.S2);
                else if (isEntra) stk = atob(_K.S1);

                return `<tr class="${i===0?'row-on':''}">
                    <td>${x.toFixed(2)}x</td>
                    <td class="${x >= 100 ? 'pink-v' : ''}">${saVal}x</td>
                    <td>${stk}</td>
                    <td class="${isEntra?'cmd-e':'cmd-p'}">${isEntra?atob(_K.E):atob(_K.P)}</td>
                </tr>`;
            }).join('');
        }

        b.addEventListener('click', () => {
            if (isCalc) return;
            isCalc = true; b.disabled = true;
            v.style.opacity = "0.05";
            s.innerText = "SINTONIZANDO NUCLEO SHA256...";

            setTimeout(() => {
                const r = Math.random();
                let raw, col, msg;

                // Após a baliza exaustiva das fotos (muitos 1.1x e 1.4x), a semente NOVA força a rosa
                if (history[0] <= 1.20 || vacCount >= 2) { 
                    raw = (320 + Math.random() * 680); 
                    col = "#ff00ff"; 
                    msg = "CORE_EXPLOSION: ROSA DE CORREÇÃO"; 
                    vacCount = 0;
                } else if (r > 0.35) { 
                    raw = (6.0 + Math.random() * 20); 
                    col = "#fff"; 
                    msg = "ENTRA: RECUPERAÇÃO DE CICLO"; 
                    vacCount = 0;
                } else { 
                    raw = (1.0 + Math.random() * 0.10); 
                    col = "#444"; 
                    msg = "PULA: AGUARDANDO QUEBRA"; 
                    vacCount++;
                }

                const final = (raw * 0.5).toFixed(2);
                v.innerText = final + "x"; v.style.color = col; v.style.opacity = "1";
                s.innerText = msg;
                b.innerText = final >= 1.50 ? atob(_K.E) : atob(_K.P);
                render(raw);
                
                setTimeout(() => { 
                    isCalc = false; b.disabled = false;
                    b.innerText = "NOVO SCAN DE NUCLEO";
                }, 2000); 
            }, 600);
        });

        // Histórico real da Imagem 9 e 10
        [1.30, 1.49, 1.35, 1.43, 1.16, 1.02, 1.13, 1.42, 1.49, 1.00].forEach(x => render(x));
    })();
</script>
</body>
</html>
