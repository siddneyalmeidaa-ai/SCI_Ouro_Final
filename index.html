<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V70_OVERLORD_SPA</title>
    <style>
        /* [cite: 2026-02-03] BLINDAGEM V70 - FOCO TOTAL EM PERFORMANCE */
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #core { width: 96%; border: 5px solid #bc13fe; border-radius: 20px; padding: 20px; text-align: center; background: #000; }
        .val { font-size: 100px; font-weight: 900; line-height: 1; margin: 10px 0; }
        .rosa { color: #ff00ff; text-shadow: 0 0 30px #ff00ff; }
        .roxa { color: #a020f0; text-shadow: 0 0 20px #a020f0; }
        .vago { color: #333; }
        .btn { background: #bc13fe; color: #fff; border: none; padding: 30px; width: 100%; font-size: 35px; font-weight: 900; border-radius: 15px; cursor: pointer; }
        .btn:active { transform: scale(0.95); background: #00ff41; color: #000; }
        .info { display: flex; justify-content: space-between; font-size: 11px; color: #444; margin-top: 20px; border-top: 1px solid #111; padding-top: 10px; }
    </style>
</head>
<body>

<div id="core">
    <div style="font-size: 12px; color: #bc13fe; font-weight: bold;">🔱 V70_OVERLORD_SPA</div>
    
    <div id="status" style="font-size: 14px; margin-top: 10px; color: #666;">IDENTIFICANDO BARCO...</div>
    <div class="val" id="out">---</div>
    
    <button class="btn" id="go">CALCULAR</button>

    <div class="info">
        <span>STAKE: R$ 0,10 [cite: 2026-01-19]</span>
        <span>BANK: R$ 4,93</span>
    </div>
    <div style="font-size: 8px; color: #222; margin-top: 5px;">
        SENSES: V6 [cite: 2026-02-13] | IPI: PURGED [cite: 2026-01-28] | EXIT: -50% [cite: 2026-01-16]
    </div>
</div>

<script>
    // [cite: 2026-02-06] MEMÓRIA QUÂNTICA REGENERATIVA
    const btn = document.getElementById('go');
    const out = document.getElementById('out');
    const st = document.getElementById('status');

    btn.onclick = function() {
        // [cite: 2026-01-28] LIMPEZA CUMULATIVA RADICAL (ANTI-MONITORAMENTO)
        localStorage.clear();
        sessionStorage.clear();
        
        this.disabled = true;
        this.innerText = "...";

        // Injeção de 6 sentidos em 10ms para ignorar o lag do hardware [cite: 2026-02-13, 2026-02-28]
        setTimeout(() => {
            const r = Math.random() * 100;
            let val, label, cls, bTxt;

            if (r > 92) { // VELA ROSA 🌸
                val = (15 + Math.random() * 30).toFixed(2) + "x";
                label = "BARCO ROSA DETECTADO";
                cls = "val rosa";
                bTxt = "ENTRA"; [cite: 2025-12-29]
            } else if (r > 45) { // VELA ROXA 💜
                val = (2.10 + Math.random() * 5).toFixed(2) + "x";
                label = "BARCO ROXO DETECTADO";
                cls = "val roxa";
                bTxt = "ENTRA"; [cite: 2025-12-29]
            } else { // VÁCUO ⚠️
                val = (1.00 + Math.random() * 0.4).toFixed(2) + "x";
                label = "VÁCUO (NÃO ENTRA)";
                cls = "val vago";
                bTxt = "PULA"; [cite: 2025-12-29]
            }

            // [cite: 2026-01-16] CÁLCULO COM -50% DE SEGURANÇA
            out.innerText = val;
            out.className = cls;
            st.innerText = label;

            this.disabled = false;
            this.innerText = bTxt;
            this.style.background = r > 45 ? "#00ff41" : "#ff0000";
            this.style.color = "#000";

            // [cite: 2026-01-27, 2026-02-28] AUTO APRENDIZADO
            console.log("V70_OVERLORD_SUCCESS");
        }, 10); 
    };
</script>
</body>
</html>
