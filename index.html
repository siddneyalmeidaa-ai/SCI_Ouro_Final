<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>S.A. GHOST_SUPREMACY_V15</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; padding: 10px; font-size: 11px; margin: 0; }
        .terminal { height: 180px; overflow-y: auto; border: 1px solid #00ffcc; padding: 5px; margin-top: 5px; background: rgba(0,15,5,0.9); }
        .radar-box { border: 1px solid #00ffcc; padding: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .scan-active { color: #ff0055; font-weight: bold; animation: blink 0.6s infinite; }
        .header { display: flex; justify-content: space-between; background: #1a1a1a; color: #00ffcc; padding: 4px 10px; border-bottom: 2px solid #ff0055; }
        #display { text-align:center; font-size: 48px; padding: 10px; font-weight: 900; text-shadow: 0 0 10px #00ffcc; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
        .seed-info { font-size: 9px; color: #888; text-align: center; margin-bottom: 5px; }
    </style>
</head>
<body onclick="processSync()">
    <div class="header">
        <span>S.A. GHOST_SUPREMACY_V15</span>
        <span id="clock">07:07</span>
    </div>

    <div class="radar-box">
        <span>STATUS_DNA:</span>
        <span id="radar-status">SYNC_MANUAL_SEED</span>
    </div>

    <div class="seed-info">SEED_ATIVA: aK7pL2vR8sW3mQ9bN1zX4-0-0</div>

    <div id="display">READY</div>
    <div id="delay-info" style="text-align:center; color:#ff0055; font-size: 10px;">PROJEÇÃO: REGRA -50% + DELAY (-0.08x) [cite: 2026-01-16]</div>

    <div class="terminal" id="term">
        > AGUARDANDO SINCRONIA DE DECOLAGEM...<br>
        > IDENTITY: BLINDADA | DNA: 0.428 [cite: 2026-01-23]
    </div>

<script>
    const term = document.getElementById('term');
    const display = document.getElementById('display');
    const radar = document.getElementById('radar-status');
    
    // Semente manual integrada
    const CLIENT_SEED = "aK7pL2vR8sW3mQ9bN1zX4-0-0";

    function processSync() {
        const entropy = window.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
        
        // Simula bloqueio de segurança se a latência subir [cite: 2026-01-27]
        if (entropy > 0.82) {
            radar.innerText = "!!! RADAR DETECTADO !!!";
            radar.className = "scan-active";
            logEvent("ALERTA: BLOQUEIO DE INGESTÃO 1.00x EVITADO"); 
            
            display.innerText = "PULA";
            display.style.color = "#ff0055";
        } else {
            radar.innerText = "ESTÁVEL / GHOST_V15";
            radar.className = "";
            
            // Cálculo com a Regra de Ouro (-50% + Ajuste) [cite: 2026-01-16, 2026-01-27]
            const projection = (entropy * 2.2 + 1.20);
            const secureExit = ((projection * 0.5) - 0.08).toFixed(2);
            
            display.innerText = secureExit + "x";
            display.style.color = "#00ffcc";
            logEvent(`SEED_SYNC: ${CLIENT_SEED.substring(0,6)}... | EXIT: ${secureExit}x`);
        }
    }

    function logEvent(msg) {
        const div = document.createElement('div');
        div.style.borderBottom = "1px solid #1a1a1a";
        div.innerHTML = `[${new Date().toLocaleTimeString()}] > ${msg}`;
        term.prepend(div);
        if(term.childNodes.length > 12) term.removeChild(term.lastChild);
        console.clear(); 
    }

    /* SINCRONIA DE TEMPO [cite: 2026-01-20] */
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
