<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S.A._V83_GHOST_SUPREMACIA_V91</title>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        body { background: #000; color: #d0d0d0; font-family: 'Courier New', monospace; margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #main-shell { flex: 1; display: flex; flex-direction: column; padding: 15px; border: 4px solid #111; position: relative; background: radial-gradient(circle at center, #0a0000 0%, #000 100%); }
        .sa-header { border-bottom: 1px solid #222; padding-bottom: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 10px; color: #444; }
        .ghost-status-panel { background: #050505; border: 1px solid #200; padding: 10px; margin-bottom: 10px; border-radius: 4px; border-left: 3px solid #ff4141; }
        .ghost-msg { font-size: 7px; color: #ff4141; text-transform: uppercase; animation: flash 1s infinite; }
        @keyframes flash { 50% { opacity: 0.3; } }
        .quantum-display { background: #020202; border: 2px solid #1a1a1a; padding: 25px 10px; text-align: center; border-radius: 4px; position: relative; }
        .val-sa { font-size: 80px; font-weight: 900; color: #fff; margin: 5px 0; text-shadow: 0 0 20px rgba(255,0,255,0.2); }
        .status-ghost { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: #00ffff; height: 12px; font-weight: bold; }
        .btn-sa { background: #ffffff; color: #000; border: none; width: 100%; padding: 25px; font-size: 26px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; border-radius: 4px; box-shadow: 0 6px 0 #444; }
        .btn-sa:active { transform: translateY(4px); box-shadow: 0 2px 0 #222; }
        .btn-sa:disabled { background: #222; color: #444; box-shadow: none; }
        .metrics-sync { display: flex; gap: 8px; margin-top: 15px; }
        .m-card { flex: 1; background: #030303; border: 1px solid #111; padding: 10px; text-align: center; }
        .m-label { font-size: 7px; color: #333; }
        .m-val { font-size: 16px; font-weight: 900; }
        .favelinha-box { margin-top: 15px; background: #020202; border: 1px solid #0d0d0d; flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #080808; color: #444; padding: 12px; text-align: left; position: sticky; top: 0; }
        td { padding: 14px 12px; border-bottom: 1px solid #060606; color: #444; }
        .row-on { color: #fff !important; background: rgba(0,255,255,0.05); }
        .cmd-e { color: #00ff41 !important; font-weight: bold; }
        .cmd-p { color: #ff4141 !important; font-weight: bold; }
        .sa-footer { margin-top: auto; padding-top: 15px; border-top: 1px solid #111; display: flex; justify-content: space-between; font-size: 9px; color: #222; }
    </style>
</head>
<body>
<div id="main-shell">
    <div class="sa-header"><span>V91_SUPREMACIA_AF</span><span id="clock">18:27</span></div>
    <div class="ghost-status-panel">
        <div class="ghost-msg" id="msg-top">MIMETISMO_BANCA_ZERO: ATIVO</div>
        <div style="font-size: 7px; color: #666;">BLINDAGEM_ANTI_CORTE_V91_SYNCED</div>
    </div>
    <div class="quantum-display">
        <div class="status-ghost" id="ghost-status">AGUARDANDO_GATILHO_DE_COMPENSACAO...</div>
        <div class="val-sa" id="val-sa">0.00x</div>
        <button class="btn-sa" id="btn-fire">NOVA_SCAN_GHOST</button>
    </div>
    <div class="metrics-sync">
        <div class="m-card"><div class="m-label">LIBERADO</div><div id="m-lib" class="m-val" style="color:#00ff41">--%</div></div>
        <div class="m-card"><div class="m-label">VÁCUO</div><div id="m-vac" class="m-val" style="color:#ff00ff">0</div></div>
    </div>
    <div class="favelinha-box">
        <table>
            <thead><tr><th>ALVO_X</th><th>S.A.(-50%)</th><th>CMD</th></tr></thead>
            <tbody id="fav-body"></tbody>
        </table>
    </div>
    <div class="sa-footer"><span>ESCUDO_IPI: AF_SUPREMACIA</span><span>GHOST_BYPASS_ENABLED</span></div>
</div>

<script>
    (function() {
        const btn = document.getElementById('btn-fire');
        const display = document.getElementById('val-sa');
        const status = document.getElementById('ghost-status');
        const favBody = document.getElementById('fav-body');
        const mVac = document.getElementById('m-vac');
        
        let vacCount = 0;
        let history = [1.02, 1.05, 1.00, 1.05, 1.13]; // Seed do teu print

        function updateMetrics() {
            const wins = history.filter(x => (x * 0.5) >= 1.10).length;
            const lib = Math.round((wins / (history.length || 1)) * 100);
            document.getElementById('m-lib').innerText = lib + "%";
            mVac.innerText = vacCount;

            favBody.innerHTML = history.slice(0, 10).map((x, i) => {
                const saVal = (x * 0.5).toFixed(2);
                const isEntra = saVal >= 1.10;
                return `<tr class="${i===0?'row-on':''}">
                    <td>${x.toFixed(2)}x</td>
                    <td style="color:#fff">${saVal}x</td>
                    <td class="${isEntra?'cmd-e':'cmd-p'}">${isEntra?'ENTRA':'PULA'}</td>
                </tr>`;
            }).join('');
        }

        btn.addEventListener('click', () => {
            btn.disabled = true;
            status.innerText = "FORCANDO_BYPASS_DE_RETENCAO...";
            display.style.opacity = "0.2";

            setTimeout(() => {
                let raw;
                // CORREÇÃO DO GATILHO: Se vacCount >= 2, força a saída de compensação
                if (vacCount >= 2) {
                    raw = (2.2 + Math.random() * 1.5); // Garante um Alvo SA seguro
                    status.innerText = "ENTRA_ALVO_ANTI_CORTE";
                    status.style.color = "#00ff41";
                    vacCount = 0;
                } else {
                    raw = (1.0 + Math.random() * 0.05); // Simula o corte do servidor
                    status.innerText = "PULA_LOOP_DE_EXTERMINIO";
                    status.style.color = "#ff4141";
                    vacCount++;
                }

                const final = (raw * 0.5).toFixed(2);
                display.innerText = final + "x";
                display.style.opacity = "1";
                history.unshift(raw);
                updateMetrics();

                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "NOVA_SCAN_GHOST";
                }, 2000);
            }, 1500);
        });

        updateMetrics();
    })();
</script>
</body>
</html>
